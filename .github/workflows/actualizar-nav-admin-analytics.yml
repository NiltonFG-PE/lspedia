name: Actualizar navegación Admin Analytics

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/actualizar-nav-admin-analytics.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Actualizar etiqueta del panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin/estado.html')
          s = p.read_text(encoding='utf-8')
          viejo = '<a href="busquedas.html">🔎 Búsquedas sin resultado</a>'
          nuevo = '<a href="busquedas.html">📊 Analytics</a>'
          if viejo not in s:
              raise SystemExit('No se encontró la etiqueta antigua esperada')
          p.write_text(s.replace(viejo, nuevo, 1), encoding='utf-8')
          PY
          grep -F '📊 Analytics' admin/estado.html
          git diff --check

      - name: Publicar y limpiar temporal
        run: |
          rm -f .github/workflows/actualizar-nav-admin-analytics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Unificar navegación del Admin Analytics"
          git push origin develop
