name: Auditar categorias temporal

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/auditar-categorias-temporal.yml'

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Revisar categorias especiales
        shell: bash
        run: |
          python - <<'PY'
          import json, collections
          from pathlib import Path
          for nombre, ruta in [('DICCIONARIO','data/palabras.json'),('VOCABULARIO','data/vocabulario.json')]:
              data=json.loads(Path(ruta).read_text(encoding='utf-8'))
              conteo=collections.Counter(str(x.get('categoria') or '').strip() for x in data if isinstance(x,dict))
              print('\n===',nombre,'CATEGORIAS <=2 O COMPUESTAS ===')
              for cat,n in sorted(conteo.items()):
                  if n <= 2 or '/' in cat:
                      print(f'\n{cat!r} ({n})')
                      for x in data:
                          if isinstance(x,dict) and str(x.get('categoria') or '').strip()==cat:
                              print(' -',x.get('palabra'), '|', (x.get('definicion') or '')[:130].replace('\n',' '))
          PY
