name: Aplicar video M cursiva mayúscula

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/aplicar-video-m-cursiva.yml'
      - 'scripts/.tmp_m_video/**'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reconstruir video original
        run: |
          mkdir -p img/alfabetizacion/grafias
          cat scripts/.tmp_m_video/chunk*.b64 | base64 -d > img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4
          test "$(stat -c%s img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4)" = "65000"
          echo "778495f1899150f0c19cee81a9076171d06f372b7aadb6a5adfe777c214f9da5  img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4" | sha256sum -c -
          file img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4

      - name: Validar Alfabetización
        run: python scripts/validar_alfabetizacion.py

      - name: Limpiar archivos temporales y publicar
        run: |
          rm -rf scripts/.tmp_m_video
          rm -f .github/workflows/aplicar-video-m-cursiva.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Agregar grafía M cursiva mayúscula"
          git push origin develop
