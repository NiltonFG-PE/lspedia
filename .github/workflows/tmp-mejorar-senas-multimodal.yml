name: Temporal mejorar señas IA multimodal

on:
  push:
    branches: [develop]
    paths:
      - "scripts/tmp_mejorar_senas_multimodal.py"
      - ".github/workflows/tmp-mejorar-senas-multimodal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Aplicar mejora
        run: python scripts/tmp_mejorar_senas_multimodal.py
      - name: Validar JavaScript
        shell: bash
        run: |
          cp js/lab-senas-ia.js /tmp/lab-senas-ia.mjs
          node --check /tmp/lab-senas-ia.mjs
      - name: Validar dataset y laboratorio
        run: python scripts/validar_senas_ia.py
      - name: Validar seguridad
        run: python scripts/validar_seguridad.py
      - name: Verificar diff
        run: git diff --check
      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/lab-senas-ia.js lab-senas-ia.html scripts/validar_senas_ia.py data/senas-ia-dataset.json
          git commit -m "feat: mejorar buscador por señas con rostro y calidad de captura"
          git push origin develop
