name: Sincronizar español educativo del Diccionario

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/sincronizar-espanol-educativo-20260912.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronizar correcciones
        run: python scripts/sincronizar_espanol_educativo_20260912.py

      - name: Validar Diccionario y JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/palabras.json > /dev/null
          python scripts/validar_lspedia.py --fuente diccionario
          node --check js/buscador-visual.js
          node --check js/i18n.js
          git diff --check

      - name: Guardar cambios y retirar temporales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sincronizar-espanol-educativo-20260912.yml
          git rm scripts/sincronizar_espanol_educativo_20260912.py
          git add data/palabras.json js/buscador-visual.js js/i18n.js sw.js
          git commit -m "Corregir español visible y tolerar errores de búsqueda"
          git push origin HEAD:develop
