name: Aplicar índice A-Z de Vocabulario

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/aplicar-indice-vocabulario.yml'
      - 'scripts/aplicar_indice_vocabulario.py'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar índice A-Z doble
        run: python scripts/aplicar_indice_vocabulario.py

      - name: Validar JavaScript
        run: node --check js/script.js

      - name: Validar LSPedia
        run: python scripts/validar_lspedia.py

      - name: Validar diferencias
        run: git diff --check

      - name: Comprobar índices A-Z
        run: |
          grep -q 'id="btnToggleAbc"' index.html
          grep -q 'id="btnToggleAbcVocabulario"' index.html
          grep -q 'id="indiceAlfabeticoVocabulario"' index.html
          grep -q 'filtrarVocabularioPorLetra' js/script.js
          grep -q 'INDICE_VOCABULARIO_V1_20260910' css/mejoras-producto.css
          python - <<'PY'
          from pathlib import Path
          h = Path('index.html').read_text(encoding='utf-8')
          assert h.count('id="btnToggleAbc"') == 1
          assert h.count('id="btnToggleAbcVocabulario"') == 1
          assert h.count('id="indiceAlfabetico"') == 1
          assert h.count('id="indiceAlfabeticoVocabulario"') == 1
          bloque_dic = h[h.index('class="buscador-indice-linea"'):h.index('id="sugerencias"')]
          assert bloque_dic.index('filaBotonIndiceAlfabetico') < bloque_dic.index('class="input-group')
          inicio_voc = h.index('id="bloqueBuscadorCategorias"')
          fin_voc = h.index('id="panelCategorias"', inicio_voc)
          bloque_voc = h[inicio_voc:fin_voc]
          assert bloque_voc.index('filaBotonIndiceAlfabeticoVocabulario') < bloque_voc.index('id="buscarCategorias"')
          print('Estructura A-Z correcta en Diccionario y Vocabulario.')
          PY

      - name: Limpiar migración temporal y publicar
        run: |
          rm -f scripts/aplicar_indice_vocabulario.py
          rm -f .github/workflows/aplicar-indice-vocabulario.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "Agregar índice A-Z a Vocabulario"
          git push origin develop
