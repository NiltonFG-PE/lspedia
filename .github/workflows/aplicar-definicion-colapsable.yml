name: Aplicar definición colapsable Diccionario

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/aplicar_definicion_colapsable.py'
      - '.github/workflows/aplicar-definicion-colapsable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar mejora
        run: python scripts/aplicar_definicion_colapsable.py

      - name: Validar JavaScript
        run: node --check js/script.js

      - name: Validar LSPedia
        run: python scripts/validar_lspedia.py

      - name: Validar estructura de la mejora
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path('js/script.js').read_text(encoding='utf-8')
          css = Path('css/mejoras-producto.css').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert 'DEFINICION_COLAPSABLE_DICCIONARIO_V1_20260911' in js
          assert 'data-definicion-colapsable' in js
          assert 'Ver más <span aria-hidden="true">↓</span>' in js
          assert 'Ver menos <span aria-hidden="true">↑</span>' in js
          assert '-webkit-line-clamp: 4;' in css
          assert '-webkit-line-clamp: 6;' in css
          assert 'const VERSION_APP = "v72";' in sw
          print('Estructura correcta')
          PY

      - name: Revisar formato Git
        run: git diff --check

      - name: Publicar cambios y limpiar migración
        run: |
          rm -f scripts/aplicar_definicion_colapsable.py
          rm -f .github/workflows/aplicar-definicion-colapsable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/script.js css/mejoras-producto.css sw.js scripts/aplicar_definicion_colapsable.py .github/workflows/aplicar-definicion-colapsable.yml
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar"
            exit 0
          fi
          git commit -m "Compactar definiciones largas del Diccionario"
          git push origin develop
