name: Mejorar footer y redes de LSPedia

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/mejorar-footer-redes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mejorar-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar diseño y microanimaciones
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          texto = index.read_text(encoding='utf-8')

          # Si por algún motivo se reejecuta, sustituye el mismo bloque en vez de duplicarlo.
          patron_previo = re.compile(r'\n<style id="footer-microanimaciones">.*?</style>\n', re.S)
          texto = patron_previo.sub('\n', texto)

          marcador = '    <!-- Pie de página LSPedia -->'
          if marcador not in texto:
              marcador = '<!-- Pie de página LSPedia -->'
          if marcador not in texto:
              raise SystemExit('ERROR: no se encontró el marcador del pie de página.')

          estilos = r'''
<style id="footer-microanimaciones">
    /* Footer LSPedia: jerarquía más compacta y microanimaciones suaves. */
    .footer-lspedia .footer-logo {
        width: 132px !important;
        max-width: 38vw;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 5px 10px rgba(15, 58, 112, 0.08));
    }

    .footer-lspedia .footer-redes {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .footer-lspedia .footer-red-icono {
        position: relative;
        width: 46px !important;
        height: 46px !important;
        flex: 0 0 46px;
        border-radius: 50%;
        background: #f7f9fc;
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 5px 14px rgba(15, 23, 42, 0.08);
        overflow: visible;
        transform-origin: center;
        animation: footerRedFlotar 2.8s ease-in-out infinite;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .footer-lspedia .footer-red-icono::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: inherit;
        border: 2px solid rgba(56, 189, 248, 0.16);
        opacity: 0;
        transform: scale(0.84);
        animation: footerRedAro 2.8s ease-out infinite;
        pointer-events: none;
    }

    .footer-lspedia .footer-red-icono svg {
        width: 21px !important;
        height: 21px !important;
    }

    .footer-lspedia .footer-red-icono:nth-child(2),
    .footer-lspedia .footer-red-icono:nth-child(2)::before {
        animation-delay: 0.36s;
    }

    .footer-lspedia .footer-red-icono:nth-child(3),
    .footer-lspedia .footer-red-icono:nth-child(3)::before {
        animation-delay: 0.72s;
    }

    .footer-lspedia .footer-red-icono:hover,
    .footer-lspedia .footer-red-icono:focus-visible {
        animation-play-state: paused;
        transform: translateY(-4px) scale(1.08);
        box-shadow: 0 9px 20px rgba(15, 23, 42, 0.14);
        outline: none;
    }

    /* Recuadro de autoría/licencia: plomo claro con un brillo que pasa
       ocasionalmente y una respiración casi imperceptible. */
    .footer-lspedia .footer-bottom {
        position: relative;
        overflow: hidden;
        margin-top: 24px;
        padding: 20px 22px !important;
        border-radius: 24px;
        border: 1px solid #dbe3ec;
        background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 52%, #f7f9fc 100%);
        box-shadow: 0 8px 22px rgba(71, 85, 105, 0.09);
        animation: footerDerechosRespira 4.6s ease-in-out infinite;
    }

    .footer-lspedia .footer-bottom::after {
        content: "";
        position: absolute;
        top: -45%;
        bottom: -45%;
        left: -38%;
        width: 26%;
        transform: rotate(16deg);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.78), transparent);
        filter: blur(2px);
        pointer-events: none;
        animation: footerDerechosBrillo 5.8s ease-in-out infinite;
    }

    .footer-lspedia .footer-bottom > * {
        position: relative;
        z-index: 1;
    }

    .footer-lspedia .footer-escudo {
        box-shadow: 0 0 0 7px rgba(59, 130, 246, 0.055);
        animation: footerEscudoPulso 3.4s ease-in-out infinite;
    }

    @keyframes footerRedFlotar {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.035); }
    }

    @keyframes footerRedAro {
        0%, 46% { opacity: 0; transform: scale(0.84); }
        58% { opacity: 0.62; }
        82%, 100% { opacity: 0; transform: scale(1.18); }
    }

    @keyframes footerDerechosRespira {
        0%, 100% { box-shadow: 0 8px 22px rgba(71, 85, 105, 0.09); transform: translateY(0); }
        50% { box-shadow: 0 11px 27px rgba(71, 85, 105, 0.13); transform: translateY(-1px); }
    }

    @keyframes footerDerechosBrillo {
        0%, 56% { left: -38%; opacity: 0; }
        64% { opacity: 0.9; }
        84% { left: 116%; opacity: 0.35; }
        100% { left: 116%; opacity: 0; }
    }

    @keyframes footerEscudoPulso {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.045); }
    }

    @media (max-width: 576px) {
        .footer-lspedia .footer-logo {
            width: 118px !important;
        }
        .footer-lspedia .footer-redes {
            gap: 12px;
        }
        .footer-lspedia .footer-red-icono {
            width: 43px !important;
            height: 43px !important;
            flex-basis: 43px;
        }
        .footer-lspedia .footer-red-icono svg {
            width: 20px !important;
            height: 20px !important;
        }
        .footer-lspedia .footer-bottom {
            margin: 20px 0 4px;
            padding: 18px 16px !important;
            border-radius: 22px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .footer-lspedia .footer-red-icono,
        .footer-lspedia .footer-red-icono::before,
        .footer-lspedia .footer-bottom,
        .footer-lspedia .footer-bottom::after,
        .footer-lspedia .footer-escudo {
            animation: none !important;
        }
    }
</style>
'''

          texto = texto.replace(marcador, estilos + '\n' + marcador, 1)
          index.write_text(texto, encoding='utf-8', newline='\n')

          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          sw_nuevo, cambios = re.subn(
              r'const VERSION_APP = "v28";',
              'const VERSION_APP = "v29";',
              sw_texto,
              count=1,
          )
          if cambios != 1:
              raise SystemExit('ERROR: no se encontró VERSION_APP v28 en sw.js.')
          sw.write_text(sw_nuevo, encoding='utf-8', newline='\n')
          PY

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="footer-microanimaciones"' index.html
          grep -q 'footerRedFlotar' index.html
          grep -q 'footerDerechosBrillo' index.html
          grep -q 'width: 118px !important' index.html
          grep -q 'const VERSION_APP = "v29";' sw.js
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Mejorar footer y animaciones de redes"
          git push origin HEAD:develop
