name: Mejorar footer de LSPedia

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/mejorar-footer-redes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mejorar-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar mejora del footer
        run: python scripts/aplicar_footer_animado.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="footer-microanimaciones"' index.html
          grep -q 'footerRedFlotar' index.html
          grep -q 'footerDerechosBrillo' index.html
          grep -q 'const VERSION_APP = "v29";' sw.js
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Mejorar footer y animaciones de redes"
          git push origin HEAD:develop
