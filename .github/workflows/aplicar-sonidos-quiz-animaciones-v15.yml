name: Sonidos y controles Quiz V15

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/aplicar-sonidos-quiz-animaciones-v15.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar mejoras
        run: python .tmp/aplicar_sonidos_quiz_animaciones_v15.py

      - name: Validar JavaScript e integración
        run: |
          node --check js/quiz.js
          node --check js/alfabetizacion.js
          node --check js/matematicas.js
          node --check js/oraciones.js
          grep -q 'id="btnQuizNivel"' index.html
          grep -q 'id="btnQuizModo"' index.html
          grep -q 'id="quizPanelNivel"' index.html
          grep -q 'id="quizPanelModo"' index.html
          grep -q 'reproducirSonidoCorrecto' js/quiz.js
          grep -q 'reproducirSonidoIncorrecto' js/quiz.js
          grep -q 'reproducirSonidoCorrecto' js/alfabetizacion.js
          grep -q 'reproducirSonidoIncorrecto' js/alfabetizacion.js
          grep -q 'reproducirSonidoCorrectoMat' js/matematicas.js
          grep -q 'reproducirSonidoIncorrectoMat' js/matematicas.js
          grep -q 'sonidoCorrectoJuego' js/oraciones.js
          grep -q 'sonidoIncorrectoJuego' js/oraciones.js
          grep -q 'animation-iteration-count: 3' css/quiz.css
          grep -q 'VERSION_APP = "v15"' sw.js

      - name: Guardar cambios en develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .tmp/aplicar_sonidos_quiz_animaciones_v15.py
          rm -f .github/workflows/aplicar-sonidos-quiz-animaciones-v15.yml
          git add -A
          git commit -m "Agregar sonidos y separar controles del Quiz"
          git push origin develop
