name: Actualizar sitemap

on:
  push:
    branches:
      - develop
    paths:
      - "data/palabras.json"
      - "scripts/generar_sitemap.py"
      - ".github/workflows/actualizar-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-sitemap-develop
  cancel-in-progress: true

jobs:
  generar-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar sitemap.xml
        run: python scripts/generar_sitemap.py

      - name: Guardar sitemap actualizado
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml ya estaba actualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Actualizar sitemap automáticamente"
          git push origin HEAD:develop
