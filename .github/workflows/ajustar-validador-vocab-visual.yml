name: Ajustar validador Vocabulario visual

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/ajustar-validador-vocab-visual.yml"

permissions:
  contents: write

concurrency:
  group: ajustar-validador-vocab-visual-develop
  cancel-in-progress: true

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ajustar validador
        run: python scripts/ajustar_validador_vocab_visual.py

      - name: Regenerar Vocabulario desde Hoja 2
        run: python scripts/generar_vocabulario.py

      - name: Validar producto
        shell: bash
        run: |
          python -m json.tool data/vocabulario.json > /dev/null
          python scripts/validar_lspedia.py --fuente vocabulario
          node --check js/quiz.js
          node --check js/buscador-visual.js
          git diff --check

      - name: Guardar y retirar archivos temporales
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ajustar-validador-vocab-visual.yml
          git rm scripts/ajustar_validador_vocab_visual.py
          git add scripts/validar_lspedia.py data/vocabulario.json
          git commit -m "Validar fichas visuales de Vocabulario sin video"
          git push origin HEAD:develop
