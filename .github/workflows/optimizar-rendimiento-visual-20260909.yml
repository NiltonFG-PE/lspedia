name: Optimizar rendimiento visual movil

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/optimizar-rendimiento-visual-20260909.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar optimizacion
        run: python scripts/optimizar_rendimiento_visual_20260909.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="rendimiento-movil-20260909"' index.html
          grep -q 'backdrop-filter: none !important;' index.html
          grep -q 'animation: vocabBuscadorAtencion 1.9s ease-in-out 2 !important;' index.html
          grep -q 'will-change: auto !important;' index.html
          test -f 'video/lspedia_transparente anterior.webm'
          node --check js/script.js
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Aligerar animaciones y scroll en movil"
          git push origin HEAD:develop
