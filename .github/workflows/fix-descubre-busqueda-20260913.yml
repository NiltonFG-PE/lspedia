name: Corregir Descubre durante búsqueda

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fix-descubre-busqueda-20260913.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar corrección
        run: python scripts/fix_descubre_busqueda_20260913.py

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          node --check js/script.js
          node --check sw.js
          grep -q 'Descubre.*permane' js/script.js
          grep -q 'VERSION_APP = "v108"' sw.js
          git diff --check

      - name: Guardar y limpiar temporales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-descubre-busqueda-20260913.yml
          git rm scripts/fix_descubre_busqueda_20260913.py
          git add js/script.js sw.js
          git commit -m "Mantener Descubre visible al escribir"
          git push origin HEAD:develop
