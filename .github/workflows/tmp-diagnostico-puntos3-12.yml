name: TMP diagnostico puntos 3-12

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-diagnostico-puntos3-12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Diagnostico
        shell: bash
        run: |
          set +e
          echo '=== LINEAS ==='
          wc -l index.html js/script.js css/estilos.css admin/busquedas.html sw.js
          echo '=== PALABRA/SEÑA DEL DIA script ==='
          grep -niE 'mostrar.*(senal|sena).*dia|senalDelDia|dia-rect|palabra del día|seña del día' js/script.js | head -n 120
          echo '=== PALABRA/SEÑA DEL DIA index ==='
          grep -niE 'senalDelDia|dia-rect|palabra del día|seña del día' index.html | head -n 120
          echo '=== MOSTRAR PALABRA ==='
          grep -nE '^function mostrarPalabra|function construirUrlPalabra|function obtenerIdPalabra|registrarProgresoPalabra' js/script.js | head -n 80
          echo '=== DATOS LISTOS ==='
          grep -nE 'lspedia:datosListos|window.App|procesarDatosApp|aplicarPalabrasActualizadasEnSesion' js/script.js | head -n 80
          echo '=== SCRIPT TAGS FINAL INDEX ==='
          tail -n 100 index.html
          echo '=== WORKFLOWS ==='
          ls -la .github/workflows
          echo '=== MEDIA NO CANONICA ALF ==='
          find img/alfabetizacion -type f | LC_ALL=C grep -P '[^\x00-\x7F]|[A-Z ]' | head -n 160
