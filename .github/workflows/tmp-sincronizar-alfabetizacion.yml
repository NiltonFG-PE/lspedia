name: TMP Sincronizar alfabetizacion

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-sincronizar-alfabetizacion.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
      - name: Probar CSV directo de Google Sheets
        shell: bash
        run: |
          set -euo pipefail
          URL='https://docs.google.com/spreadsheets/d/1fqC1aUpwdz6l0xRyYYfki7vJtjIql6sOEzpfWElknT0/gviz/tq?tqx=out:csv&sheet=AlfabetizacionEjemplos'
          code=$(curl -L -sS -o /tmp/alf.csv -w '%{http_code}' "$URL")
          echo "HTTP=$code"
          echo '--- muestra ---'
          head -n 5 /tmp/alf.csv || true
          echo '--- Tiburón ---'
          grep -in 'Tibur' /tmp/alf.csv || true
          test "$code" = '200'
          grep -qi 'Tibur' /tmp/alf.csv
