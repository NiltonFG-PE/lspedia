name: Temporal categorias y splash

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/ajuste-categorias-splash-temporal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar ajuste
        run: python scripts/aplicar_ajuste_categorias_splash_temporal.py

      - name: Validar
        shell: bash
        run: |
          node --check js/script.js
          node --check sw.js
          git diff --check
          grep -q 'COMPARTIR CATEGORÍAS' js/script.js
          grep -q 'btn-compartir-categoria' css/estilos.css
          grep -q 'agregarBotonCompartirCategoria(card.querySelector(".categoria-card"), nombre, "vocabulario")' js/script.js
          grep -q 'agregarBotonCompartirCategoria(card.querySelector(".categoria-dicc-card"), nombre, "diccionario")' js/script.js
          ! grep -q 'id="splash-visible-inmediato"' index.html
          grep -q 'fetchpriority="high" decoding="async"' index.html
          grep -q 'rel="preload" href="img/favicon.png"' index.html
          grep -q 'VERSION_APP = "v136"' sw.js

      - name: Publicar
        shell: bash
        run: |
          if git diff --quiet -- index.html js/script.js css/estilos.css sw.js; then
            echo "Los cambios ya estaban aplicados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/script.js css/estilos.css sw.js
          git commit -m "Compartir categorias y restaurar animacion del splash"
          git push origin HEAD:develop
