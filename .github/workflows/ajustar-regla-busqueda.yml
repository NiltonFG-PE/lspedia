name: Ajustar regla de búsqueda del Diccionario

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/ajustar-regla-busqueda.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ajustar-regla-busqueda-diccionario
  cancel-in-progress: false

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar regla definición + imagen
        shell: python
        run: |
          from pathlib import Path

          # 1) script.js: regla canónica del Diccionario.
          p = Path('js/script.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "// Regla pública vigente: palabra + categoría + imagen real.\n    // El video es opcional.",
              "// Regla pública vigente del Diccionario: palabra + definición + categoría + imagen real.\n    // El video es opcional: una ficha completa sin video sigue siendo buscable."
          )
          viejo = "if (!(p && p.palabra && p.categoria)) return false;\n        const imagen = String(p.imagen || '').split(',')[0].trim();"
          nuevo = "if (!(p && p.palabra && p.categoria && String(p.definicion || '').trim())) return false;\n        const imagen = String(p.imagen || '').split(',')[0].trim();"
          if viejo not in s and nuevo not in s:
              raise SystemExit('No se encontró el filtro canónico esperado en js/script.js')
          s = s.replace(viejo, nuevo)
          p.write_text(s, encoding='utf-8')

          # 2) security.js: misma regla compartida; no volver a exigir video.
          p = Path('js/security.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "Una entrada pública necesita imagen REAL; el video es opcional.",
              "Una entrada pública del Diccionario necesita definición + imagen REAL; el video es opcional."
          )
          viejo = "return !!(p && texto(p.palabra) && texto(p.categoria) && esImagenReal(p.imagen));"
          nuevo = "return !!(p && texto(p.palabra) && texto(p.definicion) && texto(p.categoria) && esImagenReal(p.imagen));"
          if viejo not in s and nuevo not in s:
              raise SystemExit('No se encontró filtrarPublicables esperado en js/security.js')
          s = s.replace(viejo, nuevo)
          p.write_text(s, encoding='utf-8')

          # 3) Validador: Diccionario requiere definición; Vocabulario conserva su regla propia.
          p = Path('scripts/validar_publicacion_publica.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "Regla vigente:\n- Diccionario y Vocabulario requieren palabra + categoría + imagen real.\n- El video es opcional para publicación.",
              "Regla vigente:\n- Diccionario requiere palabra + definición + categoría + imagen real.\n- Vocabulario requiere palabra + categoría + imagen real.\n- El video es opcional para publicación pública; Lo nuevo sí exige video."
          )
          viejo = '''def publicables(lista):\n    return [\n        item for item in lista\n        if isinstance(item, dict)\n        and texto(item.get(\"palabra\"))\n        and texto(item.get(\"categoria\"))\n        and imagen_real(item.get(\"imagen\"))\n    ]\n'''
          nuevo = '''def publicables(lista, requiere_definicion=False):\n    return [\n        item for item in lista\n        if isinstance(item, dict)\n        and texto(item.get(\"palabra\"))\n        and (not requiere_definicion or texto(item.get(\"definicion\")))\n        and texto(item.get(\"categoria\"))\n        and imagen_real(item.get(\"imagen\"))\n    ]\n'''
          if viejo not in s and nuevo not in s:
              raise SystemExit('No se encontró publicables() esperado en el validador')
          s = s.replace(viejo, nuevo)
          s = s.replace('def resumen(nombre, lista):\n    pub = publicables(lista)', 'def resumen(nombre, lista, requiere_definicion=False):\n    pub = publicables(lista, requiere_definicion)')
          s = s.replace('pub_dic, cat_dic, videos_dic = resumen("Diccionario", diccionario)', 'pub_dic, cat_dic, videos_dic = resumen("Diccionario", diccionario, requiere_definicion=True)')
          s = s.replace('print("Regla pública validada: imagen real obligatoria, video opcional.")', 'print("Regla pública validada: Diccionario = definición + imagen; video opcional. Lo nuevo mantiene video obligatorio.")')
          p.write_text(s, encoding='utf-8')

          # 4) La sección Lo nuevo ya filtra por video; se comprueba para que no cambie por accidente.
          lo_nuevo = Path('js/lo-nuevo.js').read_text(encoding='utf-8')
          if ".filter(x => x && x.palabra && tieneVideoValido(x.palabra))" not in lo_nuevo:
              raise SystemExit('Lo nuevo dejó de exigir video; se cancela el cambio')

          # 5) Nueva versión PWA para expulsar la regla anterior de caché.
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          if 'const VERSION_APP = "v123";' in s:
              s = s.replace('const VERSION_APP = "v123";', 'const VERSION_APP = "v124";')
          elif 'const VERSION_APP = "v124";' not in s:
              raise SystemExit('Versión inesperada del Service Worker')
          p.write_text(s, encoding='utf-8')

      - name: Validar cambios
        shell: bash
        run: |
          node --check js/script.js
          node --check js/security.js
          node --check js/lo-nuevo.js
          node --check sw.js
          python scripts/validar_publicacion_publica.py
          python scripts/validar_seguridad.py
          git diff --check

      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet; then
            echo "La regla ya estaba aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/script.js js/security.js scripts/validar_publicacion_publica.py sw.js
          git commit -m "fix: buscar fichas con definición e imagen sin exigir video"
          git push origin develop
