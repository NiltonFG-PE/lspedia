name: Aplicar optimización de rendimiento fase 1

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/aplicar-optimizacion-fase1.yml'

permissions:
  contents: write

jobs:
  optimizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar carga bajo demanda
        shell: python
        run: |
          from pathlib import Path

          ruta = Path('index.html')
          texto = ruta.read_text(encoding='utf-8')

          reemplazos = [
              ('    <link rel="stylesheet" href="css/alfabetizacion.css">\n', ''),
              ('    <link rel="stylesheet" href="css/matematicas.css">\n', ''),
              ('    <link rel="stylesheet" href="css/subtitulos.css">\n', ''),
              ('    <script src="js/script.js"></script>', '    <script src="js/lazy-modules.js?v=20260912-1"></script>\n    <script src="js/script.js"></script>'),
              ('    <script src="js/alfabetizacion.js"></script>\n', ''),
              ('    <script src="js/matematicas.js"></script>\n', ''),
              ('    <script src="js/oraciones.js?v=20260908c"></script>\n', ''),
              ('    <script src="js/subtitulos.js"></script>\n', ''),
          ]

          for viejo, nuevo in reemplazos:
              cantidad = texto.count(viejo)
              if cantidad != 1:
                  raise SystemExit(f'Reemplazo inseguro: se esperaba 1 coincidencia y hubo {cantidad}: {viejo!r}')
              texto = texto.replace(viejo, nuevo, 1)

          ruta.write_text(texto, encoding='utf-8')

          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          viejo = 'const VERSION_APP = "v94";'
          nuevo = 'const VERSION_APP = "v95";'
          if sw_texto.count(viejo) != 1:
              raise SystemExit('No se encontró VERSION_APP v94 exactamente una vez')
          sw.write_text(sw_texto.replace(viejo, nuevo, 1), encoding='utf-8')

      - name: Verificar que los módulos pesados ya no carguen al inicio
        shell: bash
        run: |
          set -e
          grep -q 'js/lazy-modules.js?v=20260912-1' index.html
          ! grep -q '<script src="js/alfabetizacion.js"></script>' index.html
          ! grep -q '<script src="js/matematicas.js"></script>' index.html
          ! grep -q '<script src="js/oraciones.js?v=20260908c"></script>' index.html
          ! grep -q '<script src="js/subtitulos.js"></script>' index.html
          ! grep -q '<link rel="stylesheet" href="css/alfabetizacion.css">' index.html
          ! grep -q '<link rel="stylesheet" href="css/matematicas.css">' index.html
          ! grep -q '<link rel="stylesheet" href="css/subtitulos.css">' index.html
          grep -q 'const VERSION_APP = "v95";' sw.js

      - name: Guardar cambios en develop
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Optimizar carga inicial con módulos bajo demanda"
          git push origin HEAD:develop