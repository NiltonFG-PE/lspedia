name: Corregir botón Oraciones al refrescar

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/fix-oraciones-menu-refresh.yml

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Aplicar corrección
        run: python .tmp/fix_oraciones_menu.py
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/oraciones.js sw.js
          git commit -m "Fijar botón Oraciones en el menú Jugar"
          git push origin develop
