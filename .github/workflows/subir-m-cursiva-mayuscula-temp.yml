name: Subir M cursiva mayuscula temporal
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/subir-m-cursiva-mayuscula-temp.yml'
permissions:
  contents: write
jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Crear video y publicar
        shell: bash
        run: |
          mkdir -p img/alfabetizacion/grafias
          cat > /tmp/m.b64 <<'B64'
PLACEHOLDER
B64
          base64 -d /tmp/m.b64 > img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4
          test -s img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4
          rm .github/workflows/subir-m-cursiva-mayuscula-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4 .github/workflows/subir-m-cursiva-mayuscula-temp.yml
          git commit -m 'Agregar video M cursiva mayúscula'
          git push origin HEAD:develop
