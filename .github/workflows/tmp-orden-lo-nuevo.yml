name: Temporal ordenar Lo nuevo

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/tmp-orden-lo-nuevo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ordenar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Colocar Lo nuevo encima de Tu aprendizaje
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path("css/mejoras-producto.css")
          css = css_path.read_text(encoding="utf-8")
          marca = "LO_NUEVO_ENCIMA_APRENDIZAJE_V1_20260912"
          if marca not in css:
              css += """

          /* LO_NUEVO_ENCIMA_APRENDIZAJE_V1_20260912
             Lo nuevo ocupa una fila completa y aparece antes de Tu aprendizaje. */
          #lspMejorasInicio .lsp-mejoras-grid {
              grid-template-columns: 1fr;
          }
          #lspNuevasCard {
              order: 1;
              grid-column: 1 / -1;
          }
          #lspModoCard {
              order: 2;
              grid-column: 1 / -1;
          }
          """
              css_path.write_text(css, encoding="utf-8", newline="\n")

          sw_path = Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v74";', sw, count=1)
          sw_path.write_text(sw, encoding="utf-8", newline="\n")
          PY

      - name: Validar cambios
        run: |
          grep -q "LO_NUEVO_ENCIMA_APRENDIZAJE_V1_20260912" css/mejoras-producto.css
          grep -q 'VERSION_APP = "v74"' sw.js
          git diff --check

      - name: Guardar cambios
        run: |
          if git diff --quiet -- css/mejoras-producto.css sw.js; then
            echo "El orden ya estaba aplicado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mejoras-producto.css sw.js
          git commit -m "Mostrar Lo nuevo encima de Tu aprendizaje"
          git push origin HEAD:develop
