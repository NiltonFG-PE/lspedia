name: Mejorar Subtítulos V3

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/mejorar-subtitulos-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar mejora V3 de Subtítulos
        run: python scripts/mejorar_subtitulos_v3.py

      - name: Validar JavaScript y cambios
        shell: bash
        run: |
          set -euo pipefail
          node --check js/subtitulos.js
          grep -q 'SUBTITULOS_V3_ESTABLE_20260909' js/subtitulos.js
          grep -q 'SUBTITULOS_V3_DISENO_20260909' css/subtitulos.css
          grep -q 'btnSubtitulosPausar' js/subtitulos.js
          grep -q 'wakeLock' js/subtitulos.js
          grep -q 'const VERSION_APP = "v42";' sw.js
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar cambios en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/subtitulos.js css/subtitulos.css sw.js
          git commit -m "Modernizar y estabilizar herramienta de Subtítulos"
          git push origin HEAD:develop
