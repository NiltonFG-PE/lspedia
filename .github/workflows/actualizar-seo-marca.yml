name: Actualizar mensaje SEO de LSPedia

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/actualizar-seo-marca.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Actualizar títulos y descripciones SEO
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          titulo = 'LSPedia - Diccionario visual de español con apoyo en Lengua de Señas Peruana'
          descripcion = 'Diccionario visual gratuito para aprender y comprender palabras en español con apoyo de videos en Lengua de Señas Peruana (LSP).'
          alt = 'Diccionario visual de español con apoyo en Lengua de Señas Peruana'

          index = Path('index.html')
          texto = index.read_text(encoding='utf-8')

          texto = re.sub(r'<title>.*?</title>', f'<title>{titulo}</title>', texto, count=1, flags=re.S)
          texto = re.sub(r'(<meta id="metaDescription" name="description" content=")[^"]*(">)', rf'\1{descripcion}\2', texto, count=1)
          texto = re.sub(r'(<meta id="ogTitle" property="og:title" content=")[^"]*(">)', rf'\1{titulo}\2', texto, count=1)
          texto = re.sub(r'(<meta id="ogDescription" property="og:description" content=")[^"]*(">)', rf'\1{descripcion}\2', texto, count=1)
          texto = re.sub(r'(<meta id="twitterTitle" name="twitter:title" content=")[^"]*(">)', rf'\1{titulo}\2', texto, count=1)
          texto = re.sub(r'(<meta id="twitterDescription" name="twitter:description" content=")[^"]*(">)', rf'\1{descripcion}\2', texto, count=1)

          texto = texto.replace('"alternateName": "Diccionario de Lengua de Señas Peruana"', f'"alternateName": "{alt}"', 1)
          texto = texto.replace('"description": "Diccionario digital gratuito de Lengua de Señas Peruana (LSP) y Español, con videos en señas para cada palabra."', f'"description": "{descripcion}"', 1)

          index.write_text(texto, encoding='utf-8')

          # Si script.js contiene valores base antiguos para restaurar el SEO
          # al volver a Inicio dentro de la SPA, los sincronizamos también.
          script = Path('js/script.js')
          js = script.read_text(encoding='utf-8')
          reemplazos = {
              'LSPedia - Diccionario de Lengua de Señas Peruana (LSP)': titulo,
              'LSPedia - Diccionario de Lengua de Señas Peruana': titulo,
              'LSPedia es el diccionario digital gratuito de Lengua de Señas Peruana (LSP). Aprende el significado de palabras en español con el apoyo de videos en señas.': descripcion,
              'Diccionario digital gratuito para aprender el significado de palabras en español con el apoyo de videos en Lengua de Señas Peruana (LSP).': descripcion,
          }
          for anterior, nuevo in reemplazos.items():
              js = js.replace(anterior, nuevo)
          script.write_text(js, encoding='utf-8')

          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          sw_texto = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v19";', sw_texto, count=1)
          sw.write_text(sw_texto, encoding='utf-8')
          PY

      - name: Validar JavaScript
        shell: bash
        run: |
          node --check js/script.js

      - name: Validar SEO
        shell: bash
        run: |
          git diff --check
          grep -q '<title>LSPedia - Diccionario visual de español con apoyo en Lengua de Señas Peruana</title>' index.html
          grep -q 'Diccionario visual gratuito para aprender y comprender palabras en español con apoyo de videos en Lengua de Señas Peruana (LSP).' index.html
          grep -q 'const VERSION_APP = "v19"' sw.js

      - name: Guardar en develop
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No hay cambios pendientes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/script.js sw.js
          git commit -m 'Actualizar identidad SEO de LSPedia'
          git push origin develop
