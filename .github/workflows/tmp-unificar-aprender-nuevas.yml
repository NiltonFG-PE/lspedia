name: TMP unificar aprendizaje y nuevas palabras

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-unificar-aprender-nuevas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar parche
        run: python scripts/tmp_ajustar_aprendizaje.py

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          node --check js/mejoras-producto.js
          node --check sw.js
          python -m py_compile scripts/actualizar_nuevas_palabras.py
          python -m json.tool data/nuevas-palabras.json > /dev/null
          python scripts/validar_lspedia.py
          python scripts/validar_seguridad.py
          git diff --check
          test -f 'video/lspedia_transparente anterior.webm'
          test "$(git hash-object 'video/lspedia_transparente anterior.webm')" = 'ca9a110b75384b534f8ebdcae45406fb178df083'

      - name: Publicar cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/mejoras-producto.js css/mejoras-producto.css scripts/actualizar_nuevas_palabras.py data/nuevas-palabras.json sw.js scripts/tmp_ajustar_aprendizaje.py
          if git diff --cached --quiet; then
            echo 'No hay cambios para publicar.'
            exit 0
          fi
          git commit -m 'Unificar aprendizaje y corregir nuevas palabras'
          git push origin develop
