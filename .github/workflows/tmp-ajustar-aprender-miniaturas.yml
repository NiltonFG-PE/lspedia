name: TMP ajustar Modo Aprender y miniaturas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-ajustar-aprender-miniaturas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar cambios
        run: python scripts/tmp_ajustar_aprender_miniaturas.py

      - name: Validar cambios
        shell: bash
        run: |
          node --check js/mejoras-producto.js
          node --check sw.js
          git diff --check
          grep -q "lsp-aprender-salir" js/mejoras-producto.js
          grep -q "lsp-nueva-thumb" js/mejoras-producto.js
          grep -q 'VERSION_APP = "v68"' sw.js
          test -f 'video/lspedia_transparente anterior.webm'
          test "$(git hash-object 'video/lspedia_transparente anterior.webm')" = 'ca9a110b75384b534f8ebdcae45406fb178df083'

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/mejoras-producto.js css/mejoras-producto.css sw.js
          git commit -m "Integrar Modo Aprender y miniaturas de nuevas palabras"
          git push origin HEAD:develop
