name: Corregir Quiz modal V16

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/corregir-quiz-modal-v16.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar correcciones
        run: python .github/scripts/corregir_quiz_modal_v16.py

      - name: Validar JavaScript e integración
        shell: bash
        run: |
          node --check js/quiz.js
          ! grep -F 'animation-iteration-count: 3 !important' css/quiz.css
          ! grep -F 'window.confirm("¿Volver al menú?' js/quiz.js
          grep -F 'quizConfirmarVolver' js/quiz.js
          grep -F 'const VERSION_APP = "v16";' sw.js

      - name: Guardar cambios en develop
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/corregir-quiz-modal-v16.yml .github/scripts/corregir_quiz_modal_v16.py
          git add js/quiz.js css/quiz.css sw.js
          git commit -m "Mejorar confirmación del Quiz y restaurar animaciones"
          git push origin develop
