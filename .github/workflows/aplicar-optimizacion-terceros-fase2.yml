name: Aplicar optimización de rendimiento fase 2

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/aplicar-optimizacion-terceros-fase2.yml'

permissions:
  contents: write

jobs:
  optimizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar carga diferida de terceros
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          texto = index.read_text(encoding='utf-8')

          # YouTube: quitar iframe_api de la apertura inicial y conservar solo
          # el preconnect de miniaturas, que sí se usan en la portada.
          patron_youtube = re.compile(r'    <!-- Preconnect a YouTube:.*?<script src="https://www\.youtube\.com/iframe_api" async></script>\n', re.S)
          youtube_nuevo = "\n".join([
              '    <!-- Las miniaturas sí aparecen en Inicio (por ejemplo, Descubre), por eso',
              '         mantenemos caliente i.ytimg.com. La API pesada de YouTube ya NO se',
              '         descarga al abrir LSPedia: js/script.js la solicita solo cuando se',
              '         abre una ficha con video o la sección Sobre Nosotros. -->',
              '    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>',
              ''
          ])
          texto, n = patron_youtube.subn(youtube_nuevo, texto, count=1)
          if n != 1:
              raise SystemExit(f'Bloque YouTube esperado: {n} coincidencias')

          # GA4: mantener dataLayer/gtag desde el inicio, pero descargar la
          # librería externa solo cuando la carga principal terminó.
          patron_ga = re.compile(r'(    <!-- Google Analytics \(GA4\).*?-->\n)    <script>\n        \(function \(\) \{.*?    </script>\n', re.S)
          ga_lineas = [
              '    <script>',
              '        (function () {',
              '            const host = String(window.location.hostname || "").toLowerCase();',
              '            const esOficial = host === "lspedia.site" || host === "www.lspedia.site";',
              '            window.dataLayer = window.dataLayer || [];',
              '            window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };',
              '            if (!esOficial) return;',
              '',
              '            // La configuración queda en cola de inmediato; la librería externa',
              '            // espera a que la apertura principal de LSPedia ya haya terminado.',
              '            window.gtag("js", new Date());',
              '            window.gtag("config", "G-RJX3RP2CBR");',
              '',
              '            let gaSolicitado = false;',
              '            function cargarGA4() {',
              '                if (gaSolicitado) return;',
              '                gaSolicitado = true;',
              '                const ga = document.createElement("script");',
              '                ga.async = true;',
              '                ga.src = "https://www.googletagmanager.com/gtag/js?id=G-RJX3RP2CBR";',
              '                document.head.appendChild(ga);',
              '            }',
              '',
              '            function programarGA4() {',
              '                if ("requestIdleCallback" in window) {',
              '                    window.requestIdleCallback(cargarGA4, { timeout: 2500 });',
              '                } else {',
              '                    setTimeout(cargarGA4, 900);',
              '                }',
              '            }',
              '',
              '            if (document.readyState === "complete") programarGA4();',
              '            else window.addEventListener("load", programarGA4, { once: true });',
              '        })();',
              '    </script>',
              ''
          ]
          ga_nuevo = "\n".join(ga_lineas)
          texto, n = patron_ga.subn(lambda m: m.group(1) + ga_nuevo, texto, count=1)
          if n != 1:
              raise SystemExit(f'Bloque GA4 esperado: {n} coincidencias')
          index.write_text(texto, encoding='utf-8')

          script = Path('js/script.js')
          js = script.read_text(encoding='utf-8')

          # Sustituye el puente "temprano" por un cargador bajo demanda.
          patron_callback = re.compile(r'// index\.html ya define un window\.onYouTubeIframeAPIReady "temprano".*?if \(window\.__ytApiListoTemprano\) \{\n    onYouTubeIframeAPIReady\(\);\n\}\n', re.S)
          callback_lineas = [
              '// La API de YouTube ya no se descarga en el <head>. Conservamos el callback',
              '// global que exige iframe_api y la solicitamos únicamente cuando una pantalla',
              '// realmente necesita crear un reproductor.',
              'window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;',
              'let ytApiCargaIniciada = false;',
              '',
              'function asegurarApiYouTube() {',
              '    if (ytApiListo) return;',
              '    if (window.YT && typeof window.YT.Player === "function") {',
              '        onYouTubeIframeAPIReady();',
              '        return;',
              '    }',
              '    if (ytApiCargaIniciada) return;',
              '    ytApiCargaIniciada = true;',
              '',
              '    const existente = document.querySelector(\'script[src*="youtube.com/iframe_api"]\');',
              '    if (existente) return;',
              '',
              '    const api = document.createElement("script");',
              '    api.id = "lspediaYoutubeIframeApi";',
              '    api.src = "https://www.youtube.com/iframe_api";',
              '    api.async = true;',
              '    api.onerror = () => {',
              '        ytApiCargaIniciada = false;',
              '        console.warn("No se pudo cargar la API de YouTube. Se reintentará al abrir otro video.");',
              '    };',
              '    document.head.appendChild(api);',
              '}',
              ''
          ]
          js, n = patron_callback.subn("\n".join(callback_lineas), js, count=1)
          if n != 1:
              raise SystemExit(f'Puente temprano YouTube esperado: {n} coincidencias')

          reemplazos = [
              ('        ytVideoNosotrosPendiente = ID_VIDEO_NOSOTROS;\n    }\n}\n', '        ytVideoNosotrosPendiente = ID_VIDEO_NOSOTROS;\n        asegurarApiYouTube();\n    }\n}\n'),
              ('        ytVideoIdPendiente = videoId;\n        ytOpcionesReproductorPalabraPendiente = opciones;\n    }\n}\n', '        ytVideoIdPendiente = videoId;\n        ytOpcionesReproductorPalabraPendiente = opciones;\n        asegurarApiYouTube();\n    }\n}\n'),
              ('        ytVideoIdSugeridaPendiente = videoId;\n    }\n}\n', '        ytVideoIdSugeridaPendiente = videoId;\n        asegurarApiYouTube();\n    }\n}\n')
          ]
          for viejo, nuevo in reemplazos:
              cantidad = js.count(viejo)
              if cantidad != 1:
                  raise SystemExit(f'Reemplazo YouTube inseguro: {cantidad} coincidencias')
              js = js.replace(viejo, nuevo, 1)
          script.write_text(js, encoding='utf-8')

          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          if sw_texto.count('const VERSION_APP = "v95";') != 1:
              raise SystemExit('No se encontró VERSION_APP v95 exactamente una vez')
          sw.write_text(sw_texto.replace('const VERSION_APP = "v95";', 'const VERSION_APP = "v96";', 1), encoding='utf-8')

      - name: Verificar optimización
        shell: bash
        run: |
          set -e
          node --check js/script.js
          grep -q 'function asegurarApiYouTube()' js/script.js
          test "$(grep -c 'asegurarApiYouTube();' js/script.js)" -ge 3
          ! grep -q '<script src="https://www.youtube.com/iframe_api"' index.html
          ! grep -q 'window.__ytApiListoTemprano' index.html
          grep -q 'requestIdleCallback(cargarGA4' index.html
          grep -q 'const VERSION_APP = "v96";' sw.js

      - name: Guardar cambios en develop
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/script.js sw.js
          git commit -m "Optimizar carga de YouTube y Analytics"
          git push origin HEAD:develop
