name: Aplicar optimización de rendimiento fase 2

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/aplicar-optimizacion-terceros-fase2.yml'

permissions:
  contents: write

jobs:
  optimizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar carga diferida de terceros
        shell: python
        run: |
          from pathlib import Path

          # ------------------------------------------------------------
          # 1) index.html: YouTube deja de cargar al abrir la portada.
          #    GA4 conserva la cola gtag, pero su librería se descarga
          #    cuando la carga principal ya terminó / el navegador está libre.
          # ------------------------------------------------------------
          index = Path('index.html')
          texto = index.read_text(encoding='utf-8')

          youtube_viejo = '''    <!-- Preconnect a YouTube: adelanta la conexión al dominio antes de que
         se necesite el video de "Sobre Nosotros" (o el de una palabra),
         para que tarde menos en aparecer. -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>

    <!-- La API de YouTube (iframe_api) se carga en paralelo desde acá, en
         vez de al final del body: así, cuando el navegador ya terminó de
         parsear toda la página (momento en el que antes recién arrancaba
         su descarga), la API ya está lista o a punto de estarlo. Esto es
         lo que hacía que el video de "Sobre Nosotros" demorara en
         aparecer, sobre todo justo después de un refresco de la página.
         "onYouTubeIframeAPIReady" recién se define más abajo, en
         js/script.js, así que acá se guarda un aviso temprano por si la
         API queda lista antes de que ese archivo termine de cargar. -->
    <script>
        window.__ytApiListoTemprano = false;
        window.onYouTubeIframeAPIReady = function () {
            window.__ytApiListoTemprano = true;
            if (typeof window.__onYouTubeIframeAPIReadyReal === "function") {
                window.__onYouTubeIframeAPIReadyReal();
            }
        };
    </script>
    <script src="https://www.youtube.com/iframe_api" async></script>
'''
          youtube_nuevo = '''    <!-- Las miniaturas sí aparecen en Inicio (por ejemplo, Descubre), por eso
         mantenemos caliente i.ytimg.com. La API pesada de YouTube ya NO se
         descarga al abrir LSPedia: js/script.js la solicita solo cuando se
         abre una ficha con video o la sección Sobre Nosotros. -->
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
'''
          if texto.count(youtube_viejo) != 1:
              raise SystemExit('No se encontró exactamente una vez el bloque inicial de YouTube')
          texto = texto.replace(youtube_viejo, youtube_nuevo, 1)

          ga_viejo = '''    <script>
        (function () {
            const host = String(window.location.hostname || "").toLowerCase();
            const esOficial = host === "lspedia.site" || host === "www.lspedia.site";
            window.dataLayer = window.dataLayer || [];
            window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
            if (!esOficial) return;

            const ga = document.createElement("script");
            ga.async = true;
            ga.src = "https://www.googletagmanager.com/gtag/js?id=G-RJX3RP2CBR";
            document.head.appendChild(ga);
            window.gtag("js", new Date());
            window.gtag("config", "G-RJX3RP2CBR");
        })();
    </script>
'''
          ga_nuevo = '''    <script>
        (function () {
            const host = String(window.location.hostname || "").toLowerCase();
            const esOficial = host === "lspedia.site" || host === "www.lspedia.site";
            window.dataLayer = window.dataLayer || [];
            window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
            if (!esOficial) return;

            // Dejamos la configuración en cola desde el primer instante para
            // no perder eventos tempranos, pero la librería externa de GA4 ya
            // no compite con el CSS/JS crítico durante la apertura de LSPedia.
            window.gtag("js", new Date());
            window.gtag("config", "G-RJX3RP2CBR");

            let gaSolicitado = false;
            function cargarGA4() {
                if (gaSolicitado) return;
                gaSolicitado = true;
                const ga = document.createElement("script");
                ga.async = true;
                ga.src = "https://www.googletagmanager.com/gtag/js?id=G-RJX3RP2CBR";
                document.head.appendChild(ga);
            }

            function programarGA4() {
                if ("requestIdleCallback" in window) {
                    window.requestIdleCallback(cargarGA4, { timeout: 2500 });
                } else {
                    setTimeout(cargarGA4, 900);
                }
            }

            if (document.readyState === "complete") programarGA4();
            else window.addEventListener("load", programarGA4, { once: true });
        })();
    </script>
'''
          if texto.count(ga_viejo) != 1:
              raise SystemExit('No se encontró exactamente una vez el bloque GA4 esperado')
          texto = texto.replace(ga_viejo, ga_nuevo, 1)
          index.write_text(texto, encoding='utf-8')

          # ------------------------------------------------------------
          # 2) script.js: cargar iframe_api solo al necesitar un reproductor.
          # ------------------------------------------------------------
          script = Path('js/script.js')
          js = script.read_text(encoding='utf-8')

          bloque_callback_viejo = '''// index.html ya define un window.onYouTubeIframeAPIReady "temprano" (en el
// <head>, antes de que este archivo cargue) para no perder el aviso de la
// API si esta queda lista antes de que script.js termine de descargarse.
// Acá se reemplaza esa función por la real, y si el aviso temprano ya
// había llegado (window.__ytApiListoTemprano), se ejecuta de una vez.
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
window.__onYouTubeIframeAPIReadyReal = onYouTubeIframeAPIReady;
if (window.__ytApiListoTemprano) {
    onYouTubeIframeAPIReady();
}
'''
          bloque_callback_nuevo = '''// La API de YouTube ya no se descarga en el <head>. Conservamos el callback
// global que exige iframe_api y la solicitamos únicamente cuando una pantalla
// realmente necesita crear un reproductor. Esto evita cargar recursos pesados
// de YouTube durante una visita que solo usa buscador, categorías o imágenes.
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
let ytApiCargaIniciada = false;

function asegurarApiYouTube() {
    if (ytApiListo) return;

    // Si otro componente ya dejó YT listo, sincronizamos nuestro estado sin
    // volver a insertar el script ni esperar otro callback.
    if (window.YT && typeof window.YT.Player === "function") {
        onYouTubeIframeAPIReady();
        return;
    }

    if (ytApiCargaIniciada) return;
    ytApiCargaIniciada = true;

    const existente = document.querySelector('script[src*="youtube.com/iframe_api"]');
    if (existente) return;

    const api = document.createElement("script");
    api.id = "lspediaYoutubeIframeApi";
    api.src = "https://www.youtube.com/iframe_api";
    api.async = true;
    api.onerror = () => {
        ytApiCargaIniciada = false;
        console.warn("No se pudo cargar la API de YouTube. Se reintentará al abrir otro video.");
    };
    document.head.appendChild(api);
}
'''
          if js.count(bloque_callback_viejo) != 1:
              raise SystemExit('No se encontró exactamente una vez el puente temprano de YouTube')
          js = js.replace(bloque_callback_viejo, bloque_callback_nuevo, 1)

          cambios = [
              (
'''    } else {
        ytVideoNosotrosPendiente = ID_VIDEO_NOSOTROS;
    }
}
''',
'''    } else {
        ytVideoNosotrosPendiente = ID_VIDEO_NOSOTROS;
        asegurarApiYouTube();
    }
}
''',
              ),
              (
'''        ytVideoIdPendiente = videoId;
        ytOpcionesReproductorPalabraPendiente = opciones;
    }
}
''',
'''        ytVideoIdPendiente = videoId;
        ytOpcionesReproductorPalabraPendiente = opciones;
        asegurarApiYouTube();
    }
}
''',
              ),
              (
'''        ytVideoIdSugeridaPendiente = videoId;
    }
}
''',
'''        ytVideoIdSugeridaPendiente = videoId;
        asegurarApiYouTube();
    }
}
''',
              ),
          ]

          for viejo, nuevo in cambios:
              if js.count(viejo) != 1:
                  raise SystemExit('Reemplazo YouTube inseguro: coincidencias=' + str(js.count(viejo)))
              js = js.replace(viejo, nuevo, 1)

          script.write_text(js, encoding='utf-8')

          # ------------------------------------------------------------
          # 3) Service Worker: nueva versión del shell.
          # ------------------------------------------------------------
          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          if sw_texto.count('const VERSION_APP = "v95";') != 1:
              raise SystemExit('No se encontró VERSION_APP v95 exactamente una vez')
          sw.write_text(sw_texto.replace('const VERSION_APP = "v95";', 'const VERSION_APP = "v96";', 1), encoding='utf-8')

      - name: Verificar optimización
        shell: bash
        run: |
          set -e
          node --check js/script.js
          grep -q 'function asegurarApiYouTube()' js/script.js
          grep -q 'asegurarApiYouTube();' js/script.js
          ! grep -q '<script src="https://www.youtube.com/iframe_api"' index.html
          ! grep -q 'window.__ytApiListoTemprano' index.html
          grep -q 'requestIdleCallback(cargarGA4' index.html
          grep -q 'const VERSION_APP = "v96";' sw.js

      - name: Guardar cambios en develop
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/script.js sw.js
          git commit -m "Optimizar carga de YouTube y Analytics"
          git push origin HEAD:develop
