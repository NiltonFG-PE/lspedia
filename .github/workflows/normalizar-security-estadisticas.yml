name: Normalizar security y estadisticas publicas

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/normalizar-security-estadisticas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Restaurar security conocido
        run: git checkout 611d3f0b004d62b82852ecace866e55bb01a9863 -- js/security.js

      - name: Quitar logica editorial de security
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('js/security.js'); s=p.read_text(encoding='utf-8'); m='/* ============================================================\\n   REGLA ÚNICA DE PUBLICACIÓN DEL DICCIONARIO'; i=s.find(m); assert i >= 0, 'bloque editorial no encontrado'; p.write_text(s[:i].rstrip() + '\\n\\n/* Publicación y estadísticas viven en script.js y vocabulario-publico.js. */\\n', encoding='utf-8')"
          sed -i 's/const VERSION_APP = "v124";/const VERSION_APP = "v125";/' sw.js

      - name: Validar separacion
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "QuizV2" js/security.js
          ! grep -q "LSPediaPublicacionDiccionario" js/security.js
          grep -q "function obtenerDatosDiccionarioPublicables(data)" js/script.js
          grep -q "p.categoria && String(p.definicion || '').trim()" js/script.js
          grep -q "window.obtenerBancoHoja2 = obtener" js/vocabulario-publico.js
          grep -q 'const VERSION_APP = "v125";' sw.js
          node --check js/security.js
          node --check js/script.js
          node --check js/vocabulario-publico.js
          python scripts/validar_publicacion_publica.py
          python scripts/validar_seguridad.py
          node scripts/auditar-seguridad.mjs

      - name: Guardar cambio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/security.js sw.js
          git commit -m "refactor: separar seguridad de publicacion y estadisticas"
          git push origin develop
