name: Normalizar security y estadísticas públicas

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/normalizar-security-estadisticas.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalizar-security-estadisticas
  cancel-in-progress: false

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Restaurar security conocido y separar responsabilidades
        shell: bash
        run: |
          set -euo pipefail
          git checkout 611d3f0b004d62b82852ecace866e55bb01a9863 -- js/security.js
          python - <<'PY'
          from pathlib import Path

          p = Path('js/security.js')
          s = p.read_text(encoding='utf-8')
          marker = '''/* ============================================================
             REGLA ÚNICA DE PUBLICACIÓN DEL DICCIONARIO'''
          i = s.find(marker)
          if i < 0:
              raise SystemExit('No se encontró el bloque editorial histórico de security.js')
          s = s[:i].rstrip() + '''\n\n/*
   La publicación y las estadísticas NO pertenecen a la capa de seguridad.
   - Diccionario: js/script.js aplica la regla canónica.
   - Vocabulario público: js/vocabulario-publico.js mantiene su banco separado del Quiz.
*/\n'''
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          if 'const VERSION_APP = "v124";' not in t:
              raise SystemExit('La versión esperada v124 del Service Worker no coincide')
          t = t.replace('const VERSION_APP = "v124";', 'const VERSION_APP = "v125";', 1)
          sw.write_text(t, encoding='utf-8')
          PY

      - name: Validar separación y reglas públicas
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "QuizV2" js/security.js
          ! grep -q "LSPediaPublicacionDiccionario" js/security.js
          ! grep -q "obtenerDatosDiccionarioPublicables =" js/security.js
          grep -q "function obtenerDatosDiccionarioPublicables(data)" js/script.js
          grep -q "p.categoria && String(p.definicion || '').trim()" js/script.js
          grep -q "window.obtenerBancoHoja2 = obtener" js/vocabulario-publico.js
          grep -q "v125" sw.js
          node --check js/security.js
          node --check js/script.js
          node --check js/vocabulario-publico.js
          python scripts/validar_publicacion_publica.py
          python scripts/validar_seguridad.py
          node scripts/auditar-seguridad.mjs

      - name: Guardar cambio
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/security.js sw.js
          git commit -m "refactor: separar seguridad de publicación y estadísticas"
          git push origin develop
