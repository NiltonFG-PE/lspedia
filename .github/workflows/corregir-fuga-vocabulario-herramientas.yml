name: Corregir fuga Vocabulario Herramientas

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/corregir-fuga-vocabulario-herramientas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar corrección
        run: python scripts/corregir_fuga_vocabulario_herramientas.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          node --check js/script.js
          grep -q 'CORRECCION_FUGA_VOCABULARIO_HERRAMIENTAS_20260909' js/script.js
          grep -q 'listaVocabulario.classList.add("d-none")' js/script.js
          grep -q 'const VERSION_APP = "v44";' sw.js
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar cambios en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/script.js sw.js
          git commit -m "Ocultar aviso de Vocabulario al entrar a Herramientas"
          git push origin HEAD:develop
