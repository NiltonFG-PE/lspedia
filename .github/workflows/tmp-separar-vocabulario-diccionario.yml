name: Temporal separar Vocabulario de Diccionario

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/tmp_separar_vocabulario_diccionario.py'
      - '.github/workflows/tmp-separar-vocabulario-diccionario.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Aplicar separación estricta
        run: python scripts/tmp_separar_vocabulario_diccionario.py
      - name: Validar JavaScript y reglas
        run: |
          node --check js/script.js
          python - <<'PY'
          from pathlib import Path
          s=Path('js/script.js').read_text(encoding='utf-8')
          assert 'if(obtenerFuentePalabra(p) === "vocabulario")' in s
          assert 'mostrarSugerenciasRelacionadasVocabulario(' in s
          bloque=s[s.index('function mostrarSugerenciasRelacionadasVocabulario'):]
          bloque=bloque[:bloque.index('// --- FAVORITOS Y HISTORIAL ---')]
          assert 'mostrarPalabra(p' not in bloque
          assert 'obtenerDatosVocabulario()' in bloque
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'const VERSION_APP = "v131";' in sw
          print('OK: navegación de Vocabulario no cae al Diccionario')
          PY
          git diff --check
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/script.js sw.js
          git commit -m 'fix: aislar navegación de Vocabulario del Diccionario'
          git push origin develop
