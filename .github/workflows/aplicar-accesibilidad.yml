name: Aplicar accesibilidad LSPedia

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/aplicar-accesibilidad.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Integrar archivos de accesibilidad
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          texto = index.read_text(encoding='utf-8')

          css = '    <link rel="stylesheet" href="css/accesibilidad.css?v=20260908">'
          if 'css/accesibilidad.css' not in texto:
              ancla = '    <link rel="stylesheet" href="css/subtitulos.css">'
              if ancla in texto:
                  texto = texto.replace(ancla, ancla + '\n' + css, 1)
              else:
                  texto = texto.replace('</head>', css + '\n</head>', 1)

          js = '    <script src="js/accesibilidad.js?v=20260908" defer></script>'
          if 'js/accesibilidad.js' not in texto:
              texto = texto.replace('</body>', js + '\n</body>', 1)

          index.write_text(texto, encoding='utf-8')

          sw = Path('sw.js')
          texto_sw = sw.read_text(encoding='utf-8')
          texto_sw = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v17";', texto_sw, count=1)

          if 'css/accesibilidad.css' not in texto_sw:
              texto_sw = texto_sw.replace(
                  '    "css/subtitulos.css",',
                  '    "css/subtitulos.css",\n    "css/accesibilidad.css",',
                  1
              )

          if 'js/accesibilidad.js' not in texto_sw:
              texto_sw = texto_sw.replace(
                  '    "js/subtitulos.js",',
                  '    "js/subtitulos.js",\n    "js/accesibilidad.js",',
                  1
              )

          sw.write_text(texto_sw, encoding='utf-8')
          PY

      - name: Validar JavaScript
        shell: bash
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validar cambios
        shell: bash
        run: |
          git diff --check
          grep -q 'css/accesibilidad.css' index.html
          grep -q 'js/accesibilidad.js' index.html
          grep -q 'const VERSION_APP = "v17"' sw.js

      - name: Guardar en develop
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No hay cambios pendientes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Integrar accesibilidad global en LSPedia'
          git push origin develop
