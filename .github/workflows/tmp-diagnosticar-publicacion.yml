name: Temporal diagnosticar publicación

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-diagnosticar-publicacion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Regla pública
        shell: bash
        run: |
          echo '=== obtenerDatosDiccionarioPublicables ==='
          grep -n -A35 -B8 'obtenerDatosDiccionarioPublicables' js/script.js || true
          echo '=== actualizarEstadisticas ==='
          grep -n -A60 -B10 'function actualizarEstadisticas' js/script.js || true
          echo '=== usos palabrasData / datos ==='
          grep -n -E 'palabrasData|datosPalabras|obtenerDatosDiccionarioPublicables|imagen.*placeholder|Imagen próximamente' js/script.js | head -n 180 || true
          echo '=== security ==='
          grep -n -E 'public|filtr|estad|Quiz|imagen' js/security.js | head -n 180 || true
          echo '=== mejoras ==='
          grep -RIn -E 'obtenerDatosDiccionarioPublicables|actualizarEstadisticas|Imagen próximamente|palabrasData' js --exclude=script.js --exclude=security.js | head -n 250 || true
