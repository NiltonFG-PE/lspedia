name: Temporal equilibrar Descubre y avatar

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-equilibrar-descubre-avatar.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Equilibrar tarjeta Descubre y avatar en movil
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('css/mejoras-producto.css')
          texto = css.read_text(encoding='utf-8')
          marcador = 'EQUILIBRIO_DESCUBRE_AVATAR_MOVIL_V1_20260912'
          bloque = r'''

/* ============================================================
   EQUILIBRIO_DESCUBRE_AVATAR_MOVIL_V1_20260912
   En móvil, Descubre deja de dominar toda la fila y el personaje
   animado gana presencia. No cambia escritorio ni Vocabulario.
   ============================================================ */
@media (max-width: 991.98px) {
    body:not(.vista-temas-movil):not(.senal-cerrada) #filaHeroPrincipal {
        grid-template-columns: minmax(0, 1.35fr) minmax(130px, 0.9fr) !important;
        column-gap: 8px !important;
        align-items: center !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia {
        min-width: 0 !important;
        align-self: center !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-card {
        min-height: 108px !important;
        border-radius: 15px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-media {
        width: 96px !important;
        margin: 5px 0 5px 5px !important;
        border-radius: 8px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-body {
        padding: 5px 6px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-nav {
        gap: 3px !important;
        margin-bottom: 1px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-nav-btn {
        width: 21px !important;
        height: 21px !important;
        font-size: 9px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-label {
        font-size: 9px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-badge {
        font-size: 7px !important;
        padding: 1px 5px !important;
        margin-bottom: 2px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-titulo {
        font-size: 15px !important;
        line-height: 1.08 !important;
        margin-bottom: 2px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-btn {
        font-size: 9.5px !important;
        padding: 5px 12px !important;
        border-radius: 9px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #colAvatarHero {
        align-self: center !important;
        justify-content: center !important;
        overflow: visible !important;
        min-width: 0 !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #colAvatarHero .avatar-hero-img {
        width: auto !important;
        height: 148px !important;
        max-width: 145px !important;
        object-fit: contain !important;
        object-position: center bottom !important;
    }
}

@media (max-width: 430px) {
    body:not(.vista-temas-movil):not(.senal-cerrada) #filaHeroPrincipal {
        grid-template-columns: minmax(0, 1.28fr) minmax(118px, 0.92fr) !important;
        column-gap: 6px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #colAvatarHero .avatar-hero-img {
        height: 138px !important;
        max-width: 132px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-media {
        width: 90px !important;
    }

    body:not(.vista-temas-movil):not(.senal-cerrada) #senalDelDia .dia-rect-titulo {
        font-size: 14px !important;
    }
}
'''
          if marcador not in texto:
              css.write_text(texto.rstrip() + bloque + '\n', encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          s2, n = re.subn(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v85";', s, count=1)
          if n != 1:
              raise SystemExit('No se pudo actualizar VERSION_APP')
          sw.write_text(s2, encoding='utf-8')
          PY

      - name: Validar cambio
        run: |
          grep -q "EQUILIBRIO_DESCUBRE_AVATAR_MOVIL_V1_20260912" css/mejoras-producto.css
          grep -q 'const VERSION_APP = "v85";' sw.js

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mejoras-producto.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Equilibrar Descubre y avatar en móvil"
          git push origin develop
