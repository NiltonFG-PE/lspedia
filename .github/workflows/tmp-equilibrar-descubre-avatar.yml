name: Temporal equilibrar Descubre y avatar

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-equilibrar-descubre-avatar.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar ajuste
        run: python scripts/tmp_equilibrar_descubre.py

      - name: Validar cambio
        run: |
          grep -q "EQUILIBRIO_DESCUBRE_AVATAR_MOVIL_V1_20260912" css/mejoras-producto.css
          grep -q 'const VERSION_APP = "v85";' sw.js

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mejoras-producto.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Equilibrar Descubre y avatar en móvil"
          git push origin develop
