name: Aplicar índice alfabético compacto

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/aplicar-indice-alfabetico-compacto.yml'
      - 'scripts/aplicar_indice_alfabetico_compacto.py'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar rediseño A-Z
        run: python scripts/aplicar_indice_alfabetico_compacto.py

      - name: Validar JavaScript
        run: node --check js/script.js

      - name: Validar LSPedia
        run: python scripts/validar_lspedia.py

      - name: Validar diferencias
        run: git diff --check

      - name: Comprobar estructura del índice
        run: |
          test "$(grep -o 'id="'"'btnToggleAbc'"'"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id="'"'indiceAlfabetico'"'"' index.html | wc -l)" -eq 1
          grep -q 'buscador-indice-linea' index.html
          grep -q 'INDICE_ALFABETICO_COMPACTO_V1_20260910' css/mejoras-producto.css
          grep -q 'function actualizarEstadoIndiceAlfabetico()' js/script.js

      - name: Limpiar migración temporal y publicar
        run: |
          rm -f scripts/aplicar_indice_alfabetico_compacto.py
          rm -f .github/workflows/aplicar-indice-alfabetico-compacto.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "Compactar índice alfabético junto al buscador"
          git push origin develop
