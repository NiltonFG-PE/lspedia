name: Aplicar índice alfabético compacto

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/aplicar-indice-alfabetico-compacto.yml'
      - 'scripts/aplicar_indice_alfabetico_compacto.py'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar rediseño A-Z
        run: python scripts/aplicar_indice_alfabetico_compacto.py

      - name: Validar JavaScript
        run: node --check js/script.js

      - name: Validar LSPedia
        run: python scripts/validar_lspedia.py

      - name: Validar diferencias
        run: git diff --check

      - name: Comprobar estructura del índice
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('css/mejoras-producto.css').read_text(encoding='utf-8')
          js = Path('js/script.js').read_text(encoding='utf-8')
          assert html.count('id="btnToggleAbc"') == 1
          assert html.count('id="indiceAlfabetico"') == 1
          assert html.count('id="filaBotonIndiceAlfabetico"') == 1
          assert html.count('id="filaIndiceAlfabetico"') == 1
          assert 'buscador-indice-linea' in html
          assert 'INDICE_ALFABETICO_COMPACTO_V1_20260910' in css
          assert 'function actualizarEstadoIndiceAlfabetico()' in js
          print('Estructura del índice A-Z correcta.')
          PY

      - name: Limpiar migración temporal y publicar
        run: |
          rm -f scripts/aplicar_indice_alfabetico_compacto.py
          rm -f .github/workflows/aplicar-indice-alfabetico-compacto.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "Compactar índice alfabético junto al buscador"
          git push origin develop
