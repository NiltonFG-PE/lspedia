name: Ajustar buscador de Vocabulario

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ajustar-buscador-vocabulario.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar ajuste
        run: python scripts/ajustar_buscador_vocabulario.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="vocabulario-ajuste-buscador-20260909"' index.html
          grep -q 'margin-top: -24px !important;' index.html
          grep -q 'animation: vocabBuscadorAtencion 3.2s ease-in-out infinite !important;' index.html
          grep -q 'const VERSION_APP = "v39";' sw.js
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Acercar y animar buscador de Vocabulario"
          git push origin HEAD:develop
