name: Temporal mejorar señas IA pose

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-mejorar-senas-pose.yml"
      - "scripts/tmp_mejorar_senas_pose.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Aplicar migracion
        run: python scripts/tmp_mejorar_senas_pose.py
      - name: Validar modulo de senas
        shell: bash
        run: |
          cp js/lab-senas-ia.js /tmp/lab-senas-ia.mjs
          node --check /tmp/lab-senas-ia.mjs
          python scripts/validar_senas_ia.py
          python -m json.tool data/senas-ia-dataset.json > /dev/null
          git diff --check
          grep -q "PoseLandmarker" js/lab-senas-ia.js
          grep -q "respuestaBrillo" lab-senas-ia.html
      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/lab-senas-ia.js lab-senas-ia.html scripts/validar_senas_ia.py
          git commit -m "feat: reconocer señas con referencia corporal"
          git push origin develop
