name: TMP Mejorar cache PWA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-mejorar-cache-pwa.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar mejora de cache
        run: python scripts/tmp_mejorar_cache_pwa.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          node --check js/script.js
          node --check sw.js
          git diff --check
          grep -q 'const VERSION_APP = "v61";' sw.js
          test "$(grep -c 'fetch(request, { cache: "no-store" })' sw.js)" -eq 2
          grep -q 'cache: "reload"' sw.js
          grep -q 'ACTUALIZACIÓN PWA SIN CACHÉ HTTP — 20260910' js/script.js
          grep -q 'updateViaCache: "none"' js/script.js
          test -f 'video/lspedia_transparente anterior.webm'
          test "$(git hash-object 'video/lspedia_transparente anterior.webm')" = 'ca9a110b75384b534f8ebdcae45406fb178df083'

      - name: Guardar cambios de aplicación
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js js/script.js
          if git diff --cached --quiet; then
            echo 'Sin cambios que guardar.'
            exit 0
          fi
          git commit -m 'Evitar contenido antiguo tras actualizar LSPedia'
          git push origin HEAD:develop
