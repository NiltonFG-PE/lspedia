name: Pulido visual global LSPedia

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/pulido-visual-global-20260909.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar pulido visual
        run: python scripts/pulido_visual_global_20260909.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="pulido-visual-global-20260909"' index.html
          grep -q 'width: 46px !important;' index.html
          grep -q 'background: #fff1e8 !important;' index.html
          grep -q 'width: min(100%, 520px);' index.html
          grep -Eq 'const VERSION_APP = "v[0-9]+";' sw.js
          git diff -- sw.js | grep -q '^+const VERSION_APP = "v'
          if grep -qi 'Conocimiento sin barreras, un Perú más inclusivo' index.html; then
            echo 'La frase eliminada del footer reapareció' >&2
            exit 1
          fi
          test -f 'video/lspedia_transparente anterior.webm'
          node --check js/script.js
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Aplicar pulido visual global en móvil"
          git push origin HEAD:develop
