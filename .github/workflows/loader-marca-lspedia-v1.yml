name: Loader de marca LSPedia V1

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/loader-marca-lspedia-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar loader de marca
        run: python scripts/loader_marca_lspedia_v1.py

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'LOADER_LSPEDIA_MARCA_V1_20260909' index.html
          grep -q 'window.LSPediaLoader' index.html
          grep -q 'Preparando el juego…' index.html
          grep -q 'Preparando contenido…' index.html
          ! grep -q 'spinner-border' index.html
          grep -q 'const VERSION_APP = "v51";' sw.js
          test -f 'img/favicon.png'
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar cambio y retirar temporales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/loader-marca-lspedia-v1.yml scripts/loader_marca_lspedia_v1.py
          git add index.html sw.js
          git commit -m "Agregar loader de marca LSPedia"
          git push origin HEAD:develop
