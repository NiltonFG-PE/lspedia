name: Actualizar vocabulario desde Vocabulario

on:
  push:
    branches: [develop]
    paths:
      - "data/vocabulario.json"
      - "js/quiz.js"
      - "scripts/generar_vocabulario.py"
      - "scripts/actualizar_nuevas_palabras.py"
      - "scripts/migrar_quiz_vocabulario_local.py"
      - "scripts/normalizar_categorias.py"
      - "scripts/validar_lspedia.py"
      - "scripts/publicar_generados.py"
      - ".github/workflows/actualizar-vocabulario.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-vocabulario-develop
  cancel-in-progress: true

jobs:
  actualizar-vocabulario:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias SEO
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Migrar Quiz a vocabulario local
        run: python scripts/migrar_quiz_vocabulario_local.py

      - name: Descargar Vocabulario y generar vocabulario.json
        run: python scripts/generar_vocabulario.py

      - name: Validar Vocabulario antes de guardar
        shell: bash
        run: |
          python -m json.tool data/vocabulario.json > /dev/null
          python scripts/validar_lspedia.py --fuente vocabulario
          python scripts/validar_ingles.py
          node --check js/quiz.js

      - name: Preparar historial local de Vocabulario
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- js/quiz.js data/vocabulario.json; then
            echo "Quiz y vocabulario ya estaban actualizados."
          else
            git add js/quiz.js data/vocabulario.json
            git commit -m "Usar vocabulario local para Vocabulario y Quiz"
          fi

      - name: Regenerar Lo nuevo después de actualizar Vocabulario
        run: python scripts/actualizar_nuevas_palabras.py

      - name: Validar Lo nuevo
        shell: bash
        run: |
          python -m json.tool data/nuevas-palabras.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/nuevas-palabras.json').read_text(encoding='utf-8'))
          items = data.get('items', []) if isinstance(data, dict) else []
          if not isinstance(items, list):
              raise SystemExit('data/nuevas-palabras.json no contiene items válidos')
          if not any(str(x.get('fuente', '')).strip().lower() == 'vocabulario' for x in items if isinstance(x, dict)):
              print('AVISO: Lo nuevo no tiene Vocabulario entre los 12 más recientes en este momento.')
          else:
              print('OK: Lo nuevo incluye contenido reciente de Vocabulario.')
          PY

      - name: Generar y validar páginas públicas en la misma publicación
        run: |
          python scripts/generar_paginas_seo.py
          python scripts/generar_sitemap.py
          python scripts/validar_sitemap_publico.py

      - name: Guardar Lo nuevo y publicar cambios
        shell: bash
        run: |
          git add data/nuevas-palabras.json sitemap.xml
          git add -A -- diccionario vocabulario
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar Lo nuevo y páginas públicas junto a Vocabulario"
          fi

          python scripts/publicar_generados.py
