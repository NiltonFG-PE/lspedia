name: Temporal corregir pantalla completa de video

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-fix-fullscreen-video.yml"

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar corrección
        run: python scripts/tmp_fix_fullscreen_video.py

      - name: Validar sintaxis y marcadores
        run: |
          node --check js/script.js
          grep -q "FULLSCREEN_VIDEO_MOVIL_FIX_V1_20260912" css/mejoras-producto.css
          grep -q 'const VERSION_APP = "v87";' sw.js
          grep -q 'requestFullscreen' js/script.js

      - name: Guardar y retirar temporales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-fullscreen-video.yml scripts/tmp_fix_fullscreen_video.py
          git add js/script.js css/mejoras-producto.css sw.js
          git commit -m "Corregir pantalla completa de videos en móvil"
          git push origin develop
