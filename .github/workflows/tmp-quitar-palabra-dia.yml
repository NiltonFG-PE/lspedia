name: Temporal quitar Palabra del día

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/tmp-quitar-palabra-dia.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Quitar tarjeta Palabra del día y ajustar móvil
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('css/mejoras-producto.css')
          css = css_path.read_text(encoding='utf-8')
          marca = 'QUITAR_PALABRA_DIA_V1_20260912'
          if marca not in css:
              css += '''\n\n/* QUITAR_PALABRA_DIA_V1_20260912\n   La portada usa Lo nuevo como bloque de descubrimiento principal. */\n#senalDelDia {\n    display: none !important;\n}\n\n@media (max-width: 991.98px) {\n    #filaHeroPrincipal {\n        grid-template-columns: 3fr 2fr !important;\n        grid-template-areas: "titulo avatar" !important;\n        row-gap: 0 !important;\n    }\n    #colAvatarHero {\n        align-self: center !important;\n    }\n    #colAvatarHero .avatar-hero-img {\n        height: 130px !important;\n    }\n}\n'''
              css_path.write_text(css, encoding='utf-8', newline='\n')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v75";', sw, count=1)
          sw_path.write_text(sw, encoding='utf-8', newline='\n')
          PY

      - name: Validar cambios
        run: |
          grep -q "QUITAR_PALABRA_DIA_V1_20260912" css/mejoras-producto.css
          grep -q 'VERSION_APP = "v75"' sw.js
          git diff --check

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mejoras-producto.css sw.js
          git commit -m "Quitar Palabra del dia del inicio"
          git push origin HEAD:develop
