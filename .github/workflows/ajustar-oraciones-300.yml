name: Ajustar Oraciones a 300

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ajustar-oraciones-300.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar mejoras de Oraciones
        run: python scripts/ajustar_oraciones_300.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          grep -q '300 actividades' js/oraciones.js
          grep -q '50 por nivel' js/oraciones.js
          grep -q 'logo-oraciones' js/oraciones.js
          grep -q 'amigos y redes' js/oraciones.js
          grep -q '"chat50"' js/oraciones.js
          grep -q '"adv50"' js/oraciones.js
          grep -q 'const VERSION_APP = "v36";' sw.js
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/oraciones.js sw.js
          git commit -m "Mejorar Oraciones y ampliar a 300 actividades"
          git push origin HEAD:develop
