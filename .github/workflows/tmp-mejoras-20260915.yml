name: Temporal mejoras pendientes 2026-09-15

on:
  push:
    branches: [develop]
    paths:
      - "scripts/tmp_mejoras_20260915.py"
      - ".github/workflows/tmp-mejoras-20260915.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar mejoras
        run: python scripts/tmp_mejoras_20260915.py

      - name: Validar cambios críticos
        shell: bash
        run: |
          set -e
          node --check js/script.js
          node --check sw.js
          python scripts/validar_publicacion_publica.py
          python scripts/validar_admin_analytics.py
          python scripts/auditar_contenido_pendiente.py
          python scripts/auditar_duplicados.py
          git diff --check

      - name: Guardar mejoras
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/script.js admin/busquedas.html sw.js
          git commit -m "fix: alinear estadísticas y reforzar Analytics"
          git pull --rebase origin develop
          git push origin HEAD:develop
