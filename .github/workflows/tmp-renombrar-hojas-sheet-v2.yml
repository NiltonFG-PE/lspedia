name: Temporal renombrar referencias de hojas v2

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-renombrar-hojas-sheet-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renombrar-referencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reemplazar referencias antiguas fuera de workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          cambiados = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github/workflows' in p.as_posix():
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              nuevo = data.replace('Hoja 1', 'Diccionario').replace('Hoja 2', 'Vocabulario')
              if nuevo != data:
                  p.write_text(nuevo, encoding='utf-8')
                  cambiados.append(str(p))
          print('Archivos actualizados:')
          for p in cambiados:
              print(' -', p)
          PY

      - name: Verificar sintaxis
        shell: bash
        run: |
          if grep -RIn --exclude-dir='.git' --exclude-dir='.github/workflows' -E 'Hoja 1|Hoja 2' .; then
            echo 'Quedaron referencias antiguas fuera de workflows.'
            exit 1
          fi
          node --check js/script.js
          node --check js/security.js
          node --check js/alfabetizacion.js
          python -m py_compile scripts/*.py
          git diff --check

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No había referencias antiguas que cambiar.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows'
          git commit -m "refactor: renombrar hojas Diccionario y Vocabulario"
          git push origin develop
