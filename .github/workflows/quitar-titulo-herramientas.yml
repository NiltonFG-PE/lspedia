name: Quitar título de Herramientas

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/quitar-titulo-herramientas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Quitar título redundante
        run: python scripts/quitar_titulo_herramientas.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '<h4 class="fw-bold mb-3 text-center herr-titulo-icono-wrap">' index.html
          grep -q 'id="herramientasMenuMovil"' index.html
          grep -q 'id="btnHerrMovilAlfabetizacion"' index.html
          grep -q 'id="btnHerrMovilJugar"' index.html
          grep -q 'id="btnHerrMovilSubtitulos"' index.html
          grep -q 'const VERSION_APP = "v37";' sw.js
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Quitar título redundante de Herramientas"
          git push origin HEAD:develop
