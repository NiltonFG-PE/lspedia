name: Reforzar HTML dinámico

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/reforzar-html-dinamico.yml'

permissions:
  contents: write

jobs:
  reforzar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar protecciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ruta = Path('js/script.js')
          texto = ruta.read_text(encoding='utf-8')

          # 1) Helpers reutilizables para cualquier dato que venga de JSON/Sheets
          ancla = '''function formatearDefinicion(texto){'''
          helpers = '''// Escapa cualquier dato externo antes de insertarlo dentro de innerHTML.
// Se usa para palabras, categorías, variantes y texto escrito por el usuario.
function escaparHtml(valor){
    return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[caracter]);
}

function escaparAtributoHtml(valor){
    return escaparHtml(valor);
}

// Solo permite imágenes http/https (incluidas rutas relativas del propio sitio).
// Bloquea protocolos como javascript:, data:, file:, etc.
function normalizarUrlImagenSegura(valor){
    const textoUrl = String(valor || "").trim();
    if(!textoUrl) return "";
    try {
        const url = new URL(textoUrl, window.location.href);
        if(url.protocol !== "http:" && url.protocol !== "https:") return "";
        return url.href;
    } catch(_error){
        return "";
    }
}

'''
          if 'function escaparHtml(valor)' not in texto:
              if ancla not in texto:
                  raise SystemExit('No se encontró el ancla de formatearDefinicion.')
              texto = texto.replace(ancla, helpers + ancla, 1)

          reemplazos = {
              'boton.innerHTML = `<strong>${p.palabra}</strong> <span class="badge" style="font-size: 10px;">${p.categoria.trim()}</span>`;':
              'boton.innerHTML = `<strong>${escaparHtml(p.palabra)}</strong> <span class="badge" style="font-size: 10px;">${escaparHtml(p.categoria.trim())}</span>`;',

              'let textoMatch = `<strong>${p.palabra}</strong>`;':
              'let textoMatch = `<strong>${escaparHtml(p.palabra)}</strong>`;',

              '(Variante: ${varianteCoincidente})':
              '(Variante: ${escaparHtml(varianteCoincidente)})',

              '(Variante: ${varianteCoincidenteCat})':
              '(Variante: ${escaparHtml(varianteCoincidenteCat)})',

              'alt="Seña de ${p.palabra}"':
              'alt="Seña de ${escaparAtributoHtml(p.palabra)}"',

              '<span class="badge" style="font-size: 10px;">${p.categoria.trim()}</span>':
              '<span class="badge" style="font-size: 10px;">${escaparHtml(p.categoria.trim())}</span>',

              'No hay resultados para "${texto}"':
              'No hay resultados para "${escaparHtml(texto)}"',

              'No hay resultados para "${textoOriginal}"':
              'No hay resultados para "${escaparHtml(textoOriginal)}"',

              'No encontramos "${buscar.value}"':
              'No encontramos "${escaparHtml(buscar.value)}"',

              '<span class="text-muted small fst-italic">${p.variantes}</span>':
              '<span class="text-muted small fst-italic">${escaparHtml(p.variantes)}</span>',

              '<span class="badge bg-primary mb-2" style="font-size: 11px;">${p.categoria.trim()}</span>':
              '<span class="badge bg-primary mb-2" style="font-size: 11px;">${escaparHtml(p.categoria.trim())}</span>',

              '<h3 class="fw-bold mb-0" style="color: #0d6efd;">${p.palabra}</h3>':
              '<h3 class="fw-bold mb-0" style="color: #0d6efd;">${escaparHtml(p.palabra)}</h3>',

              '${p.categoria ? `<span class="badge bg-primary mb-2 ms-1" style="font-size: 11px;">${p.categoria.trim()}</span>` : ""}':
              '${p.categoria ? `<span class="badge bg-primary mb-2 ms-1" style="font-size: 11px;">${escaparHtml(p.categoria.trim())}</span>` : ""}',

              '${p.nivel ? `<span class="badge bg-secondary mb-2 ms-1" style="font-size: 11px;">${p.nivel}</span>` : ""}':
              '${p.nivel ? `<span class="badge bg-secondary mb-2 ms-1" style="font-size: 11px;">${escaparHtml(p.nivel)}</span>` : ""}',

              '<h6 class="mb-0 fw-bold text-primary">${p.palabra}</h6>':
              '<h6 class="mb-0 fw-bold text-primary">${escaparHtml(p.palabra)}</h6>'
          }

          for viejo, nuevo in reemplazos.items():
              if viejo in texto:
                  texto = texto.replace(viejo, nuevo)

          # 2) Sanitizar URLs de imágenes antes de usarlas en src/onclick.
          viejo = '''function obtenerImagenesDeApoyo(p){
    const propias = (p.imagen || "")
        .split(",")
        .map(url => url.trim())
        .filter(url => url !== "");
    if(propias.length > 0) return propias;
    const deCategoria = p.categoria ? IMAGENES_CATEGORIA[p.categoria.trim()] : null;
    return deCategoria ? [deCategoria] : [];
}'''
          nuevo = '''function obtenerImagenesDeApoyo(p){
    const propias = (p.imagen || "")
        .split(",")
        .map(normalizarUrlImagenSegura)
        .filter(Boolean);
    if(propias.length > 0) return propias;
    const deCategoria = p.categoria ? normalizarUrlImagenSegura(IMAGENES_CATEGORIA[p.categoria.trim()]) : "";
    return deCategoria ? [deCategoria] : [];
}'''
          if viejo not in texto:
              raise SystemExit('No se encontró obtenerImagenesDeApoyo esperado.')
          texto = texto.replace(viejo, nuevo, 1)

          viejo = '''function generarMiniaturaSugerencia(p){
    const primeraImagen = (p.imagen || "").split(",")[0].trim();
    if(primeraImagen){
        return `<img src="${primeraImagen}" class="img-fluid rounded" style="height: 70px; width: 70px; object-fit: cover;" alt="Imagen de apoyo visual para ${p.palabra}">`;
    }'''
          nuevo = '''function generarMiniaturaSugerencia(p){
    const primeraImagen = normalizarUrlImagenSegura((p.imagen || "").split(",")[0]);
    if(primeraImagen){
        return `<img src="${escaparAtributoHtml(primeraImagen)}" class="img-fluid rounded" style="height: 70px; width: 70px; object-fit: cover;" alt="Imagen de apoyo visual para ${escaparAtributoHtml(p.palabra)}">`;
    }'''
          if viejo not in texto:
              raise SystemExit('No se encontró generarMiniaturaSugerencia esperado.')
          texto = texto.replace(viejo, nuevo, 1)

          # 3) Nombre/URL seguros dentro del bloque de imágenes de apoyo.
          texto = texto.replace(
              'function generarBloqueImagenApoyo(imagenesPalabra, nombrePalabra){\n    const escaparComillasImg = (texto) => texto.replace(/\'/g, "\\\\\'");',
              'function generarBloqueImagenApoyo(imagenesPalabra, nombrePalabra){\n    const nombreSeguro = escaparAtributoHtml(nombrePalabra);\n    const escaparComillasImg = (texto) => String(texto || "").replace(/\\\\/g, "\\\\\\\\").replace(/\'/g, "\\\\\'").replace(/\\r/g, "\\\\r").replace(/\\n/g, "\\\\n");'
          )
          texto = texto.replace('alt="Imagen de apoyo visual para ${nombrePalabra}"', 'alt="Imagen de apoyo visual para ${nombreSeguro}"')
          texto = texto.replace('alt="Imagen de apoyo visual ${i + 1} de ${imagenesPalabra.length} para ${nombrePalabra}"', 'alt="Imagen de apoyo visual ${i + 1} de ${imagenesPalabra.length} para ${nombreSeguro}"')
          texto = texto.replace('src="${imagenesPalabra[0]}"', 'src="${escaparAtributoHtml(imagenesPalabra[0])}"')
          texto = texto.replace('src="${url}" class="apoyo-visual-img"', 'src="${escaparAtributoHtml(url)}" class="apoyo-visual-img"')

          ruta.write_text(texto, encoding='utf-8')

          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          sw_texto = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v24";', sw_texto, count=1)
          sw.write_text(sw_texto, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          node --check js/script.js
          git diff --check
          grep -q 'function escaparHtml(valor)' js/script.js
          grep -q 'normalizarUrlImagenSegura' js/script.js
          grep -q 'escaparHtml(buscar.value)' js/script.js
          grep -q 'escaparHtml(p.variantes)' js/script.js
          grep -q 'const VERSION_APP = "v24"' sw.js

      - name: Guardar en develop
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/script.js sw.js
          git commit -m 'Proteger HTML dinámico y URLs de contenido'
          git push origin develop
