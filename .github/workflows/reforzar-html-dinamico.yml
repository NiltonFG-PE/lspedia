name: Reforzar HTML dinámico

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/reforzar-html-dinamico.yml'

permissions:
  contents: write

jobs:
  reforzar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar protecciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          ruta = Path('js/script.js')
          texto = ruta.read_text(encoding='utf-8')
          ancla = 'function formatearDefinicion(texto){'
          helpers = "\n".join([
              '// Escapa cualquier dato externo antes de insertarlo dentro de innerHTML.',
              '// Se usa para palabras, categorías, variantes y texto escrito por el usuario.',
              'function escaparHtml(valor){',
              '    return String(valor ?? "").replace(/[&<>"\\\']/g, caracter => ({',
              '        "&": "&amp;", "<": "&lt;", ">": "&gt;", \'"\': "&quot;", "\\\'": "&#39;"',
              '    })[caracter]);',
              '}',
              '',
              'function escaparAtributoHtml(valor){',
              '    return escaparHtml(valor);',
              '}',
              '',
              'function escaparCadenaJsAtributo(valor){',
              '    return String(valor ?? "")',
              '        .replace(/\\\\/g, "\\\\\\\\")',
              '        .replace(/\\\'/g, "\\\\x27")',
              '        .replace(/"/g, "\\\\x22")',
              '        .replace(/&/g, "\\\\x26")',
              '        .replace(/</g, "\\\\x3C")',
              '        .replace(/>/g, "\\\\x3E")',
              '        .replace(/\\r/g, "\\\\r")',
              '        .replace(/\\n/g, "\\\\n");',
              '}',
              '',
              '// Solo permite imágenes http/https, incluidas rutas relativas del propio sitio.',
              'function normalizarUrlImagenSegura(valor){',
              '    const textoUrl = String(valor || "").trim();',
              '    if(!textoUrl) return "";',
              '    try {',
              '        const url = new URL(textoUrl, window.location.href);',
              '        if(url.protocol !== "http:" && url.protocol !== "https:") return "";',
              '        return url.href;',
              '    } catch(_error){',
              '        return "";',
              '    }',
              '}',
              ''
          ]) + "\n"
          if 'function escaparHtml(valor)' not in texto:
              if ancla not in texto:
                  raise SystemExit('No se encontró formatearDefinicion.')
              texto = texto.replace(ancla, helpers + ancla, 1)

          pares = [
              ('boton.innerHTML = `<strong>${p.palabra}</strong> <span class="badge" style="font-size: 10px;">${p.categoria.trim()}</span>`;', 'boton.innerHTML = `<strong>${escaparHtml(p.palabra)}</strong> <span class="badge" style="font-size: 10px;">${escaparHtml(p.categoria.trim())}</span>`;'),
              ('let textoMatch = `<strong>${p.palabra}</strong>`;', 'let textoMatch = `<strong>${escaparHtml(p.palabra)}</strong>`;'),
              ('(Variante: ${varianteCoincidente})', '(Variante: ${escaparHtml(varianteCoincidente)})'),
              ('(Variante: ${varianteCoincidenteCat})', '(Variante: ${escaparHtml(varianteCoincidenteCat)})'),
              ('alt="Seña de ${p.palabra}"', 'alt="Seña de ${escaparAtributoHtml(p.palabra)}"'),
              ('<span class="badge" style="font-size: 10px;">${p.categoria.trim()}</span>', '<span class="badge" style="font-size: 10px;">${escaparHtml(p.categoria.trim())}</span>'),
              ('No hay resultados para "${texto}"', 'No hay resultados para "${escaparHtml(texto)}"'),
              ('No hay resultados para "${textoOriginal}"', 'No hay resultados para "${escaparHtml(textoOriginal)}"'),
              ('No encontramos "${buscar.value}"', 'No encontramos "${escaparHtml(buscar.value)}"'),
              ('<span class="text-muted small fst-italic">${p.variantes}</span>', '<span class="text-muted small fst-italic">${escaparHtml(p.variantes)}</span>'),
              ('<span class="badge bg-primary mb-2" style="font-size: 11px;">${p.categoria.trim()}</span>', '<span class="badge bg-primary mb-2" style="font-size: 11px;">${escaparHtml(p.categoria.trim())}</span>'),
              ('<h3 class="fw-bold mb-0" style="color: #0d6efd;">${p.palabra}</h3>', '<h3 class="fw-bold mb-0" style="color: #0d6efd;">${escaparHtml(p.palabra)}</h3>'),
              ('${p.categoria ? `<span class="badge bg-primary mb-2 ms-1" style="font-size: 11px;">${p.categoria.trim()}</span>` : ""}', '${p.categoria ? `<span class="badge bg-primary mb-2 ms-1" style="font-size: 11px;">${escaparHtml(p.categoria.trim())}</span>` : ""}'),
              ('${p.nivel ? `<span class="badge bg-secondary mb-2 ms-1" style="font-size: 11px;">${p.nivel}</span>` : ""}', '${p.nivel ? `<span class="badge bg-secondary mb-2 ms-1" style="font-size: 11px;">${escaparHtml(p.nivel)}</span>` : ""}'),
              ('<h6 class="mb-0 fw-bold text-primary">${p.palabra}</h6>', '<h6 class="mb-0 fw-bold text-primary">${escaparHtml(p.palabra)}</h6>')
          ]
          for viejo, nuevo in pares:
              texto = texto.replace(viejo, nuevo)

          patron = re.compile(r'function obtenerImagenesDeApoyo\(p\)\{\n    const propias = \(p\.imagen \|\| ""\)\n        \.split\(","\)\n        \.map\(url => url\.trim\(\)\)\n        \.filter\(url => url !== ""\);\n    if\(propias\.length > 0\) return propias;\n    const deCategoria = p\.categoria \? IMAGENES_CATEGORIA\[p\.categoria\.trim\(\)\] : null;\n    return deCategoria \? \[deCategoria\] : \[\];\n\}')
          reemplazo = "\n".join([
              'function obtenerImagenesDeApoyo(p){',
              '    const propias = (p.imagen || "")',
              '        .split(",")',
              '        .map(normalizarUrlImagenSegura)',
              '        .filter(Boolean);',
              '    if(propias.length > 0) return propias;',
              '    const deCategoria = p.categoria ? normalizarUrlImagenSegura(IMAGENES_CATEGORIA[p.categoria.trim()]) : "";',
              '    return deCategoria ? [deCategoria] : [];',
              '}'
          ])
          texto, n = patron.subn(reemplazo, texto, count=1)
          if n != 1:
              raise SystemExit('No se pudo proteger obtenerImagenesDeApoyo.')

          texto = texto.replace('const primeraImagen = (p.imagen || "").split(",")[0].trim();', 'const primeraImagen = normalizarUrlImagenSegura((p.imagen || "").split(",")[0]);')
          texto = texto.replace('src="${primeraImagen}" class="img-fluid rounded" style="height: 70px; width: 70px; object-fit: cover;" alt="Imagen de apoyo visual para ${p.palabra}"', 'src="${escaparAtributoHtml(primeraImagen)}" class="img-fluid rounded" style="height: 70px; width: 70px; object-fit: cover;" alt="Imagen de apoyo visual para ${escaparAtributoHtml(p.palabra)}"')

          texto = texto.replace('const escaparComillasImg = (texto) => texto.replace(/\'/g, "\\\\\'");', 'const nombreSeguro = escaparAtributoHtml(nombrePalabra);\n    const escaparComillasImg = escaparCadenaJsAtributo;')
          texto = texto.replace("onclick=\"abrirImagenAmpliada('${imagenesPalabra[0]}', '${escaparComillasImg(nombrePalabra)}')\"", "onclick=\"abrirImagenAmpliada('${escaparComillasImg(imagenesPalabra[0])}', '${escaparComillasImg(nombrePalabra)}')\"")
          texto = texto.replace("onkeypress=\"if(event.key==='Enter') abrirImagenAmpliada('${imagenesPalabra[0]}', '${escaparComillasImg(nombrePalabra)}')\"", "onkeypress=\"if(event.key==='Enter') abrirImagenAmpliada('${escaparComillasImg(imagenesPalabra[0])}', '${escaparComillasImg(nombrePalabra)}')\"")
          texto = texto.replace("onclick=\"abrirImagenAmpliada('${url}', '${escaparComillasImg(nombrePalabra)}')\"", "onclick=\"abrirImagenAmpliada('${escaparComillasImg(url)}', '${escaparComillasImg(nombrePalabra)}')\"")
          texto = texto.replace("onkeypress=\"if(event.key==='Enter') abrirImagenAmpliada('${url}', '${escaparComillasImg(nombrePalabra)}')\"", "onkeypress=\"if(event.key==='Enter') abrirImagenAmpliada('${escaparComillasImg(url)}', '${escaparComillasImg(nombrePalabra)}')\"")
          texto = texto.replace('src="${imagenesPalabra[0]}"', 'src="${escaparAtributoHtml(imagenesPalabra[0])}"')
          texto = texto.replace('src="${url}" class="apoyo-visual-img"', 'src="${escaparAtributoHtml(url)}" class="apoyo-visual-img"')
          texto = texto.replace('alt="Imagen de apoyo visual para ${nombrePalabra}"', 'alt="Imagen de apoyo visual para ${nombreSeguro}"')
          texto = texto.replace('alt="Imagen de apoyo visual ${i + 1} de ${imagenesPalabra.length} para ${nombrePalabra}"', 'alt="Imagen de apoyo visual ${i + 1} de ${imagenesPalabra.length} para ${nombreSeguro}"')

          ruta.write_text(texto, encoding='utf-8')
          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          sw_texto = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v24";', sw_texto, count=1)
          sw.write_text(sw_texto, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          node --check js/script.js
          git diff --check
          grep -q 'function escaparHtml(valor)' js/script.js
          grep -q 'function escaparCadenaJsAtributo(valor)' js/script.js
          grep -q 'normalizarUrlImagenSegura' js/script.js
          grep -q 'escaparHtml(buscar.value)' js/script.js
          grep -q 'escaparHtml(p.variantes)' js/script.js
          grep -q 'const VERSION_APP = "v24"' sw.js

      - name: Guardar en develop
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/script.js sw.js
          git commit -m 'Proteger HTML dinámico y URLs de contenido'
          git push origin develop
