name: Validar LSPedia

on:
  push:
    branches: [develop]
    paths:
      - "data/**"
      - "img/**"
      - "css/**"
      - "js/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "admin/**"
      - "apps-script/**"
      - "index.html"
      - "lab-senas-ia.html"
      - "lab-juego-educativo.html"
      - "sitemap.xml"
      - "robots.txt"
      - "CNAME"
      - "sw.js"
      - "scripts/validar_lspedia.py"
      - "scripts/validar_imagenes.py"
      - "scripts/validar_seguridad.py"
      - "scripts/validar_alfabetizacion.py"
      - "scripts/auditar_alfabetizacion.py"
      - "scripts/auditar_contenido_pendiente.py"
      - "scripts/normalizar_media_alfabetizacion.py"
      - "scripts/normalizar_categorias.py"
      - "scripts/generar_sitemap.py"
      - "scripts/validar_sitemap_publico.py"
      - "scripts/validar_seo_estatico.py"
      - "scripts/validar_senas_ia.py"
      - "scripts/validar_lab_juego.py"
      - "scripts/validar_fuentes_juegos.py"
      - "scripts/validar_red_segura.py"
      - "scripts/verificar_archivos_huerfanos.py"
      - "scripts/validar_publicacion_publica.py"
      - "scripts/validar_admin_analytics.py"
      - "scripts/publicar_generados.py"
      - "scripts/auditar_duplicados.py"
      - "scripts/validar_presupuesto_frontend.py"
      - ".github/workflows/validar-lspedia.yml"
  pull_request:
    branches: [develop]
    paths:
      - "data/**"
      - "img/**"
      - "css/**"
      - "js/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "admin/**"
      - "apps-script/**"
      - "index.html"
      - "lab-senas-ia.html"
      - "lab-juego-educativo.html"
      - "sitemap.xml"
      - "robots.txt"
      - "CNAME"
      - "sw.js"
      - "scripts/validar_lspedia.py"
      - "scripts/validar_imagenes.py"
      - "scripts/validar_seguridad.py"
      - "scripts/validar_alfabetizacion.py"
      - "scripts/auditar_alfabetizacion.py"
      - "scripts/auditar_contenido_pendiente.py"
      - "scripts/normalizar_media_alfabetizacion.py"
      - "scripts/normalizar_categorias.py"
      - "scripts/generar_sitemap.py"
      - "scripts/validar_sitemap_publico.py"
      - "scripts/validar_seo_estatico.py"
      - "scripts/validar_senas_ia.py"
      - "scripts/validar_lab_juego.py"
      - "scripts/validar_fuentes_juegos.py"
      - "scripts/validar_red_segura.py"
      - "scripts/verificar_archivos_huerfanos.py"
      - "scripts/validar_publicacion_publica.py"
      - "scripts/validar_admin_analytics.py"
      - "scripts/publicar_generados.py"
      - "scripts/auditar_duplicados.py"
      - "scripts/validar_presupuesto_frontend.py"
      - ".github/workflows/validar-lspedia.yml"
  schedule:
    - cron: "17 08 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-lspedia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'develop' }}
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validar Diccionario y Vocabulario
        run: python scripts/validar_lspedia.py
      - name: Auditar contenido pendiente sin modificar datos
        run: python scripts/auditar_contenido_pendiente.py
      - name: Auditar duplicados sin modificar datos
        run: python scripts/auditar_duplicados.py
      - name: Auditar Alfabetizacion completa
        shell: bash
        run: |
          python scripts/normalizar_media_alfabetizacion.py --check
          python scripts/validar_alfabetizacion.py
          python scripts/auditar_alfabetizacion.py
      - name: Validar fuentes de Juegos
        run: python scripts/validar_fuentes_juegos.py
      - name: Validar resiliencia de red
        run: python scripts/validar_red_segura.py
      - name: Validar seguridad anti-clon
        run: python scripts/validar_seguridad.py
      - name: Validar sintaxis de JavaScript
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' archivo; do
            if [ "$archivo" = "js/lab-senas-ia.js" ]; then
              continue
            fi
            echo "Revisando $archivo"
            node --check "$archivo"
          done < <(find js -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          echo "Revisando js/lab-senas-ia.js como módulo ES"
          cp js/lab-senas-ia.js /tmp/lab-senas-ia.mjs
          node --check /tmp/lab-senas-ia.mjs
          node --check sw.js
      - name: Probar prioridad y carga del buscador
        run: npm test
      - name: Probar publicación concurrente sin pérdida de datos
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validar JSON principales
        shell: bash
        run: |
          python -m json.tool data/palabras.json > /dev/null
          python -m json.tool data/vocabulario.json > /dev/null
          python -m json.tool data/alfabetizacion.json > /dev/null
          python -m json.tool data/senas-ia-dataset.json > /dev/null
          if [ -f data/nuevas-palabras.json ]; then python -m json.tool data/nuevas-palabras.json > /dev/null; fi
          echo "JSON válidos."
      - name: Validar cobertura completa del modo EN
        run: python scripts/validar_ingles.py
      - name: Validar dataset de señas IA
        run: python scripts/validar_senas_ia.py
      - name: Validar laboratorio de videojuego
        run: python scripts/validar_lab_juego.py
      - name: Validar publicación y estadísticas públicas
        run: python scripts/validar_publicacion_publica.py
      - name: Validar sitemap público
        run: python scripts/validar_sitemap_publico.py
      - name: Validar SEO estático
        run: python scripts/validar_seo_estatico.py
      - name: Validar panel Analytics
        run: python scripts/validar_admin_analytics.py
      - name: Validar presupuesto del frontend
        run: python scripts/validar_presupuesto_frontend.py
      - name: Comprobar archivos históricos huérfanos
        run: python scripts/verificar_archivos_huerfanos.py
      - name: Validar imágenes locales
        run: python scripts/validar_imagenes.py
      - name: Verificar formato y archivo protegido
        shell: bash
        run: |
          git diff --check
          test -f 'video/lspedia_transparente anterior.webm'
          test "$(git hash-object 'video/lspedia_transparente anterior.webm')" = 'ca9a110b75384b534f8ebdcae45406fb178df083'

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'develop' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Comprobar búsqueda en escritorio y móvil
        run: npm run test:browser
      - name: Comprobar transcripción y controles de Subtítulos
        run: npm run test:subtitulos-browser
      - name: Comprobar Adivina qué soy en móvil
        run: npm run test:adivina-browser
