name: Endurecer red e IA

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/endurecer-red-ia.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar mejoras técnicas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def reemplazar(path, viejo, nuevo, veces=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if nuevo in s:
                  return
              if viejo not in s:
                  raise SystemExit(f'No se encontró bloque esperado en {path}')
              s = s.replace(viejo, nuevo, veces)
              p.write_text(s, encoding='utf-8', newline='\n')

          reemplazar(
              'js/lazy-modules.js',
              "const VERSION = '20260914-1';",
              "const VERSION = '20260914-4';"
          )

          reemplazar(
              'js/mejoras-producto.js',
              '   La regla pública del Diccionario vive en security.js para evitar duplicarla. */',
              '   La publicación vive en script.js/Vocabulario público; security.js queda solo para seguridad. */'
          )

          reemplazar(
              'js/mejoras-producto.js',
              """    cargar('js/lspedia-core.js?v=20260914-2', function(){
        cargar('js/vocabulario-publico.js?v=20260914-1');
        cargar('js/accesibilidad-segura.js?v=20260914-1');
        cargar('js/seo-institucional.js?v=20260914-1');
        cargar('js/juegos-banco-compartido.js?v=20260914');
        cargar('js/a-z-movil.js?v=20260914');
    });""",
              """    function cargarMejorasConCore(){
        cargar('js/vocabulario-publico.js?v=20260914-2');
        cargar('js/accesibilidad-segura.js?v=20260914-1');
        cargar('js/seo-institucional.js?v=20260914-1');
        cargar('js/juegos-banco-compartido.js?v=20260914-2');
        cargar('js/a-z-movil.js?v=20260914');
    }
    if(window.LSPediaCore) cargarMejorasConCore();
    else cargar('js/lspedia-core.js?v=20260914-3', cargarMejorasConCore);"""
          )

          p = Path('js/lab-senas-ia.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "const DATASET_CENTRAL_URL = 'data/senas-ia-dataset.json?v=20260914-2';",
              "const DATASET_CENTRAL_URL = 'data/senas-ia-dataset.json?v=20260914-3';",
              1
          )
          ancla = "let evaluando = false;\n"
          helper = """let evaluando = false;

async function conTimeout(promesa, timeoutMs, mensaje) {
  let temporizador = null;
  try {
    return await Promise.race([
      promesa,
      new Promise((_, reject) => {
        temporizador = setTimeout(() => reject(new Error(mensaje || 'Tiempo de espera agotado.')), timeoutMs);
      })
    ]);
  } finally {
    if (temporizador) clearTimeout(temporizador);
  }
}

async function leerJsonConTimeout(url, timeoutMs = 6500) {
  const controlador = typeof AbortController !== 'undefined' ? new AbortController() : null;
  let temporizador = null;
  try {
    const promesaFetch = fetch(url, controlador ? { cache: 'no-store', signal: controlador.signal } : { cache: 'no-store' });
    const respuesta = await Promise.race([
      promesaFetch,
      new Promise((_, reject) => {
        temporizador = setTimeout(() => {
          if (controlador) {
            try { controlador.abort(); } catch (_e) {}
          }
          reject(new Error('Tiempo de espera agotado al cargar el dataset central.'));
        }, timeoutMs);
      })
    ]);
    if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
    return await respuesta.json();
  } finally {
    if (temporizador) clearTimeout(temporizador);
  }
}
"""
          if 'async function leerJsonConTimeout' not in s:
              if ancla not in s:
                  raise SystemExit('No se encontró ancla de helpers IA')
              s = s.replace(ancla, helper, 1)

          viejo_dataset = """    const respuesta = await fetch(DATASET_CENTRAL_URL, { cache: 'no-store' });
    if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
    const data = await respuesta.json();"""
          nuevo_dataset = """    const data = await leerJsonConTimeout(DATASET_CENTRAL_URL, 6500);"""
          if viejo_dataset in s:
              s = s.replace(viejo_dataset, nuevo_dataset, 1)
          elif nuevo_dataset not in s:
              raise SystemExit('No se encontró bloque de dataset IA')

          viejo_detector = """  const vision = await FilesetResolver.forVisionTasks(WASM_URL);
  detector = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MODEL_URL },
    runningMode: 'VIDEO',
    numHands: 2,
    minHandDetectionConfidence: 0.55,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });"""
          nuevo_detector = """  const vision = await conTimeout(
    FilesetResolver.forVisionTasks(WASM_URL),
    15000,
    'El motor de visión tardó demasiado en cargar.'
  );
  detector = await conTimeout(
    HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL_URL },
      runningMode: 'VIDEO',
      numHands: 2,
      minHandDetectionConfidence: 0.55,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    }),
    20000,
    'El modelo de manos tardó demasiado en cargar.'
  );"""
          if viejo_detector in s:
              s = s.replace(viejo_detector, nuevo_detector, 1)
          elif nuevo_detector not in s:
              raise SystemExit('No se encontró bloque del detector IA')
          p.write_text(s, encoding='utf-8', newline='\n')

          reemplazar(
              'lab-senas-ia.html',
              'js/lab-senas-ia.js?v=20260914-2',
              'js/lab-senas-ia.js?v=20260914-3'
          )
          reemplazar('sw.js', 'const VERSION_APP = "v126";', 'const VERSION_APP = "v127";')
          PY

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          node --check js/lazy-modules.js
          node --check js/mejoras-producto.js
          node --check sw.js
          cp js/lab-senas-ia.js /tmp/lab-senas-ia.mjs
          node --check /tmp/lab-senas-ia.mjs
          python scripts/validar_red_segura.py
          python scripts/validar_senas_ia.py
          python scripts/validar_fuentes_juegos.py
          python scripts/verificar_archivos_huerfanos.py
          git diff --check

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/lazy-modules.js js/mejoras-producto.js js/lab-senas-ia.js lab-senas-ia.html sw.js
          git commit -m "refactor: endurecer red y laboratorio de señas IA"
          git push origin develop
