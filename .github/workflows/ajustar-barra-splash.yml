name: Ajustar barra de carga del splash

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/ajustar-barra-splash.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar barra progresiva
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          texto = index.read_text(encoding='utf-8')

          texto, c1 = re.subn(
              r'''(?s)(\.splash-barra \{\s*position: absolute;\s*inset: 0 auto 0 0;\s*)width: 42%;(\s*border-radius: inherit;\s*background: linear-gradient\(90deg, #1789df 0%, #3cbcf1 100%\);\s*)animation: splashCargando 1\.75s cubic-bezier\(0\.45, 0, 0\.25, 1\) infinite;''',
              r'''\1width: 0%;\2animation: splashCargando 1.65s cubic-bezier(0.22, 0.68, 0.25, 1) forwards;''',
              texto,
              count=1,
          )
          if c1 != 1:
              raise SystemExit(f'ERROR: bloque .splash-barra no encontrado ({c1}).')

          texto, c2 = re.subn(
              r'''(?s)@keyframes splashCargando \{\s*0%\s*\{[^}]*\}\s*48%\s*\{[^}]*\}\s*76%\s*\{[^}]*\}\s*100%\s*\{[^}]*\}\s*\}''',
              '''@keyframes splashCargando {
        0%   { width: 0%; }
        18%  { width: 14%; }
        42%  { width: 39%; }
        67%  { width: 68%; }
        84%  { width: 86%; }
        100% { width: 100%; }
    }''',
              texto,
              count=1,
          )
          if c2 != 1:
              raise SystemExit(f'ERROR: keyframes splashCargando no encontrado ({c2}).')

          texto, c3 = re.subn(
              r'''animation: splashBrillo 1\.75s ease-in-out infinite;''',
              '''animation: splashBrillo 1.65s ease-out forwards;''',
              texto,
              count=1,
          )
          if c3 != 1:
              raise SystemExit(f'ERROR: brillo de barra no encontrado ({c3}).')

          index.write_text(texto, encoding='utf-8', newline='\n')

          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          sw_nuevo, c4 = re.subn(
              r'const VERSION_APP = "v27";',
              'const VERSION_APP = "v28";',
              sw_texto,
              count=1,
          )
          if c4 != 1:
              raise SystemExit('ERROR: no se encontró VERSION_APP v27.')
          sw.write_text(sw_nuevo, encoding='utf-8', newline='\n')
          PY

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          grep -q '0%   { width: 0%; }' index.html
          grep -q '100% { width: 100%; }' index.html
          grep -q 'splashCargando 1.65s' index.html
          grep -q 'const VERSION_APP = "v28";' sw.js
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Hacer progresiva la barra del splash"
          git push origin HEAD:develop
