name: Temporal audio prediccion Senas IA

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/tmp_audio_prediccion_senas.py'
      - '.github/workflows/tmp-audio-prediccion-senas.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Aplicar audio Top 1
        run: python scripts/tmp_audio_prediccion_senas.py
      - name: Validar JavaScript
        run: |
          node --check js/lab-senas-ia.js
          python - <<'PY'
          from pathlib import Path
          s=Path('js/lab-senas-ia.js').read_text(encoding='utf-8')
          assert "function pronunciarPrimerResultadoPrediccion" in s
          assert "voz.lang = 'es-PE'" in s
          assert "pronunciarPrimerResultadoPrediccion(top[0][0]);" in s
          assert "window.speechSynthesis.cancel();" in s
          print('OK: Top 1 se pronuncia en español al terminar la predicción')
          PY
          git diff --check
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/lab-senas-ia.js
          git commit -m 'feat: pronunciar prediccion principal de senas IA'
          git push origin develop
