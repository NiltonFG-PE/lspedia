name: Temporal fullscreen móvil sin aviso

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-mobile-fullscreen-sin-aviso.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar parche
        run: python scripts/tmp_mobile_fullscreen_sin_aviso.py

      - name: Validar cambio
        run: |
          node --check js/script.js
          grep -q 'const esPantallaTactil' js/script.js
          grep -q 'const VERSION_APP = "v88";' sw.js

      - name: Guardar y retirar temporales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-mobile-fullscreen-sin-aviso.yml
          git rm scripts/tmp_mobile_fullscreen_sin_aviso.py
          git add js/script.js sw.js
          git commit -m "Usar fullscreen visual en pantallas tactiles"
          git push origin develop
