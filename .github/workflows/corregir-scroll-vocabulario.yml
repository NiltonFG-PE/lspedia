name: Corregir scroll inicial de Vocabulario

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/corregir-scroll-vocabulario.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar corrección
        run: python scripts/corregir_scroll_vocabulario.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'scrollAlPrimerResultado(bloqueBuscadorCategorias || panelCategorias);' js/script.js
          if grep -q "panelCategorias.scrollIntoView({ behavior: 'smooth', block: 'center' });" js/script.js; then
            echo 'Todavía existe el scroll antiguo de Vocabulario' >&2
            exit 1
          fi
          grep -q 'const VERSION_APP = "v38";' sw.js
          node --check js/script.js
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/script.js sw.js
          git commit -m "Corregir posición inicial al entrar a Vocabulario"
          git push origin HEAD:develop
