name: Temporal corregir migración orientación

on:
  push:
    branches: [develop]
    paths:
      - "scripts/fix_tmp_orientation_script.py"
      - ".github/workflows/tmp-fix-orientation-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Corregir script temporal
        run: python scripts/fix_tmp_orientation_script.py
      - name: Validar sintaxis del script
        run: python -m py_compile scripts/tmp_mejorar_senas_orientacion_auto.py
      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tmp_mejorar_senas_orientacion_auto.py
          git commit -m "fix: corregir migración temporal de orientación"
          git push origin develop
