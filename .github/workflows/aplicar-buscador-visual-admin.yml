name: Aplicar buscador visual y Admin por sección

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/aplicar-buscador-visual-admin.yml"

permissions:
  contents: write

concurrency:
  group: aplicar-buscador-visual-admin-develop
  cancel-in-progress: true

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Aplicar cambios seguros
        run: python scripts/aplicar_buscador_visual_admin.py

      - name: Validar cambios
        shell: bash
        run: |
          node --check js/buscador-visual.js
          node --check js/lo-nuevo.js
          node --check sw.js
          python -m py_compile scripts/generar_alfabetizacion.py
          python scripts/validar_lspedia.py
          python scripts/validar_alfabetizacion.py
          git diff --check

      - name: Guardar cambios y retirar archivos temporales
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aplicar-buscador-visual-admin.yml
          git rm scripts/aplicar_buscador_visual_admin.py
          git add js/lo-nuevo.js sw.js apps-script/admin_busquedas_ga4.gs admin/busquedas.html
          git commit -m "Activar búsqueda visual y Analytics por sección"
          git push origin HEAD:develop
