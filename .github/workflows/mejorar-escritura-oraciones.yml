name: Mejorar escritura automática en Oraciones

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/mejorar-escritura-oraciones.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar mejora
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ruta = Path('js/oraciones.js')
          texto = ruta.read_text(encoding='utf-8')

          patron = re.compile(r'    function renderWriting\(\)\{.*?\n    \}\n    \n    let audioCtxJuego=null;', re.S)

          nuevo = r'''    function renderWriting(){
     const a=$("activity");
     a.innerHTML=`<div class="write-wrap"><div class="write-line">${current.parts.map(x=>x==="___"?'<input id="writeInput" class="write-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="✍️">':`<span>${x}</span>`).join(" ")}</div><div class="help">Pista: ${current.hint}</div></div>`;

     const input=$("writeInput");
     const actividadId=current.id;
     const AUTO_COMPROBAR_MS=1400;
     const AUTO_SIGUIENTE_MS=1200;
     let autoCheckId=null;
     let resuelto=false;
     let componiendo=false;

     const normalizarRespuesta=(valor)=>String(valor||"").trim().replace(/\s+/g," ").toLocaleLowerCase("es-PE");

     const avanzarAutomaticamente=()=>{
       setTimeout(()=>{
         const gameEl=$("game");
         if(!current||current.id!==actividadId||!gameEl||gameEl.classList.contains("hidden"))return;
         state.index++;
         if(state.index>=5)finish();
         else loadRound();
       },AUTO_SIGUIENTE_MS);
     };

     const evaluar=()=>{
       if(resuelto||state.locked||state.tutorial)return;
       const valor=normalizarRespuesta(input.value);
       if(!valor)return;

       resuelto=true;
       clearTimeout(autoCheckId);
       input.disabled=true;
       stopTimer();

       if(valor===normalizarRespuesta(current.correct)){
         success("¡Lo escribiste bien!");
       }else{
         state.locked=true;
         error("Respuesta: "+current.correct);
       }

       // En escritura no se necesita pulsar “Siguiente”: el juego avanza solo.
       $("next").classList.add("hidden");
       avanzarAutomaticamente();
     };

     const programarEvaluacion=()=>{
       clearTimeout(autoCheckId);
       if(resuelto||state.locked||state.tutorial)return;
       if(!normalizarRespuesta(input.value))return;
       autoCheckId=setTimeout(evaluar,AUTO_COMPROBAR_MS);
     };

     input.addEventListener("input",()=>{if(!componiendo)programarEvaluacion()});
     input.addEventListener("compositionstart",()=>{componiendo=true;clearTimeout(autoCheckId)});
     input.addEventListener("compositionend",()=>{componiendo=false;programarEvaluacion()});
     input.addEventListener("keydown",e=>{
       if(e.key==="Enter"){
         e.preventDefault();
         clearTimeout(autoCheckId);
         evaluar();
       }
     });

     setTimeout(()=>{
       state.tutorial=true;
       const r=input.getBoundingClientRect();
       const h=document.createElement("div");
       h.className="hand";
       h.textContent="👆";
       h.style.left=(r.left+r.width/2)+"px";
       h.style.top=(r.top+r.height+5)+"px";
       shadow.appendChild(h);
       setTimeout(()=>{
         h.remove();
         state.tutorial=false;
         input.focus();
         startTimer();
       },1000)
     },450);
    }
    
    let audioCtxJuego=null;'''

          texto, n = patron.subn(nuevo, texto, count=1)
          if n != 1:
              raise SystemExit(f'No se pudo localizar renderWriting de forma segura. Coincidencias: {n}')
          ruta.write_text(texto, encoding='utf-8')

          sw = Path('sw.js')
          sw_texto = sw.read_text(encoding='utf-8')
          sw_texto = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v23";', sw_texto, count=1)
          sw.write_text(sw_texto, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          node --check js/oraciones.js
          git diff --check
          grep -q 'AUTO_COMPROBAR_MS=1400' js/oraciones.js
          grep -q 'replace(/\\s+/g," ")' js/oraciones.js
          grep -q 'Respuesta:' js/oraciones.js
          grep -q 'const VERSION_APP = "v23"' sw.js

      - name: Guardar en develop
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/oraciones.js sw.js
          git commit -m 'Automatizar verificación y avance en escritura de Oraciones'
          git push origin develop
