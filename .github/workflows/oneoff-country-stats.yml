name: One-off country analytics card

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/oneoff-country-stats.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Patch Analytics backend and admin UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # ---------------- Apps Script backend ----------------
          p = Path('apps-script/admin_busquedas_ga4.gs')
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              'function construirPanelAnalytics_(propertyId, periodo, fechas) {\n  const coreEndpoint = endpointData_(propertyId, "runReport");',
              'function construirPanelAnalytics_(propertyId, periodo, fechas) {\n  const fechas30dias = fechasPeriodo_("30");\n  const coreEndpoint = endpointData_(propertyId, "runReport");',
              'backend fechas30dias'
          )

          old_country = '''    {
      key: "paises",
      api: "Países",
      url: coreEndpoint,
      payload: {
        dateRanges: [{ startDate: fechas.inicio, endDate: fechas.fin }],
        dimensions: [{ name: "country" }, { name: "countryId" }],
        metrics: [{ name: "activeUsers" }, { name: "sessions" }],
        orderBys: [{ metric: { metricName: "activeUsers" }, desc: true }],
        limit: "100"
      }
    },'''
          new_country = '''    {
      key: "paises",
      api: "Países",
      url: coreEndpoint,
      payload: {
        dateRanges: [{ startDate: fechas.inicio, endDate: fechas.fin }],
        dimensions: [{ name: "country" }, { name: "countryId" }],
        metrics: [{ name: "activeUsers" }, { name: "sessions" }, { name: "eventCount" }],
        orderBys: [{ metric: { metricName: "activeUsers" }, desc: true }],
        limit: "100"
      }
    },
    {
      key: "paises30dias",
      api: "Países últimos 30 días",
      url: coreEndpoint,
      payload: {
        dateRanges: [{ startDate: fechas30dias.inicio, endDate: fechas30dias.fin }],
        dimensions: [{ name: "country" }, { name: "countryId" }],
        metrics: [{ name: "activeUsers" }, { name: "eventCount" }],
        orderBys: [{ metric: { metricName: "activeUsers" }, desc: true }],
        limit: "100"
      }
    },'''
          s = replace_once(s, old_country, new_country, 'backend country query')
          s = replace_once(
              s,
              '  const paises = parseFilas_(lote.datos.paises, ["pais", "codigo"], ["usuarios", "sesiones"]);',
              '  const paises = parseFilas_(lote.datos.paises, ["pais", "codigo"], ["usuarios", "sesiones", "interacciones"]);\n  const paises30dias = parseFilas_(lote.datos.paises30dias, ["pais", "codigo"], ["usuarios", "interacciones"]);',
              'backend country parse'
          )
          s = replace_once(
              s,
              '    paises: paises,\n    ciudades: ciudades,',
              '    paises: paises,\n    paises30dias: paises30dias,\n    ciudades: ciudades,',
              'backend country response'
          )
          p.write_text(s, encoding='utf-8')

          # ---------------- Admin frontend ----------------
          p = Path('admin/busquedas.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = '    .geo-lists{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n'
          css_new = css_anchor + '''    .country30-card{overflow:hidden;border-top:3px solid #0284c7}.country30-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:13px}.country30-kpi{border:1px solid #e5edf5;border-radius:12px;background:#f8fbfe;padding:11px}.country30-kpi strong{display:block;font-size:21px;line-height:1.1}.country30-kpi span{display:block;margin-top:4px;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.country30-table{width:100%;border-collapse:collapse}.country30-table th{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#718096;text-align:left;padding:8px 9px;border-bottom:1px solid #e6edf4}.country30-table th:not(:first-child),.country30-table td:not(:first-child){text-align:right}.country30-table td{padding:10px 9px;border-bottom:1px solid #eef2f6;font-size:12px}.country30-table tr:last-child td{border-bottom:0}.country30-name{display:flex;align-items:center;gap:7px;font-weight:800}.country30-flag{font-size:17px;line-height:1}.country30-value{font-weight:900}.country30-note{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.4}\n'''
          s = replace_once(s, css_anchor, css_new, 'frontend country css')
          s = replace_once(
              s,
              '      .section-title{align-items:flex-start;flex-direction:column}.geo-lists{grid-template-columns:1fr}.error-grid{grid-template-columns:1fr 1fr}',
              '      .section-title{align-items:flex-start;flex-direction:column}.geo-lists{grid-template-columns:1fr}.country30-summary{grid-template-columns:1fr 1fr}.country30-summary .country30-kpi:last-child{grid-column:1/-1}.error-grid{grid-template-columns:1fr 1fr}',
              'frontend country mobile css'
          )

          html_anchor = '    <div class="section-title"><div><h2>Tendencia y dispositivos</h2><p>Evolución diaria del periodo y tipo de equipo usado ahora.</p></div></div>'
          html_new = '''    <div class="section-title"><div><h2>Países · últimos 30 días</h2><p>De dónde llegan los usuarios y cuántas interacciones registra LSPedia en cada país.</p></div></div>
    <section class="card panel country30-card">
      <div class="panel-head"><div><h3>🌍 Audiencia internacional</h3><p>Usuarios activos e interacciones (eventos de GA4), siempre calculados sobre los últimos 30 días.</p></div><span class="mini-badge">30 días</span></div>
      <div class="country30-summary">
        <div class="country30-kpi"><strong id="country30Countries">0</strong><span>Países</span></div>
        <div class="country30-kpi"><strong id="country30Users">0</strong><span>Usuarios</span></div>
        <div class="country30-kpi"><strong id="country30Interactions">0</strong><span>Interacciones</span></div>
      </div>
      <div class="table-wrap">
        <table class="country30-table">
          <thead><tr><th>País</th><th>Usuarios</th><th>Interacciones</th></tr></thead>
          <tbody id="country30Body"><tr><td colspan="3" class="muted">Cargando datos…</td></tr></tbody>
        </table>
      </div>
      <div class="country30-note">Interacciones = eventos registrados por Google Analytics. Los datos son agregados y no identifican personas.</div>
    </section>

''' + html_anchor
          s = replace_once(s, html_anchor, html_new, 'frontend country html')

          s = replace_once(
              s,
              "    sourceList:$('sourceList'),pageList:$('pageList'),countryList:$('countryList'),cityList:$('cityList'),eventList:$('eventList'),",
              "    sourceList:$('sourceList'),pageList:$('pageList'),countryList:$('countryList'),cityList:$('cityList'),eventList:$('eventList'),\n    country30Body:$('country30Body'),country30Countries:$('country30Countries'),country30Users:$('country30Users'),country30Interactions:$('country30Interactions'),",
              'frontend country refs'
          )

          render_anchor = '''  function renderGeneral(data){
    renderRealtime(data.realtime||{});'''
          render_new = '''  function banderaPais(codigo){
    const c=String(codigo||'').trim().toUpperCase();
    if(!/^[A-Z]{2}$/.test(c))return '🌐';
    return String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0)));
  }

  function renderPaises30Dias(items){
    const rows=(Array.isArray(items)?items:[]).filter(x=>x&&x.pais&&n(x.usuarios)>0);
    const usuarios=rows.reduce((s,x)=>s+n(x.usuarios),0);
    const interacciones=rows.reduce((s,x)=>s+n(x.interacciones),0);
    if(el.country30Countries)el.country30Countries.textContent=fmt(rows.length);
    if(el.country30Users)el.country30Users.textContent=fmt(usuarios);
    if(el.country30Interactions)el.country30Interactions.textContent=fmt(interacciones);
    if(!el.country30Body)return;
    if(!rows.length){
      el.country30Body.innerHTML='<tr><td colspan="3" class="muted">Aún no hay datos geográficos para los últimos 30 días.</td></tr>';
      return;
    }
    el.country30Body.innerHTML=rows.map(x=>'<tr><td><div class="country30-name"><span class="country30-flag" aria-hidden="true">'+banderaPais(x.codigo)+'</span><span>'+escapeHtml(x.pais)+'</span></div></td><td class="country30-value">'+fmt(x.usuarios)+'</td><td class="country30-value">'+fmt(x.interacciones)+'</td></tr>').join('');
  }

  function renderGeneral(data){
    renderRealtime(data.realtime||{});'''
          s = replace_once(s, render_anchor, render_new, 'frontend country renderer')

          s = replace_once(
              s,
              '    renderTrend(data.serie||[]);\n\n    renderMetricList(el.sourceList,data.fuentes,{',
              '    renderTrend(data.serie||[]);\n    renderPaises30Dias(data.paises30dias||[]);\n\n    renderMetricList(el.sourceList,data.fuentes,{',
              'frontend country render call'
          )

          s = replace_once(
              s,
              "      meta:x=>fmt(x.sesiones)+' sesiones'\n    });",
              "      meta:x=>fmt(x.sesiones)+' sesiones'+(x.interacciones!==undefined?' · '+fmt(x.interacciones)+' interacciones':'')\n    });",
              'frontend existing country meta'
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit finished change and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/oneoff-country-stats.yml
          git config user.name "LSPedia Automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin/busquedas.html apps-script/admin_busquedas_ga4.gs .github/workflows/oneoff-country-stats.yml
          git commit -m "Add 30-day country users and interactions card"
          git push origin develop
