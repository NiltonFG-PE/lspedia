name: Temporal controles video visual

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-controles-video-visual.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar rediseño visual
        run: python scripts/tmp_controles_video_visual.py

      - name: Validar cambio
        run: |
          grep -q "CONTROLES_VIDEO_VISUAL_V2_20260912" css/mejoras-producto.css
          grep -q 'const VERSION_APP = "v86";' sw.js

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mejoras-producto.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Mejorar visualmente los controles de video"
          git push origin develop
