name: Restaurar security conocido

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/restaurar-security.yml

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Restaurar archivo
        run: git checkout 611d3f0b004d62b82852ecace866e55bb01a9863 -- js/security.js

      - name: Validar sintaxis
        run: node --check js/security.js

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/security.js
          git commit -m "fix: restaurar security.js conocido"
          git push origin develop
