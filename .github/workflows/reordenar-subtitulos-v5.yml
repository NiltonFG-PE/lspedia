name: Reordenar Subtitulos V5

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/reordenar-subtitulos-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar rediseño
        run: python scripts/reordenar_subtitulos_v5.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          node --check js/subtitulos.js
          grep -q 'SUBTITULOS_V5_ORDEN_VISUAL_20260909' js/subtitulos.js
          grep -q 'SUBTITULOS_V5_ORDEN_VISUAL_20260909' css/subtitulos.css
          grep -q 'subtitulosAccionPrincipalV5' js/subtitulos.js
          grep -q 'subtitulosAvanzadasV5' js/subtitulos.js
          grep -q 'const VERSION_APP = "v45";' sw.js
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar cambios en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/subtitulos.js css/subtitulos.css sw.js
          git commit -m "Reordenar interfaz de Subtitulos y priorizar inicio"
          git push origin HEAD:develop
