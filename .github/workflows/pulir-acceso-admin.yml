name: Pulir acceso Admin

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/pulir_acceso_admin.py'
      - '.github/workflows/pulir-acceso-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar ajuste
        run: python scripts/pulir_acceso_admin.py
      - name: Validar JavaScript del Admin
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('admin/busquedas.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S)
          Path('/tmp/admin-inline.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/admin-inline.js
      - name: Validar formato
        run: git diff --check
      - name: Publicar y limpiar
        run: |
          rm -f scripts/pulir_acceso_admin.py .github/workflows/pulir-acceso-admin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/busquedas.html scripts/pulir_acceso_admin.py .github/workflows/pulir-acceso-admin.yml
          git commit -m 'Pulir acceso recordado del panel Admin'
          git push origin HEAD:develop
