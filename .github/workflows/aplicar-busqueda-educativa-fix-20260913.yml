name: Reejecutar diagnóstico educativo de búsquedas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/aplicar-busqueda-educativa-fix-20260913.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar mejora corregida
        run: python scripts/aplicar_busqueda_educativa_fix_20260913.py

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/palabras.json > /dev/null
          python -m json.tool data/busqueda-ayudas.json > /dev/null
          python scripts/validar_lspedia.py --fuente diccionario
          node --check js/buscador-visual.js
          node --check admin/busquedas-diagnostico.js
          grep -q 'Revisión automática' admin/busquedas.html
          grep -q 'busquedas-diagnostico.js' admin/busquedas.html
          grep -q 'busqueda-ayudas.json' admin/busquedas.html
          git diff --check

      - name: Guardar y limpiar temporales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aplicar-busqueda-educativa-20260913.yml
          git rm .github/workflows/aplicar-busqueda-educativa-fix-20260913.yml
          git rm scripts/aplicar_busqueda_educativa_20260913.py
          git rm scripts/aplicar_busqueda_educativa_fix_20260913.py
          git add data/palabras.json admin/busquedas.html sw.js
          git commit -m "Clasificar búsquedas y enseñar formas gramaticales"
          git push origin HEAD:develop
