name: Integrar Matemáticas V9

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/integrar-matematicas-v9.yml

permissions:
  contents: write

concurrency:
  group: integrar-matematicas-v9-develop
  cancel-in-progress: true

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Instalar Matemáticas V9
        run: |
          python - <<'PYCODE'
          import base64, gzip
          from pathlib import Path

          archivos = {
              'js/matematicas.js': Path('scripts/.matematicas-v9-js.b64'),
              'css/matematicas.css': Path('scripts/.matematicas-v9-css.b64'),
          }

          for ruta, fuente in archivos.items():
              contenido = gzip.decompress(base64.b64decode(fuente.read_text(encoding='utf-8').strip()))
              Path(ruta).write_bytes(contenido)
              print(f'Actualizado {ruta}: {len(contenido)} bytes')

          sw = Path('sw.js')
          texto = sw.read_text(encoding='utf-8')
          if 'const VERSION_APP = "v6";' in texto:
              texto = texto.replace('const VERSION_APP = "v6";', 'const VERSION_APP = "v7";', 1)
          elif 'const VERSION_APP = "v7";' not in texto:
              raise SystemExit('No se encontró VERSION_APP v6/v7 en sw.js')
          sw.write_text(texto, encoding='utf-8')
          print('Service Worker actualizado a v7')
          PYCODE

      - name: Validar JavaScript y archivos
        run: |
          node --check js/matematicas.js
          test -s css/matematicas.css
          grep -q 'window.MatematicasV2 = MatematicasV2' js/matematicas.js
          grep -q 'const VERSION_APP = "v7";' sw.js

      - name: Guardar en develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/matematicas.js css/matematicas.css sw.js
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "Integrar Matemáticas V9 interactivo"
          git push origin HEAD:develop
