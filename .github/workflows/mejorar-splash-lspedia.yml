name: Mejorar splash de LSPedia

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/mejorar-splash-lspedia.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mejorar-splash:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Aplicar diseño moderno del splash
        run: python scripts/aplicar_splash_moderno.py

      - name: Validar cambio
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Desarrollado con corazón' index.html
          grep -q 'id="splashLogo"' index.html
          grep -q 'class="splash-barra-brillo"' index.html
          grep -q 'MAXIMO_MS = 8000' index.html
          grep -q 'lspedia:datosListos' index.html
          grep -q 'const VERSION_APP = "v27";' sw.js
          git diff --check

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Modernizar pantalla de inicio de LSPedia"
          git push origin HEAD:develop
