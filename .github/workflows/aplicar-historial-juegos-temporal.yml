name: Aplicar historial interno de juegos

on:
  push:
    branches:
      - develop
    paths:
      - "scripts/aplicar_historial_juegos_temporal.py"
      - ".github/workflows/aplicar-historial-juegos-temporal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aplicar-historial-juegos-develop
  cancel-in-progress: true

jobs:
  aplicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Aplicar corrección de historial
        run: python scripts/aplicar_historial_juegos_temporal.py

      - name: Validar JavaScript
        run: node --check js/matematicas.js

      - name: Guardar corrección y retirar archivos temporales
        shell: bash
        run: |
          rm -f scripts/aplicar_historial_juegos_temporal.py
          rm -f .github/workflows/aplicar-historial-juegos-temporal.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/matematicas.js sw.js scripts/aplicar_historial_juegos_temporal.py .github/workflows/aplicar-historial-juegos-temporal.yml

          if git diff --cached --quiet; then
            echo "No había cambios pendientes."
            exit 0
          fi

          git commit -m "Corregir navegación Atrás dentro de juegos"
          git push origin HEAD:develop
