name: Restaurar M cursiva mayúscula

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/restaurar-m-cursiva.yml'

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reconstruir video original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m-video img/alfabetizacion/grafias
          for i in 00 01 02 03 04 05 06 07; do
            git show c83c4f4254c0249d583651e1adc182e30e4e65d7:scripts/.tmp_m_video/chunk${i}.b64 > /tmp/m-video/chunk${i}.b64
          done

          # El primer fragmento histórico tenía un único carácter alterado.
          # Corregimos exactamente ese fragmento antes de reconstruir el MP4.
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/m-video/chunk00.b64')
          s = p.read_text()
          viejo = 'PTEuMDA6MC4wMiBtaXhl'
          nuevo = 'PTEuMDA6MC4wMCBtaXhl'
          if s.count(viejo) != 1:
              raise SystemExit(f'Patrón esperado no encontrado exactamente una vez: {s.count(viejo)}')
          p.write_text(s.replace(viejo, nuevo, 1))
          PY

          cat /tmp/m-video/chunk*.b64 | base64 -d > img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4
          test "$(stat -c%s img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4)" = "65000"
          echo "778495f1899150f0c19cee81a9076171d06f372b7aadb6a5adfe777c214f9da5  img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4" | sha256sum -c -
          file img/alfabetizacion/grafias/M-cursiva-mayuscula.mp4

      - name: Validar Alfabetización
        run: python scripts/validar_alfabetizacion.py

      - name: Publicar y limpiar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restaurar-m-cursiva.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Agregar grafía M cursiva mayúscula"
          git push origin develop
