name: Corregir mensaje de Diccionario

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/corregir-mensaje-diccionario-20260909.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Corregir texto que reaparece al volver desde Juegos
        run: python scripts/corregir_mensaje_diccionario_20260909.py

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'No enseñamos lengua de señas, <strong>eso le pertenece a los sordos</strong>' js/script.js
          grep -q 'Diccionario visual de español' js/script.js
          grep -q 'No es un curso, ni enseñamos LSP.' js/script.js
          node --check js/script.js
          git diff --check
          test -f 'video/lspedia_transparente anterior.webm'

      - name: Guardar en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/script.js sw.js
          git commit -m "Corregir mensaje antiguo al volver al Diccionario"
          git push origin HEAD:develop
