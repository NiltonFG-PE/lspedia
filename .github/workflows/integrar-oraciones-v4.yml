name: Integrar juego Oraciones V4

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/integrar-oraciones-v4.yml

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Integrar Construye la oración
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, re, subprocess

          contenido = gzip.decompress(base64.b64decode("[... ELLIPSIZATION ...]"))
          Path("js/oraciones.js").write_bytes(contenido)

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          script_nuevo = '    <script src="js/oraciones.js?v=20260908"></script>'
          if script_nuevo not in html:
              needle = '    <script src="js/matematicas.js"></script>'
              if needle not in html:
                  raise SystemExit("No se encontró el punto de inserción después de matematicas.js")
              html = html.replace(needle, needle + "\n" + script_nuevo, 1)
              index.write_text(html, encoding="utf-8")

          sw = Path("sw.js")
          sw_text = sw.read_text(encoding="utf-8")
          sw_text = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v11";', sw_text, count=1)
          if '"js/oraciones.js"' not in sw_text:
              needle_sw = '    "js/matematicas.js",'
              if needle_sw not in sw_text:
                  raise SystemExit("No se encontró matematicas.js en ARCHIVOS_CASCARON")
              sw_text = sw_text.replace(needle_sw, needle_sw + '\n    "js/oraciones.js",', 1)
          sw.write_text(sw_text, encoding="utf-8")

          subprocess.run(["node", "--check", "js/oraciones.js"], check=True)
          assert 'js/oraciones.js?v=20260908' in index.read_text(encoding="utf-8")
          assert '"js/oraciones.js"' in sw.read_text(encoding="utf-8")
          assert 'const VERSION_APP = "v11";' in sw.read_text(encoding="utf-8")
          PYCODE

      - name: Guardar integración
        shell: bash
        run: |
          git config user.name "NiltonFG-PE"
          git config user.email "niltonfgn7@gmail.com"
          git add index.html sw.js js/oraciones.js
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git commit -m "Agregar juego Construye la oración"
          git push origin develop
