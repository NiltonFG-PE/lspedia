name: TMP Corregir recursos visuales

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-corregir-recursos-visuales.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar corrección
        run: python scripts/tmp_corregir_recursos_visuales.py

      - name: Validar recursos y sintaxis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validar_imagenes.py
          node --check js/script.js
          node --check sw.js
          git diff --check
          grep -q 'const VERSION_APP = "v62";' sw.js
          ! grep -q 'img/avatar_duda_sin_fondo.png' js/script.js
          ! grep -q 'img/avatar_duda.webm' js/script.js
          grep -q 'img/avatar_sin_fondo.png' js/script.js
          grep -q 'img/avatar_lupa.webm' js/script.js
          test -f 'img/avatar_sin_fondo.png'
          test -f 'img/avatar_lupa.webm'
          test -f 'video/lspedia_transparente anterior.webm'
          test "$(git hash-object 'video/lspedia_transparente anterior.webm')" = 'ca9a110b75384b534f8ebdcae45406fb178df083'

      - name: Guardar cambios de aplicación
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/script.js sw.js scripts/validar_imagenes.py
          if git diff --cached --quiet; then
            echo 'Sin cambios que guardar.'
            exit 0
          fi
          git commit -m 'Corregir recursos visuales faltantes y validarlos'
          git push origin HEAD:develop
