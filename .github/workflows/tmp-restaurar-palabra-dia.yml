name: Temporal restaurar Palabra del día

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/tmp-restaurar-palabra-dia.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Restaurar Palabra del día
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('css/mejoras-producto.css')
          css = css_path.read_text(encoding='utf-8')

          patron = re.compile(r'\n*/\* QUITAR_PALABRA_DIA_V1_20260912.*?\n\}\n\s*$', re.S)
          nuevo = patron.sub('\n', css)
          if nuevo == css:
              raise SystemExit('No se encontró el bloque QUITAR_PALABRA_DIA_V1_20260912')
          css_path.write_text(nuevo, encoding='utf-8', newline='\n')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v76";', sw, count=1)
          sw_path.write_text(sw, encoding='utf-8', newline='\n')
          PY

      - name: Validar cambios
        run: |
          ! grep -q "QUITAR_PALABRA_DIA_V1_20260912" css/mejoras-producto.css
          grep -q "LO_NUEVO_ENCIMA_APRENDIZAJE_V1_20260912" css/mejoras-producto.css
          grep -q 'VERSION_APP = "v76"' sw.js
          git diff --check

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mejoras-producto.css sw.js
          git commit -m "Restaurar Palabra del dia en portada"
          git push origin HEAD:develop
