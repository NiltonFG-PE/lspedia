name: Temporal zoom tactil imagenes

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-zoom-tactil-imagenes.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar parche
        run: python scripts/tmp_zoom_tactil_patch.py

      - name: Validar JavaScript
        run: node --check js/script.js

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/script.js css/estilos.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Agregar zoom tactil con pellizco a imagenes de ejemplo"
          git push origin develop
