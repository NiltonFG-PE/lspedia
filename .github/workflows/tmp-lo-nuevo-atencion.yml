name: Temporal animación Lo nuevo al entrar en pantalla

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/tmp-lo-nuevo-atencion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar ajuste
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('css/mejoras-producto.css')
          css = css_path.read_text(encoding='utf-8')
          marca_css = 'ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912'
          if marca_css not in css:
              css += r'''

/* ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912
   La animación ya no se consume apenas carga la página. Se activa cuando
   la tarjeta "Lo nuevo" entra realmente en la pantalla y dura ~6 s. */
#lspNuevasCard,
#lspNuevasCard::before,
#lspNuevasCard .lsp-mejora-icono {
    animation: none;
}

#lspNuevasCard.lsp-lo-nuevo-atencion {
    animation: lspLoNuevoPulso 1.45s cubic-bezier(.22, 1, .36, 1) 4;
}

#lspNuevasCard.lsp-lo-nuevo-atencion::before {
    animation: lspLoNuevoBrillo 1.45s ease-in-out 4;
}

#lspNuevasCard.lsp-lo-nuevo-atencion .lsp-mejora-icono {
    animation: lspLoNuevoIcono 1.05s cubic-bezier(.34, 1.56, .64, 1) 5;
}

@media (prefers-reduced-motion: reduce) {
    #lspNuevasCard.lsp-lo-nuevo-atencion,
    #lspNuevasCard.lsp-lo-nuevo-atencion::before,
    #lspNuevasCard.lsp-lo-nuevo-atencion .lsp-mejora-icono {
        animation: none !important;
    }
}
'''
              css_path.write_text(css, encoding='utf-8', newline='\n')

          js_path = Path('js/lo-nuevo.js')
          js = js_path.read_text(encoding='utf-8')
          marca_js = 'ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912'
          if marca_js not in js:
              bloque = r'''

    // ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912
    // Espera a que la tarjeta sea visible antes de llamar la atención.
    // Así la animación no termina mientras el usuario todavía está arriba,
    // mirando el buscador. Se ejecuta una sola vez por carga de página.
    function prepararAnimacionAtencion(intentos){
        intentos = Number(intentos) || 0;
        const card = $('lspNuevasCard');
        if(!card){
            if(intentos < 12){
                setTimeout(() => prepararAnimacionAtencion(intentos + 1), 300);
            }
            return;
        }

        if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
            return;
        }

        let activada = false;
        function activar(){
            if(activada) return;
            activada = true;
            card.classList.add('lsp-lo-nuevo-atencion');
            setTimeout(() => card.classList.remove('lsp-lo-nuevo-atencion'), 6500);
        }

        if('IntersectionObserver' in window){
            const observer = new IntersectionObserver((entradas) => {
                const visible = entradas.some(entrada =>
                    entrada.isIntersecting && entrada.intersectionRatio >= 0.22
                );
                if(visible){
                    activar();
                    observer.disconnect();
                }
            }, {
                threshold: [0.22, 0.45],
                rootMargin: '0px 0px -6% 0px'
            });
            observer.observe(card);
        }else{
            setTimeout(activar, 1800);
        }
    }
'''
              objetivo = '    function iniciar(){\n'
              if objetivo not in js:
                  raise SystemExit('No se encontró function iniciar() en js/lo-nuevo.js')
              js = js.replace(objetivo, bloque + '\n' + objetivo, 1)

              llamada = "        actualizarEncabezado();\n        cargar();"
              if llamada not in js:
                  raise SystemExit('No se encontró el inicio esperado de iniciar()')
              js = js.replace(
                  llamada,
                  "        actualizarEncabezado();\n        prepararAnimacionAtencion();\n        cargar();",
                  1
              )
              js_path.write_text(js, encoding='utf-8', newline='\n')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw, cantidad = re.subn(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v78";', sw, count=1)
          if cantidad != 1:
              raise SystemExit('No se pudo actualizar VERSION_APP en sw.js')
          sw_path.write_text(sw, encoding='utf-8', newline='\n')
          PY

      - name: Validar cambios
        run: |
          grep -q 'ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912' css/mejoras-producto.css
          grep -q 'ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912' js/lo-nuevo.js
          grep -q "prepararAnimacionAtencion();" js/lo-nuevo.js
          grep -q 'VERSION_APP = "v78"' sw.js
          node --check js/lo-nuevo.js
          git diff --check

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mejoras-producto.css js/lo-nuevo.js sw.js
          git commit -m "Animar Lo nuevo al entrar en pantalla"
          git push origin HEAD:develop
