name: Temporal animacion Lo nuevo al entrar en pantalla

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/tmp-lo-nuevo-atencion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar ajuste
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          css_b64 = ''
          js_b64 = ''

          css_path = Path('css/mejoras-producto.css')
          css = css_path.read_text(encoding='utf-8')
          marca = 'ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912'
          if marca not in css:
              css += base64.b64decode(css_b64).decode('utf-8')
              css_path.write_text(css, encoding='utf-8', newline='\n')

          js_path = Path('js/lo-nuevo.js')
          js = js_path.read_text(encoding='utf-8')
          if marca not in js:
              bloque = base64.b64decode(js_b64).decode('utf-8')
              objetivo = '    function iniciar(){\n'
              if objetivo not in js:
                  raise SystemExit('No se encontro function iniciar()')
              js = js.replace(objetivo, bloque + '\n' + objetivo, 1)
              llamada = "        actualizarEncabezado();\n        cargar();"
              if llamada not in js:
                  raise SystemExit('No se encontro inicio esperado')
              js = js.replace(llamada, "        actualizarEncabezado();\n        prepararAnimacionAtencion();\n        cargar();", 1)
              js_path.write_text(js, encoding='utf-8', newline='\n')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw, cantidad = re.subn(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v78";', sw, count=1)
          if cantidad != 1:
              raise SystemExit('No se pudo actualizar VERSION_APP')
          sw_path.write_text(sw, encoding='utf-8', newline='\n')
          PY

      - name: Validar cambios
        run: |
          grep -q 'ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912' css/mejoras-producto.css
          grep -q 'ANIMACION_LO_NUEVO_VIEWPORT_V2_20260912' js/lo-nuevo.js
          grep -q 'prepararAnimacionAtencion();' js/lo-nuevo.js
          grep -q 'VERSION_APP = "v78"' sw.js
          node --check js/lo-nuevo.js
          git diff --check

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mejoras-producto.css js/lo-nuevo.js sw.js
          git commit -m "Animar Lo nuevo al entrar en pantalla"
          git push origin HEAD:develop
