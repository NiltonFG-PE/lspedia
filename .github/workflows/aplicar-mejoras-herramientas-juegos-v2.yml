name: Mejorar Herramientas y Jugar V3

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/aplicar-mejoras-herramientas-juegos-v2.yml

permissions:
  contents: write

jobs:
  mejorar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar mejoras V3
        run: python .tmp/aplicar_mejoras_herramientas_juegos_v3.py

      - name: Validar integración
        run: |
          node --check js/script.js
          node --check js/alfabetizacion.js
          node --check js/quiz.js
          node --check js/matematicas.js
          node --check js/oraciones.js
          grep -q 'btnQuizJugarRapido' index.html
          grep -q 'preview-oraciones' index.html
          grep -q 'FeedbackJuegosLSPedia' js/script.js
          grep -q 'activarArrastreVisualUnir' js/alfabetizacion.js
          grep -q 'programarGuiaVisualCompletar' js/alfabetizacion.js
          grep -q 'volverAlMenuJuegosDesdeBoton' js/matematicas.js
          grep -q 'VERSION_APP = "v14"' sw.js

      - name: Guardar mejoras en develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .tmp/aplicar_mejoras_herramientas_juegos_v2.py
          rm -f .tmp/ajustar_mejoras_herramientas_v2.py
          rm -f .tmp/aplicar_mejoras_herramientas_juegos_v3.py
          rm -f .github/workflows/aplicar-mejoras-herramientas-juegos-v2.yml
          git add -A
          git commit -m "Mejorar navegación visual y juegos de Herramientas"
          git push origin develop
