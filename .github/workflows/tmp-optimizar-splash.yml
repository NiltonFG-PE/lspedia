name: Temporal optimizar splash

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-optimizar-splash.yml"

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Optimizar splash para conexiones lentas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          viejo_logo = '<img src="img/lspedia.png" alt="LSPedia" id="splashLogo">'
          nuevo_logo = '''<div id="splashLogo" class="splash-marca-ligera" aria-label="LSPedia">
                <img src="img/favicon.png" alt="" width="82" height="82" fetchpriority="high" decoding="async">
                <span class="splash-marca-texto"><strong>LSP</strong><em>edia</em></span>
            </div>'''
          if viejo_logo not in s:
              raise SystemExit('No se encontró el logo actual del splash')
          s = s.replace(viejo_logo, nuevo_logo, 1)

          marcador_css = '    .splash-estela {'
          css_extra = '''    .splash-marca-ligera {
        display: flex !important;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: auto !important;
        max-width: min(86vw, 430px);
    }
    .splash-marca-ligera img {
        width: 82px;
        height: 82px;
        object-fit: contain;
        flex: 0 0 auto;
    }
    .splash-marca-texto {
        display: inline-flex;
        align-items: baseline;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: clamp(2.05rem, 6vw, 3.35rem);
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
        color: #163b73;
        text-shadow: 0 3px 10px rgba(15, 58, 112, 0.08);
    }
    .splash-marca-texto strong { font-style: normal; font-weight: 800; }
    .splash-marca-texto em { font-style: normal; font-weight: 800; color: #e2b117; }
    @media (max-width: 480px) {
        .splash-marca-ligera { gap: 9px; }
        .splash-marca-ligera img { width: 66px; height: 66px; }
    }

'''
          if marcador_css not in s:
              raise SystemExit('No se encontró el punto de inserción CSS del splash')
          s = s.replace(marcador_css, css_extra + marcador_css, 1)

          s = s.replace(
              '// Se oculta cuando se cumplen DOS condiciones: (1) la página terminó de\n    // cargar sus recursos (window.load) y (2) script.js ya sabe si hay',
              '// Se oculta cuando se cumplen DOS condiciones: (1) el HTML ya está listo\n    // (DOMContentLoaded, sin esperar imágenes/videos pesados) y (2) script.js ya sabe si hay',
              1
          )
          s = s.replace('let paginaCargada = false;', 'let domListo = document.readyState !== "loading";', 1)
          s = s.replace('if (!paginaCargada || !datosListos) return;', 'if (!domListo || !datosListos) return;', 1)
          viejo_evento = 'window.addEventListener("load", () => { paginaCargada = true; intentarOcultar(); });'
          nuevo_evento = '''if (!domListo) {
            document.addEventListener("DOMContentLoaded", () => {
                domListo = true;
                intentarOcultar();
            }, { once: true });
        }'''
          if viejo_evento not in s:
              raise SystemExit('No se encontró el listener window.load del splash')
          s = s.replace(viejo_evento, nuevo_evento, 1)

          viejo_footer = '<img src="img/lspedia.png" alt="Logo LSPedia" class="footer-logo">'
          nuevo_footer = '<img src="img/lspedia.png" alt="Logo LSPedia" class="footer-logo" loading="lazy" decoding="async">'
          if viejo_footer in s:
              s = s.replace(viejo_footer, nuevo_footer, 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          if 'const VERSION_APP = "v133";' in t:
              t = t.replace('const VERSION_APP = "v133";', 'const VERSION_APP = "v134";', 1)
          elif 'const VERSION_APP = "v134";' not in t:
              raise SystemExit('Versión inesperada del Service Worker')
          sw.write_text(t, encoding='utf-8')
          PY

          git diff --check

      - name: Guardar optimización
        shell: bash
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "El splash ya estaba optimizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "perf: aligerar splash para conexiones lentas"
          git push origin HEAD:develop
