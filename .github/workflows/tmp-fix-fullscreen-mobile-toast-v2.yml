name: Temporal corregir fullscreen movil v2

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-fix-fullscreen-mobile-toast-v2.yml"

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Aplicar parche
        run: python scripts/tmp_fix_fullscreen_mobile_toast_v2.py

      - name: Validar correccion
        run: |
          node --check js/script.js
          if grep -q 'const esPantallaTactil' js/script.js; then
            echo 'Todavia existe el fallback tactil defectuoso'
            exit 1
          fi
          grep -q 'await wrap.requestFullscreen' js/script.js
          grep -q 'FULLSCREEN_VIDEO_MOVIL_NATIVE_TOAST_FIX_V2_20260912' css/mejoras-producto.css
          grep -q 'lspControlesFullscreenEvitarAvisoChrome' css/mejoras-producto.css
          grep -q 'const VERSION_APP = "v89";' sw.js

      - name: Guardar y retirar temporales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-fullscreen-mobile-toast-v2.yml
          git rm scripts/tmp_fix_fullscreen_mobile_toast_v2.py
          git add js/script.js css/mejoras-producto.css sw.js
          git commit -m "Corregir fullscreen movil y evitar aviso sobre controles"
          git push origin develop
