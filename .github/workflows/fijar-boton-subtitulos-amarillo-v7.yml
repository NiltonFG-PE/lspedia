name: Fijar boton amarillo Subtitulos V7

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fijar-boton-subtitulos-amarillo-v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Aplicar corrección
        run: python scripts/fijar_boton_subtitulos_amarillo_v7.py

      - name: Validar cambios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SUBTITULOS_V7_BOTON_AMARILLO_20260909' css/subtitulos.css
          grep -q 'background: linear-gradient(135deg, #ffd54a 0%, #fbbc04 100%) !important;' css/subtitulos.css
          ! grep -q 'background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%) !important;' css/subtitulos.css
          grep -q 'const VERSION_APP = "v47";' sw.js
          test -f 'img/categorias/Subtítulos.webp'
          test -f 'video/lspedia_transparente anterior.webm'
          git diff --check

      - name: Guardar cambios en develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/subtitulos.css sw.js
          git commit -m "Corregir boton principal amarillo en Subtitulos"
          git push origin HEAD:develop
