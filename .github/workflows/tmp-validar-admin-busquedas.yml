name: TMP Validar admin busquedas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-validar-admin-busquedas.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 8

      - name: Validar archivos del panel
        shell: bash
        run: |
          set -euo pipefail
          test -f admin/busquedas.html
          test -f admin/CONFIGURAR_BUSQUEDAS.md
          test -f apps-script/admin_busquedas_ga4.gs
          test -f apps-script/appsscript-admin-busquedas.json
          grep -q 'noindex,nofollow' admin/busquedas.html
          grep -q 'search_no_results' apps-script/admin_busquedas_ga4.gs
          grep -q 'searchTerm' apps-script/admin_busquedas_ga4.gs
          grep -q 'ADMIN_KEY' apps-script/admin_busquedas_ga4.gs

      - name: Validar JavaScript del panel y Apps Script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          html = Path('admin/busquedas.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          assert scripts, 'No se encontró JavaScript inline en admin/busquedas.html'
          Path('/tmp/admin-busquedas.js').write_text('\n'.join(scripts), encoding='utf-8')
          Path('/tmp/admin-busquedas-gas.js').write_text(Path('apps-script/admin_busquedas_ga4.gs').read_text(encoding='utf-8'), encoding='utf-8')
          json.loads(Path('apps-script/appsscript-admin-busquedas.json').read_text(encoding='utf-8'))
          PY
          node --check /tmp/admin-busquedas.js
          node --check /tmp/admin-busquedas-gas.js

      - name: Verificar video histórico protegido
        shell: bash
        run: |
          test -f 'video/lspedia_transparente anterior.webm'
          test "$(git hash-object 'video/lspedia_transparente anterior.webm')" = 'ca9a110b75384b534f8ebdcae45406fb178df083'

      - name: Verificar diff limpio de whitespace
        shell: bash
        run: git diff --check HEAD~5..HEAD
