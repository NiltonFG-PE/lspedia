name: Temporal corregir fullscreen visual móvil v2

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-mobile-fullscreen-reparent.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Corregir fullscreen visual móvil
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('js/script.js')
          sw_path = Path('sw.js')

          js = js_path.read_text(encoding='utf-8')

          old = '    const { wrap, controles, marcadorControles, btn } = estado;\n'
          new = '    const { wrap, controles, marcadorControles, marcadorWrap, btn } = estado;\n'
          if old not in js:
              raise SystemExit('No se encontró destructuración de estado fullscreen')
          js = js.replace(old, new, 1)

          old = '''    if(wrap){
        wrap.classList.remove("video-palabra-pantalla-completa");
        wrap.classList.remove("video-palabra-pantalla-completa-fallback");
    }
'''
          new = '''    if(wrap){
        wrap.classList.remove("video-palabra-pantalla-completa");
        wrap.classList.remove("video-palabra-pantalla-completa-fallback");
        if(marcadorWrap && marcadorWrap.parentNode){
            marcadorWrap.parentNode.insertBefore(wrap, marcadorWrap);
            marcadorWrap.remove();
        }
    }
'''
          if old not in js:
              raise SystemExit('No se encontró bloque de restauración del wrapper')
          js = js.replace(old, new, 1)

          anchor = '''    const hermano = wrap.nextElementSibling;
'''
          inject = '''    const esPantallaTactil = (
        window.matchMedia("(pointer: coarse)").matches ||
        Number(navigator.maxTouchPoints || 0) > 0 ||
        "ontouchstart" in window
    );

    const hermano = wrap.nextElementSibling;
'''
          if anchor not in js:
              raise SystemExit('No se encontró ancla antes de controles fullscreen')
          js = js.replace(anchor, inject, 1)

          old = '    let marcadorControles = null;\n'
          new = '    let marcadorControles = null;\n    let marcadorWrap = null;\n'
          if old not in js:
              raise SystemExit('No se encontró marcadorControles')
          js = js.replace(old, new, 1)

          anchor = '''    wrap.classList.add("video-palabra-pantalla-completa");
'''
          inject = '''    // En móvil/tablet el wrapper debe salir físicamente de la ficha.
    // Algunos contenedores usan transform/overflow y pueden recortar un
    // position:fixed. Al moverlo a <body>, el overlay sí ocupa la ventana.
    if(esPantallaTactil && wrap.parentNode && wrap.parentNode !== document.body){
        marcadorWrap = document.createComment("lspedia-video-wrap-origen");
        wrap.parentNode.insertBefore(marcadorWrap, wrap);
        document.body.appendChild(wrap);
    }

    wrap.classList.add("video-palabra-pantalla-completa");
'''
          if anchor not in js:
              raise SystemExit('No se encontró alta de clase fullscreen')
          js = js.replace(anchor, inject, 1)

          old = '    estadoPantallaCompletaVideoPalabra = { wrap, controles, marcadorControles, btn };\n'
          new = '    estadoPantallaCompletaVideoPalabra = { wrap, controles, marcadorControles, marcadorWrap, btn };\n'
          if old not in js:
              raise SystemExit('No se encontró asignación de estado fullscreen')
          js = js.replace(old, new, 1)

          duplicate = '''        const esPantallaTactil = (
            window.matchMedia("(pointer: coarse)").matches ||
            Number(navigator.maxTouchPoints || 0) > 0 ||
            "ontouchstart" in window
        );

'''
          if duplicate not in js:
              raise SystemExit('No se encontró declaración táctil duplicada')
          js = js.replace(duplicate, '', 1)

          js_path.write_text(js, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          sw2, n = re.subn(r'const VERSION_APP = "v\d+";', 'const VERSION_APP = "v89";', sw, count=1)
          if n != 1:
              raise SystemExit('No se pudo actualizar VERSION_APP')
          sw_path.write_text(sw2, encoding='utf-8')
          PY

      - name: Validar cambio
        run: |
          node --check js/script.js
          grep -q 'lspedia-video-wrap-origen' js/script.js
          grep -q 'marcadorWrap' js/script.js
          grep -q 'document.body.appendChild(wrap)' js/script.js
          grep -q 'const VERSION_APP = "v89";' sw.js

      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/script.js sw.js
          git commit -m "Corregir fullscreen visual de videos en móvil"
          git push origin develop
