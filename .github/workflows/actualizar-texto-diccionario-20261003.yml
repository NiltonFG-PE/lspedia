name: Actualizar texto informativo Diccionario

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/actualizar-texto-diccionario-20261003.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Reemplazar texto informativo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patron = r'(?s)(\s*)<div class="aviso-mision" id="subtituloPrincipal">.*?</div>\s*</div>'
          m = re.search(patron, s)
          if not m:
              raise SystemExit('No se encontró subtituloPrincipal; no se modificó nada.')
          indent = m.group(1)
          new = '''
                    <div class="aviso-mision" id="subtituloPrincipal">
                        <span class="aviso-mision-icono" aria-hidden="true">🤟</span>
                        <div class="aviso-mision-texto">
                            <p class="aviso-mision-linea1">
                                <strong>Entiende el significado de las palabras en español</strong> con videos en Lengua de Señas. Pensado para personas sordas y para quienes quieren comunicarse mejor con ellas.
                            </p>
                            <p class="aviso-mision-linea2">
                                ℹ️ Es un diccionario de apoyo, no un curso de LSP.
                            </p>
                        </div>
                    </div>'''
          s = s[:m.start()] + indent + new.lstrip('\n') + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar cambio
        run: |
          grep -Fq 'Entiende el significado de las palabras en español' index.html
          grep -Fq 'Pensado para personas sordas y para quienes quieren comunicarse mejor con ellas.' index.html
          grep -Fq 'ℹ️ Es un diccionario de apoyo, no un curso de LSP.' index.html
      - name: Commit del cambio y retirar workflow temporal
        run: |
          rm .github/workflows/actualizar-texto-diccionario-20261003.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/actualizar-texto-diccionario-20261003.yml
          git commit -m 'Actualizar texto informativo del Diccionario'
          git push origin develop
