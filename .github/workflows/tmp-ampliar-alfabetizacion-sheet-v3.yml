name: Temporal ampliar Alfabetizacion editable v3

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/tmp-ampliar-alfabetizacion-sheet-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ampliar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Corregir migración temporal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp_ampliar_alfabetizacion_sheet.py')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          salida = []
          corregida = False
          for line in lines:
              if line.strip().startswith("m = re.search("):
                  salida.append("m = re.search(r'const VERSION_APP = \\\"v([0-9]+)\\\";', s)\n")
                  corregida = True
              else:
                  salida.append(line)
          if not corregida:
              raise SystemExit('No se encontró línea VERSION_APP en migración')
          p.write_text(''.join(salida), encoding='utf-8')
          PY
      - name: Aplicar cambios
        run: python scripts/tmp_ampliar_alfabetizacion_sheet.py
      - name: Generar JSON desde Sheet real
        run: python scripts/generar_alfabetizacion.py
      - name: Validar Alfabetizacion
        shell: bash
        run: |
          python -m json.tool data/alfabetizacion.json > /dev/null
          python scripts/validar_alfabetizacion.py
          python scripts/auditar_alfabetizacion.py
          node --check js/alfabetizacion.js
          node --check sw.js
          git diff --check
      - name: Commit y push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generar_alfabetizacion.py scripts/validar_alfabetizacion.py js/alfabetizacion.js data/alfabetizacion.json sw.js
          git commit -m "feat: editar Alfabetizacion desde Google Sheets"
          git push origin develop
