<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>LSPedia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/favicon.png">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                🤟 LSPedia
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" id="btnCategorias">
                            Categorías
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Favoritos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Historial
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <div class="container py-5">

        <div class="text-center mb-5">

            <h1 class="display-4 fw-bold">
                Diccionario de Lengua de Señas Peruana
            </h1>

            <p class="text-secondary">
                Aprende una palabra mediante video.
            </p>

        </div>

        <div class="row justify-content-center">

            <div class="col-lg-8 position-relative">

                <input
                    id="buscar"
                    class="form-control form-control-lg"
                    placeholder="🔎 Buscar palabra...">

                <div id="sugerencias" class="list-group mt-2"></div>

            </div>

        </div>

        <div class="row mt-5 g-4">

            <div class="col-md-4">

                <div class="card estadistica">

                    <div class="card-body text-center">

                        <h1>📚</h1>

                        <h5>Palabras</h5>

                        <p id="totalPalabras">0</p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card estadistica">

                    <div class="card-body text-center">

                        <h1>📂</h1>

                        <h5>Categorías</h5>

                        <p id="totalCategorias">0</p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card estadistica">

                    <div class="card-body text-center">

                        <h1>🎥</h1>

                        <h5>Videos</h5>

                        <p id="totalVideos">0</p>

                    </div>

                </div>

            </div>

        </div>

        <div id="ultimasPalabras" class="row mt-5 g-4"></div>

        <div id="panelCategorias" class="row mt-5 g-4"></div>

        <div id="resultado" class="mt-5"></div>

        <section id="seccionFavoritos" class="mt-5">

            <h3 class="mb-4">
                ⭐ Mis Favoritos
            </h3>

            <div id="listaFavoritos" class="row g-4"></div>

        </section>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- LSPedia -->
    <script src="js/script.js"></script>

</body>

</html>
