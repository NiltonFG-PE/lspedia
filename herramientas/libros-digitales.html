<!doctype html>
<html lang="es-PE">
<head>

  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <meta name="description" content="Biblioteca de libros digitales de LSPedia: elige un libro y léelo en pantalla, gratis y sin descargar.">
  <title>Libros digitales | LSPedia</title>
  <link rel="icon" href="../img/favicon.png">
  <link rel="stylesheet" href="../css/fonts-poppins.css?v=20261113-1">

<body class="biblioteca">

  <header class="bib-barra">
    <a class="bib-volver" id="btnVolver" href="../?vista=herramientas" data-volver><span aria-hidden="true">←</span> Recursos</a>

  <main class="bib-cuerpo">
    <h1 class="bib-titulo" id="bibTitulo">Libros digitales</h1>

    <ul class="bib-estante" id="estante" aria-labelledby="bibTitulo" aria-busy="true"></ul>
