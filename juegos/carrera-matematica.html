<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1b2230">
  <title>Carrera Matemática | LSPedia</title>
  <meta name="description" content="Carrera Matemática de LSPedia: conduce, esquiva obstáculos y resuelve operaciones para avanzar por los niveles.">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b2230; --panel: #232b3a; --panel-2: #2d3749;
      --sign: #ffc93c; --ok: #2ecc71; --bad: #e74c3c;
      --ball-a: #ff8c42; --ball-b: #3fa9f5; --white: #f7f9fc;
      --font: 'Fredoka', 'Nunito', 'Segoe UI Rounded', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--ink); color: var(--white); font-family: var(--font); user-select: none; touch-action: none; }
    #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; background: #6fb7e8; }
    canvas#gameCanvas { display: block; width: 100%; height: 100%; }
    button { font-family: var(--font); }
    .lspedia-back { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; z-index: 45; min-height: 44px; padding: 0 14px; border: 1px solid rgba(255,255,255,.3); border-radius: 14px; background: rgba(27,34,48,.82); color: #fff; font-weight: 700; cursor: pointer; backdrop-filter: blur(6px); box-shadow: 0 6px 18px rgba(0,0,0,.25); }
    .lspedia-back:active { transform: scale(.96); }
    .lspedia-back:focus-visible { outline: 3px solid #ffc93c; outline-offset: 3px; }

    .display-mode-wrap { width:min(100%,520px); display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 12px; border-radius:18px; background:rgba(35,43,58,.9); border:1px solid rgba(255,255,255,.12); box-shadow:0 8px 24px rgba(0,0,0,.24); }
    .display-mode-label { font-size:.85rem; font-weight:700; color:#dbe7f7; text-align:center; }
    .display-mode-actions { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .display-mode-btn { min-height:46px; border:2px solid #53627a; border-radius:14px; background:#2d3749; color:#fff; font:700 .92rem var(--font); cursor:pointer; }
    .display-mode-btn.active { border-color:var(--sign); background:#3b4658; box-shadow:0 0 0 3px rgba(255,201,60,.15); color:var(--sign); }
    .display-mode-btn:active { transform:scale(.98); }
    .display-mode-help { min-height:1.25em; font-size:.72rem; line-height:1.25; color:#aebdd2; text-align:center; }
    #tiltCenterBtn { cursor:pointer; pointer-events:auto; min-width:42px; justify-content:center; color:var(--sign); }
    #tiltCenterBtn:active { transform:scale(.95); }
    #orientation-toast { position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 102px); transform:translateX(-50%) translateY(10px); z-index:50; width:min(92%,480px); padding:10px 14px; border-radius:14px; background:rgba(17,24,39,.93); color:#fff; font-size:.82rem; font-weight:700; text-align:center; opacity:0; pointer-events:none; transition:opacity .2s ease,transform .2s ease; box-shadow:0 10px 30px rgba(0,0,0,.3); }
    #orientation-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    #pauseBtn { cursor:pointer; pointer-events:auto; min-width:42px; justify-content:center; }
    #pauseBtn svg { width:1.2em; height:1.2em; }
    #pauseBtn:active { transform:scale(.95); }
    #pause-overlay { position:absolute; inset:0; z-index:46; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(10,14,22,.72); backdrop-filter:blur(5px); }
    #pause-overlay.active { display:flex; }
    .pause-card { width:min(90%,340px); padding:24px 20px; border-radius:26px; background:rgba(35,43,58,.97); border:1px solid rgba(255,255,255,.12); box-shadow:0 22px 70px rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; gap:16px; }
    .pause-icon { width:78px; height:78px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#ffd95e,#f2aa22); box-shadow:0 8px 0 #a76b0d; }
    .pause-icon svg { width:38px; height:38px; }
    .pause-title { font-size:clamp(1.6rem,7vw,2.25rem); font-weight:700; }
    .pause-resume { border:none; min-width:180px; min-height:54px; padding:10px 22px; border-radius:18px; background:linear-gradient(180deg,#4ade80,#16a34a); color:#fff; font:700 1.05rem var(--font); box-shadow:0 6px 0 #14532d; cursor:pointer; }
    .pause-resume:active { transform:translateY(3px); box-shadow:0 3px 0 #14532d; }

    @media (orientation: landscape) and (max-height: 520px) {
      #hud { top:calc(env(safe-area-inset-top,0px) + 6px); left:8px; right:8px; gap:5px; }
      .hud-row { gap:4px; }
      .hud-box { padding:4px 7px; border-radius:10px; font-size:clamp(.78rem,2.4vw,1rem); gap:4px; }
      #hearts svg { width:1.15em; height:1.15em; }
      #turbo-meter { width:40px; height:8px; }
      #gauge { width:2.1em; height:1.15em; }
      #progress { height:12px; }
      #progress-car { width:24px; height:24px; top:-6px; }
      #progress-flag { width:27px; height:27px; top:-8px; }
      #mobile-controls { bottom:calc(env(safe-area-inset-bottom,0px) + 7px); padding:0 10px; }
      .mobile-btn { width:60px; height:60px; border-width:2px; }
      .mobile-btn svg { width:32px; height:32px; }
      #lights { padding-top:calc(env(safe-area-inset-top,0px) + 55px); }
      .light-bar { padding:8px 12px; gap:9px; border-width:3px; }
      .lamp { width:34px; }
      .screen { gap:8px; padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 8px); }
      .tutorial { flex-wrap:nowrap; gap:8px; max-width:620px; }
      .tut-card { width:min(112px,20vw); padding:8px; border-radius:16px; }
      .display-mode-wrap { max-width:460px; padding:7px 9px; gap:5px; }
      .display-mode-btn { min-height:38px; font-size:.78rem; }
      .display-mode-label { font-size:.74rem; }
      .display-mode-help { font-size:.64rem; }
      .icon-btn { width:64px; height:64px; }
      .q-card { width:min(680px,96%); padding:9px 11px; gap:7px; border-radius:18px; }
      .q-scene { min-height:56px; padding:7px; }
      .q-eq { font-size:clamp(1.5rem,5vw,2.2rem); }
      .q-options { gap:7px; }
      .opt { min-height:54px; padding:6px; }
      .opt b { font-size:clamp(1.45rem,5vw,2rem); }
    }

    /* ---------- HUD ---------- */
    #hud { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; right: 10px; display: none; flex-direction: column; gap: 8px; pointer-events: none; z-index: 5; }
    #hud.on { display: flex; }
    .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .hud-box { display: flex; align-items: center; gap: 6px; background: rgba(27,34,48,0.78); border-radius: 14px; padding: 6px 10px; backdrop-filter: blur(6px); font-size: clamp(1rem, 4vw, 1.3rem); font-weight: 700; line-height: 1; }
    .hud-box svg { width: 1.35em; height: 1.35em; flex: none; }
    #hearts svg { width: 1.45em; height: 1.45em; margin: 0 -1px; }
    #hearts svg.off { opacity: 0.25; filter: grayscale(1); }
    #score-box { color: var(--sign); }
    #gauge { width: 2.4em; height: 1.35em; }
    #needle { transform-origin: 30px 28px; transition: transform 0.25s; }
    #muteBtn { pointer-events: auto; cursor: pointer; }
    #pos-box { color: var(--sign); }
    #turbo-meter { width: 52px; height: 10px; background: #3b4658; border-radius: 6px; overflow: hidden; }
    #turbo-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd23f, #ff7a1a); transition: width 0.2s; }
    #turbo-box.ready { animation: pulse 0.5s ease-in-out infinite; box-shadow: 0 0 16px #ffd23f; }
    #progress { flex: 1; height: 16px; background: rgba(27,34,48,0.78); border-radius: 10px; position: relative; overflow: visible; }
    #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3fa9f5, #2ecc71); border-radius: 10px; transition: width 0.3s; }
    #progress-car { position: absolute; top: -8px; left: 0; width: 30px; height: 30px; transform: translateX(-50%); transition: left 0.3s; }
    #progress { margin-right: 10px; }
    #progress-flag { position: absolute; right: -6px; top: -10px; width: 34px; height: 34px; }

    /* ---------- Pantallas ---------- */
    .screen { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px calc(env(safe-area-inset-bottom, 0px) + 18px); overflow: auto; background: radial-gradient(ellipse at 50% 30%, rgba(63,143,214,0.35), rgba(27,34,48,0.92) 70%), rgba(27,34,48,0.94); }
    .screen[hidden] { display: none; }
    .screen > * { flex: none; }
    .tutorial { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; max-width: 520px; }
    .tut-card { background: var(--panel); border-radius: 22px; padding: 12px; display: flex; align-items: center; justify-content: center; width: min(140px, 40vw); aspect-ratio: 1; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    .tut-card svg { width: 100%; height: 100%; overflow: visible; }

    .icon-btn { border: none; cursor: pointer; border-radius: 50%; width: clamp(80px, 22vw, 116px); height: clamp(80px, 22vw, 116px); background: radial-gradient(circle at 35% 30%, #ffe28a, var(--sign) 55%, #e0a800); box-shadow: 0 9px 0 #a67c00, 0 16px 36px rgba(255,201,60,0.35); display: flex; align-items: center; justify-content: center; transition: transform 0.1s, box-shadow 0.1s; flex: none; }
    .icon-btn:active { transform: translateY(6px); box-shadow: 0 3px 0 #a67c00; }
    .icon-btn:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
    .icon-btn svg { width: 55%; height: 55%; }
    .icon-btn.small { width: clamp(58px, 15vw, 72px); height: clamp(58px, 15vw, 72px); background: radial-gradient(circle at 35% 30%, #58657d, #3a475d 60%, #2b3547); box-shadow: 0 7px 0 #161c27; }
    .icon-btn.small:active { box-shadow: 0 2px 0 #161c27; }
    .icon-btn.green { background: radial-gradient(circle at 35% 30%, #8ff0b4, #2ecc71 55%, #1f9d55); box-shadow: 0 9px 0 #166b3a, 0 16px 36px rgba(46,204,113,0.35); }
    .icon-btn.green:active { box-shadow: 0 3px 0 #166b3a; }
    .btn-row { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }

    @keyframes tilt { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
    @keyframes slideCar { 0%,100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes blink { 0%, 45% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-8px);} 75% { transform: translateX(8px);} }
    .anim-tilt { animation: tilt 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
    .anim-car { animation: slideCar 2.4s ease-in-out infinite; }
    .anim-pulse { animation: pulse 1.4s ease-in-out infinite; transform-origin: center; }
    .anim-blink { animation: blink 2s ease-in-out infinite; }

    /* ---------- Garaje ---------- */
    .section-icon { width: clamp(34px, 9vw, 44px); height: clamp(34px, 9vw, 44px); }
    .grid { display: grid; gap: 10px; justify-content: center; width: min(460px, 100%); }
    .grid.vehicles { grid-template-columns: repeat(auto-fit, 104px); }
        .pick { border: 4px solid transparent; border-radius: 18px; background: var(--panel); padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.12s, border-color 0.12s; }
    .pick:active { transform: scale(0.94); }
    .pick.sel { border-color: var(--sign); box-shadow: 0 0 0 3px rgba(255,201,60,0.3), 0 8px 22px rgba(0,0,0,0.35); }
    .pick canvas { display: block; border-radius: 12px; }
    #preview { width: min(320px, 92vw); height: auto; background: #0b0e14; border-radius: 22px; box-shadow: 0 14px 40px rgba(0,0,0,0.45); }

    /* ---------- Mapa de niveles ---------- */
    .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: min(420px, 100%); }
    .lvl { border: none; border-radius: 20px; background: var(--panel); padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: var(--white); transition: transform 0.12s; position: relative; }
    .lvl:active { transform: scale(0.94); }
    .lvl-num { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); box-shadow: inset 0 -6px 0 rgba(0,0,0,0.25); }
    .lvl.locked .lvl-num { background: #414b5c !important; color: rgba(255,255,255,0.35); }
    .lvl.locked { cursor: default; }
    .lvl-stars { display: flex; gap: 2px; }
    .lvl-stars svg { width: 15px; height: 15px; }
    .lvl-stars svg.off path { fill: #414b5c; }
    .lvl .lock { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; }
    .lvl.next { outline: 4px solid var(--sign); animation: pulse 1.4s ease-in-out infinite; }

    /* ---------- Resultado de nivel ---------- */
    .big-stars { display: flex; gap: 10px; }
    .big-stars svg { width: clamp(64px, 18vw, 90px); height: auto; opacity: 0; }
    .big-stars svg.lit { opacity: 1; animation: pop 0.5s cubic-bezier(.2,1.6,.4,1) both; }
    .big-stars svg.dim { opacity: 1; }
    .big-stars svg.dim path { fill: #414b5c; }
    .stat-row { display: flex; align-items: center; gap: 22px; font-size: clamp(1.5rem, 6.5vw, 2.2rem); font-weight: 700; }
    .stat { display: flex; align-items: center; gap: 8px; }
    .stat svg { width: 1.3em; height: 1.3em; }

    /* ---------- Semáforo ---------- */
    #lights { position: absolute; inset: 0; z-index: 25; display: none; align-items: flex-start; justify-content: center; pointer-events: none; padding-top: calc(env(safe-area-inset-top, 0px) + 90px); }
    #lights.on { display: flex; }
    .light-bar { display: flex; gap: 14px; padding: 14px 18px; background: #111; border-radius: 18px; border: 4px solid #2a2a2a; }
    .lamp { width: clamp(38px, 11vw, 56px); aspect-ratio: 1; border-radius: 50%; background: #3a1010; transition: background 0.15s, box-shadow 0.15s; }
    .lamp.red { background: #ff2d2d; box-shadow: 0 0 22px #ff2d2d; }
    .lamp.green { background: #22e06d; box-shadow: 0 0 26px #22e06d; }

    /* ---------- Pregunta ---------- */
    #math-modal { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 12px; background: rgba(27,34,48,0.72); backdrop-filter: blur(3px); }
    #math-modal.active { display: flex; }
    #math-modal.ok { background: rgba(23,92,55,0.78); }
    #math-modal.bad { background: rgba(110,30,30,0.78); }
    .q-card { width: min(440px, 100%); max-height: 100%; background: var(--panel); border-radius: 26px; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: auto; }
    .q-scene { background: var(--panel-2); border-radius: 18px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; min-height: 84px; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; max-width: 150px; justify-content: center; }
    .ball { width: clamp(18px, 5vw, 26px); height: clamp(18px, 5vw, 26px); border-radius: 50%; position: relative; background: radial-gradient(circle at 35% 30%, #fff 0%, var(--c) 30%, color-mix(in srgb, var(--c) 60%, #000) 100%); box-shadow: 0 3px 5px rgba(0,0,0,0.35); }
    .ball.a { --c: var(--ball-a); } .ball.b { --c: var(--ball-b); }
    .ball.gone { opacity: 0.28; }
    .ball.gone::after { content: ''; position: absolute; inset: -2px; background: linear-gradient(45deg, transparent 44%, #ff3b3b 44%, #ff3b3b 56%, transparent 56%), linear-gradient(-45deg, transparent 44%, #ff3b3b 44%, #ff3b3b 56%, transparent 56%); opacity: 1; }
    .rows { display: flex; flex-direction: column; gap: 6px; } .row { display: flex; gap: 6px; }
    .box { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px; max-width: 110px; border: 3px dashed rgba(255,255,255,0.55); border-radius: 12px; justify-content: center; }
    .op-big { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 700; color: var(--sign); }
    .q-eq { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: clamp(2rem, 9vw, 3rem); font-weight: 700; line-height: 1; }
    .q-eq .op { color: var(--sign); } .q-eq .num.a { color: var(--ball-a); } .q-eq .num.b { color: var(--ball-b); }
    .q-eq .unknown { width: 1.3em; height: 1.3em; border-radius: 14px; border: 3px dashed var(--sign); display: inline-flex; align-items: center; justify-content: center; font-size: 0.85em; color: var(--sign); }
    .q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt { border: none; cursor: pointer; border-radius: 18px; background: linear-gradient(180deg, #3a475d, #2b3547); color: var(--white); padding: 10px 8px; min-height: 74px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 0 #161c27; transition: transform 0.1s, box-shadow 0.1s; }
    .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 #161c27; }
    .opt b { font-size: clamp(2rem, 9vw, 2.6rem); font-weight: 700; line-height: 1; min-width: 1.2em; text-align: center; }
    .dots { display: grid; grid-template-columns: repeat(5, 8px); gap: 4px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.85); display: block; }
    .opt.correct { background: linear-gradient(180deg, #4ade80, #16a34a); box-shadow: 0 6px 0 #14532d; }
    .opt.correct-answer { background: linear-gradient(180deg, #72f59a, #16a34a) !important; outline: 5px solid #d9ffe5; box-shadow: 0 0 0 5px rgba(74,222,128,.35), 0 8px 0 #14532d, 0 0 28px rgba(74,222,128,.95) !important; animation: correctGlow .55s ease-in-out infinite alternate; transform: scale(1.045); }
    .opt.wrong { background: linear-gradient(180deg, #f87171, #b91c1c); box-shadow: 0 6px 0 #7f1d1d; animation: shake 0.4s; }
    @keyframes correctGlow { from { filter:brightness(1); } to { filter:brightness(1.25); } }
    .number-scene { width:100%; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
    .number-chip { min-width:74px; padding:10px 14px; border-radius:16px; background:#344158; box-shadow:0 5px 0 #1d2635; font-size:clamp(1.7rem,7vw,2.5rem); font-weight:700; text-align:center; }
    .number-chip.a { color:var(--ball-a); } .number-chip.b { color:var(--ball-b); }
    .number-scene .op-big { min-width:32px; text-align:center; }
    #verdict { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; z-index: 22; }
    #verdict.show { display: flex; }
    #verdict svg { width: clamp(120px, 34vw, 200px); height: auto; animation: pop 0.45s cubic-bezier(.2,1.6,.4,1); filter: drop-shadow(0 12px 30px rgba(0,0,0,0.5)); }

    /* ---------- Controles táctiles ---------- */
    #mobile-controls { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: 0; right: 0; display: none; justify-content: space-between; padding: 0 14px; pointer-events: none; z-index: 10; }
    #mobile-controls.on { display: flex; }
    .mobile-btn { width: 74px; height: 74px; border-radius: 50%; background: rgba(27,34,48,0.55); border: 3px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: manipulation; backdrop-filter: blur(4px); }
    .mobile-btn svg { width: 40px; height: 40px; }
    @media (hover: hover) and (pointer: fine) { #mobile-controls.on { display: none; } }

    @media (prefers-reduced-motion: reduce) { .anim-tilt, .anim-car, .anim-pulse, .anim-blink, .lvl.next, #turbo-box.ready { animation: none; } }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->

// ===================== MOTOR DE PISTA (pseudo-3D con curvas y colinas) =====================
const SEG_LEN = 200, ROAD_W = 2000, CAM_H = 1500, DRAW_DIST = 170, RUMBLE_LEN = 3, FOV = 95;
let SX = 195, HORIZ = 280;   // escala horizontal (evita que en pantallas anchas todo se agigante) y altura del horizonte
const camDepth = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PLAYER_Z = CAM_H * camDepth;
const LANE_OFF = [-0.58, 0, 0.58];
let segments = [], trackLen = 0, finishZ = 0;

function lastY() { return segments.length ? segments[segments.length - 1].p2.world.y : 0; }
function addSegment(curve, y) {
  const n = segments.length;
  segments.push({ index: n, curve, p1: { world: { y: lastY(), z: n * SEG_LEN }, camera: {}, screen: {} }, p2: { world: { y, z: (n + 1) * SEG_LEN }, camera: {}, screen: {} }, sprites: [], cars: [], color: Math.floor(n / RUMBLE_LEN) % 2 });
}
const easeIn = (a, b, t) => a + (b - a) * t * t, easeOut = (a, b, t) => a + (b - a) * (1 - (1 - t) * (1 - t)), easeInOut = (a, b, t) => a + (b - a) * (-Math.cos(t * Math.PI) / 2 + 0.5);
function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY(), endY = startY + y * SEG_LEN, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
  for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
}
function buildTrack(L) {
  segments = [];
  addRoad(0, 60, 0, 0, 0);
  while (segments.length < L - 200) {
    const r = Math.random();
    if (r < 0.35) addRoad(rand(40, 70), rand(40, 90), rand(40, 70), (Math.random() < 0.5 ? -1 : 1) * rand(2, 5), rand(-1, 1) * rand(0, 20));
    else if (r < 0.55) addRoad(rand(30, 60), rand(30, 60), rand(30, 60), 0, (Math.random() < 0.5 ? -1 : 1) * rand(20, 45));
    else if (r < 0.7) addRoad(rand(30, 50), rand(40, 80), rand(30, 50), (Math.random() < 0.5 ? -1 : 1) * rand(3, 6), (Math.random() < 0.5 ? -1 : 1) * rand(10, 30));
    else addRoad(0, rand(40, 90), 0, 0, 0);
  }
  addRoad(40, 60, 40, 0, -lastY() / SEG_LEN);   // vuelve a nivel del suelo
  finishZ = (segments.length - 10) * SEG_LEN;
  segments[segments.length - 10].finish = true;
  addRoad(0, 250, 0, 0, 0);                     // margen después de la meta
  trackLen = segments.length * SEG_LEN;
  // decoración
  const kinds = theme.side;
  for (let n = 20; n < segments.length - 260; n += rand(3, 7)) {
    const side = Math.random() < 0.5 ? -1 : 1, kind = kinds[rand(0, kinds.length - 1)];
    segments[n].sprites.push({ kind, offset: side * (1.2 + Math.random() * 2.2), size: 0.8 + Math.random() * 0.5 });
    if (Math.random() < 0.4) segments[n + 1].sprites.push({ kind: kinds[rand(0, kinds.length - 1)], offset: -side * (1.3 + Math.random() * 2.5), size: 0.8 + Math.random() * 0.5 });
  }
  // postes y chevrones en curvas
  for (let n = 10; n < segments.length - 260; n += 6) {
    const c = segments[n].curve;
    if (Math.abs(c) > 2.5 && n % 12 === 0) segments[n].sprites.push({ kind: 'chevron', offset: (c > 0 ? -1 : 1) * 1.25, size: 1, dir: c > 0 ? 1 : -1 });
    else segments[n].sprites.push({ kind: 'post', offset: (n % 12 ? 1 : -1) * 1.15, size: 0.8 });
  }
  // estrellas
  for (let n = 80; n < segments.length - 300; n += rand(35, 60)) { const lane = rand(0, 2); for (let k = 0; k < 4; k++) segments[n + k * 3].sprites.push({ kind: 'star', offset: LANE_OFF[lane], lane, size: 1, id: n + '-' + k }); }

  // rampas: un poco más largas, ocupan varios segmentos y están separadas entre sí
  let rampN = 170 + rand(0, 60);
  while (rampN < segments.length - 340) {
    const lane = rand(0, 2);
    const rampId = 'ramp-' + rampN + '-' + lane;
    [0, 2, 4].forEach((d, i) => {
      const si = rampN + d;
      if (segments[si]) segments[si].sprites.push({ kind: 'ramp', offset: LANE_OFF[lane], lane, size: 1.12 - i * 0.07, id: rampId });
    });
    rampN += rand(270, 390);
  }

  // premios flotantes: turbo, escudo, ralentización y vida
  let bonusN = 230 + rand(0, 90);
  let bonusIndex = 0;
  const bonusCycle = ['pickupTurbo', 'pickupShield', 'pickupSlow', 'pickupTurbo', 'pickupLife', 'pickupShield', 'pickupSlow'];
  while (bonusN < segments.length - 300) {
    const lane = rand(0, 2);
    const kind = bonusCycle[bonusIndex % bonusCycle.length];
    segments[bonusN].sprites.push({
      kind,
      offset: LANE_OFF[lane],
      lane,
      size: 1,
      id: kind + '-' + bonusN + '-' + lane
    });
    bonusIndex++;
    bonusN += rand(260, 420);
  }
}
function findSegment(z) { return segments[Math.floor(z / SEG_LEN) % segments.length]; }
function project(p, camX, camY, camZ) {
  p.camera.x = (p.world.x || 0) - camX; p.camera.y = p.world.y - camY; p.camera.z = p.world.z - camZ;
  p.screen.scale = camDepth / p.camera.z;
  p.screen.x = W / 2 + p.screen.scale * p.camera.x * SX;
  p.screen.y = HORIZ - p.screen.scale * p.camera.y * (H - HORIZ);
  p.screen.w = p.screen.scale * ROAD_W * SX;
}

// ===================== MATEMÁTICA VISUAL =====================
function generateQuestion() {
  const L = currentLevel, op = L.ops[Math.floor(Math.random() * L.ops.length)];
  let a, b, answer;
  if (op === '+') {
    const min = L.n >= 8 ? Math.max(10, Math.floor(L.top * 0.18)) : 1;
    a = rand(min, L.top); b = rand(min, L.top); answer = a + b;
  } else if (op === '-') {
    const min = L.n >= 8 ? Math.max(10, Math.floor(L.top * 0.18)) : 2;
    a = rand(min + 1, L.top); b = rand(Math.max(1, Math.floor(min / 2)), a - 1); answer = a - b;
  } else if (op === '×') {
    const minFactor = L.n >= 9 ? 3 : 2;
    a = rand(minFactor, L.mul); b = rand(minFactor, L.mul); answer = a * b;
  } else {
    b = rand(2, L.div);
    const maxQuotient = L.n <= 8 ? 6 : L.n <= 10 ? 9 : 12;
    answer = rand(2, maxQuotient); a = b * answer;
  }

  const options = new Set([answer]);
  const spread = Math.max(4, Math.ceil(Math.abs(answer) * 0.18));
  let tries = 0;
  while (options.size < 4 && tries++ < 50) {
    const w = answer + rand(-spread, spread);
    if (w > 0 && w !== answer) options.add(w);
  }
  let fallback = 1;
  while (options.size < 4) {
    const w = answer + fallback++;
    if (w > 0) options.add(w);
  }
  return { op, a, b, answer, options: Array.from(options).sort(() => Math.random() - 0.5) };
}
function ball(cls) { const s = document.createElement('span'); s.className = 'ball ' + cls; return s; }
function buildScene(q) {
  const scene = document.getElementById('q-scene'); scene.innerHTML = '';
  const visualLoad = q.op === '×' ? q.a * q.b : q.op === '÷' ? q.a : Math.max(q.a, q.b);
  if (visualLoad > 25) {
    const wrap = document.createElement('div'); wrap.className = 'number-scene';
    const a = document.createElement('div'); a.className = 'number-chip a'; a.textContent = q.a;
    const op = document.createElement('div'); op.className = 'op-big'; op.textContent = q.op;
    const b = document.createElement('div'); b.className = 'number-chip b'; b.textContent = q.b;
    wrap.append(a, op, b); scene.appendChild(wrap); return;
  }
  if (q.op === '+') {
    const g1 = document.createElement('div'); g1.className = 'group'; for (let i = 0; i < q.a; i++) g1.appendChild(ball('a'));
    const g2 = document.createElement('div'); g2.className = 'group'; for (let i = 0; i < q.b; i++) g2.appendChild(ball('b'));
    const op = document.createElement('div'); op.className = 'op-big'; op.textContent = '+'; scene.append(g1, op, g2);
  } else if (q.op === '-') {
    const g = document.createElement('div'); g.className = 'group'; g.style.maxWidth = '260px';
    for (let i = 0; i < q.a; i++) { const bl = ball('a'); if (i >= q.a - q.b) bl.classList.add('gone'); g.appendChild(bl); } scene.append(g);
  } else if (q.op === '×') {
    const rows = document.createElement('div'); rows.className = 'rows';
    for (let r = 0; r < q.b; r++) { const row = document.createElement('div'); row.className = 'row'; for (let cc = 0; cc < q.a; cc++) row.appendChild(ball(r % 2 ? 'b' : 'a')); rows.appendChild(row); } scene.append(rows);

}

const TRAFFIC = ['#f4a261', '#2a9d8f', '#e9c46a', '#8d99ae', '#f1faee', '#6c757d', '#c77dff'];

function resetCars() {
  cars = []; rivals = [];
  for (let i = 0; i < currentLevel.traffic; i++) {
    const lane = rand(0, 2), col = TRAFFIC[rand(0, TRAFFIC.length - 1)];
    cars.push({ z: rand(40, segments.length - 300) * SEG_LEN, lane, offset: LANE_OFF[lane], speed: 0.28 + Math.random() * 0.22, v: Math.random() < 0.22 ? { type: 'moto', color: col } : { type: 'car', color: col }, wobble: (Math.random() - 0.5) * 0.02, crashed: false, crashT: 0, exitDir: 1 });
  }
  for (let i = 0; i < RIVAL_COUNT; i++) {

    rivals.push({ rival: true, num: i + 2, z: PLAYER_Z + (6 + i * 4) * SEG_LEN, lane, offset: LANE_OFF[lane], speed: currentLevel.maxSpeed * (0.5 + i * 0.05), v: { type: 'car', color: RIVAL_COLORS[i] }, wobble: (Math.random() - 0.5) * 0.02, jitter: 0, laneT: 0, crashed: false, crashT: 0, exitDir: 1 });
  }

function knockCarOut(car) {

  car.crashed = true;
  car.crashT = 1;
  const side = car.offset - playerX;
  car.exitDir = Math.abs(side) > 0.08 ? Math.sign(side) : (Math.random() < 0.5 ? -1 : 1);
  car.wobble = 0;

function resetKnockedCar(car, playerZ) {
  car.crashed = false; car.crashT = 0; car.wobble = (Math.random() - 0.5) * 0.02;
  car.lane = rand(0, 2); car.offset = LANE_OFF[car.lane];
  if (car.rival) {
    car.z = Math.max(positionZ + 5 * SEG_LEN, playerZ - rand(8, 16) * SEG_LEN);
    car.jitter = 0; car.laneT = 900;
  } else {
    const nz = positionZ + (DRAW_DIST + rand(25, 95)) * SEG_LEN;
    car.z = nz < finishZ - 35 * SEG_LEN ? nz : -9e9;

function updateKnockedCar(car, dt, playerZ) {
  if (!car.crashed) return false;
  car.crashT += dt;
  car.offset += car.exitDir * 0.0052 * dt;
  car.wobble += car.exitDir * 0.018 * dt;
  car.z += car.speed * 0.22 * SPEED_UNIT * dt;
  if (car.crashT > 850 || Math.abs(car.offset) > 2.25) resetKnockedCar(car, playerZ);
  return true;
}

function crash() {

  spawnParticles(W / 2 + playerX * W * 0.3, H - 90, '#ff6b6b', 20); spawnParticles(W / 2 + playerX * W * 0.3, H - 90, '#ffd166', 12);
  speed *= 0.35; turbo = 0;

    else triggerMathQuestion();

}
function launchRamp(ramp) {
  if (jumpActive || usedRamps.has(ramp.id)) return;
  usedRamps.add(ramp.id);
  jumpActive = true; jumpElapsed = 0;
  jumpDuration = 1050 + Math.min(250, speed * 120);
  jumpLift = 0; jumpRotation = 0;
  jumpSpinDir = playerTilt < -0.03 ? -1 : playerTilt > 0.03 ? 1 : (Math.random() < 0.5 ? -1 : 1);
  score += 25;

function updateJump(dt) {

  jumpElapsed += dt;

  jumpLift = Math.sin(Math.PI * p);

    jumpActive = false; jumpLift = 0; jumpRotation = 0;
    invuln = Math.max(invuln, 320);
    playTone(180, 'sine', 0.12, 0.12, 120);

function update(dt) {
  if (gameState === 'paused') return;
  time += dt; updateParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 0.002);
  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 0.004);
  if (gameState !== 'playing') { if (gameState === 'math') updateEngineSound(speed * 0.35); return; }
  if (turbo > 0) turbo = Math.max(0, turbo - dt);
  if (invuln > 0) invuln = Math.max(0, invuln - dt);
  if (shieldTime > 0) shieldTime = Math.max(0, shieldTime - dt);
  if (slowTime > 0) slowTime = Math.max(0, slowTime - dt);

  // aceleración suave hacia la velocidad objetivo
  const target = maxSpeed * (turbo > 0 ? 1.6 : baseSpeedFrac);
  speed += (target - speed) * (speed < target ? 0.0009 : 0.002) * dt;
  const playerSeg = findSegment(positionZ + PLAYER_Z);
  positionZ += speed * SPEED_UNIT * dt;
  skyOffset += playerSeg.curve * speed * dt * 0.03;

  // dirección (carriles) con suavizado, inclinación y fuerza centrífuga visual
  const targetX = LANE_OFF[playerLane];
  playerX += (targetX - playerX) * clamp(0.012 * dt, 0, 1);
  playerTilt += (((targetX - playerX) * 0.25 - playerSeg.curve * 0.012 * speed) - playerTilt) * clamp(0.01 * dt, 0, 1);
  bounce = Math.sin(time / 60) * speed * 1.2;
  updateJump(dt);

  if (tiltEnabled && !tiltCalibrating) {
    const now = performance.now();
    if (now - lastLaneChange > 330) {
      if (tiltGamma < -11 && playerLane > 0) { playerLane--; lastLaneChange = now; }
      else if (tiltGamma > 11 && playerLane < 2) { playerLane++; lastLaneChange = now; }
    }
  }

  // tráfico y rivales
  const playerZ = positionZ + PLAYER_Z;
  const othersSpeed = slowTime > 0 ? SLOW_FACTOR : 1;
  cars.forEach(car => {
    if (updateKnockedCar(car, dt, playerZ)) return;
    car.z += car.speed * othersSpeed * SPEED_UNIT * dt;
    if (car.z < positionZ - 6 * SEG_LEN) {
      const nz = positionZ + (DRAW_DIST + rand(10, 80)) * SEG_LEN;
      if (nz < finishZ - 40 * SEG_LEN) { car.z = nz; car.lane = rand(0, 2); car.offset = LANE_OFF[car.lane]; }
      else car.z = -9e9;
    }
  });
  rivals.forEach(r => {

    r.jitter += (Math.random() - 0.5) * 0.02; r.jitter = clamp(r.jitter, -0.12, 0.12);
    r.z += r.speed * (1 + r.jitter) * othersSpeed * SPEED_UNIT * dt;
    const dz = r.z - playerZ;
    if (dz < 0 && dz > -12 * SEG_LEN && Math.abs(r.offset - playerX) < 0.5) {
      if (r.laneT <= 0) { r.lane = playerLane === 1 ? (Math.random() < 0.5 ? 0 : 2) : 1; r.laneT = 1200; }
      if (dz > -4 * SEG_LEN) r.z -= (r.speed * (1 + r.jitter) * othersSpeed - speed * 0.95) * SPEED_UNIT * dt;
    }
    if (r.laneT > 0) r.laneT -= dt;

  if (!jumpActive) {

      const seg = segments[si];

        if (s.kind === 'ramp' && !usedRamps.has(s.id) && Math.abs(s.offset - playerX) < 0.34 && Math.abs(seg.p1.world.z - playerZ) < SEG_LEN * 1.7) {

    if (other.crashed) continue;

      spawnParticles(W / 2 + playerX * W * 0.3, H - 105, shieldTime > 0 ? '#62e8ff' : '#ff8a65', 14);
      if (shieldTime > 0) {

function render() {

      const sc = lerp(seg.p1.screen.scale, seg.p2.screen.scale, pct), sx = lerp(seg.p1.screen.x, seg.p2.screen.x, pct) + sc * c.offset * ROAD_W * SX, sy = lerp(seg.p1.screen.y, seg.p2.screen.y, pct);

  drawParticles();
  ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H * 0.6, H * 0.35, W / 2, H * 0.6, H * 0.85); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${theme.night ? 0.5 : 0.28})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

}
function renderSegment(seg) {
  const p1 = seg.p1.screen, p2 = seg.p2.screen, dark = seg.color;
  const r1 = p1.w / 8, r2 = p2.w / 8, l1 = p1.w / 32, l2 = p2.w / 32;

}

// ===================== ENTRADA =====================
function getScreenAngle() {
  let angle = 0;
  if (screen.orientation && Number.isFinite(Number(screen.orientation.angle))) angle = Number(screen.orientation.angle);
  else if (Number.isFinite(Number(window.orientation))) angle = Number(window.orientation);
  angle = ((angle % 360) + 360) % 360;
  return angle;
}
function screenRelativeTilt(e) {
  if (!Number.isFinite(e.beta) || !Number.isFinite(e.gamma)) return null;
  const b = e.beta * Math.PI / 180;
  const g = e.gamma * Math.PI / 180;
  const d = -getScreenAngle() * Math.PI / 180;
  // Componente izquierda/derecha respecto de la pantalla actual.
  // En vertical equivale a gamma; en los dos paisajes usa beta con signo opuesto.
  const s = Math.cos(b) * Math.sin(g) * Math.cos(d) - Math.sin(b) * Math.sin(d);
  return Math.asin(clamp(s, -1, 1)) * 180 / Math.PI;
}
function resetTiltCalibration() {
  tiltNeutral = 0; tiltFilter = 0; tiltGamma = 0;
  tiltCalibrating = true; tiltCalibSum = 0; tiltCalibCount = 0;
  lastLaneChange = performance.now();
}

async function requestGameFullscreen() {
  const target = document.getElementById('game-container');
  if (document.fullscreenElement || document.webkitFullscreenElement) return true;
  try {
    if (target.requestFullscreen) {
      await target.requestFullscreen({ navigationUI: 'hide' });
      return true;
    }
    if (target.webkitRequestFullscreen) {
      target.webkitRequestFullscreen();
      return true;
    }
  } catch (e) {}
  return false;
}
async function lockGameOrientation(mode) {

      return true;
    }
  } catch (e) {}
  return false;
}
async function activateDisplayMode(mode) {
  preferredDisplayMode = mode;
  try { localStorage.setItem('carrera-matematica-display-mode', mode); } catch (e) {}
  updateDisplayModeUI();
  // Se solicita desde el toque del usuario: necesario para fullscreen y,
  // en iPhone/iPad compatibles, para autorizar el sensor de orientación.
  await enableTilt();
  const full = await requestGameFullscreen();
  const locked = await lockGameOrientation(mode);
  resetTiltCalibration();
  setTimeout(resize, 180);
  const nombre = mode === 'landscape' ? 'horizontal' : 'vertical';
  const help = document.getElementById('displayModeHelp');
  if (locked) {
    if (help) help.textContent = 'Modo ' + nombre + ' activo. Mantén el teléfono centrado un instante.';
    showOrientationToast('Pantalla completa ' + nombre + ' · inclinación recalibrada');
  } else {
    if (help) help.textContent = 'Si no gira solo, gira el teléfono manualmente. La inclinación se adapta.';
    showOrientationToast((full ? 'Pantalla completa activa. ' : '') + 'Gira el teléfono a ' + nombre + ' si es necesario.');
  }
}
async function enableTilt() {
  if (tiltEnabled) return true;
  if (typeof DeviceOrientationEvent === 'undefined') return false;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm !== 'granted') return false;
    } catch (e) { return false; }
  }
  window.addEventListener('deviceorientation', onTilt, true);
  tiltEnabled = true;
  resetTiltCalibration();
  return true;
}
function onTilt(e) {
  const raw = screenRelativeTilt(e);
  if (!Number.isFinite(raw)) return;
  if (tiltCalibrating) {
    tiltCalibSum += raw; tiltCalibCount++;
    if (tiltCalibCount >= 8) {
      tiltNeutral = tiltCalibSum / tiltCalibCount;
      tiltFilter = 0; tiltGamma = 0; tiltCalibrating = false;
    }
    return;
  }
  let delta = raw - tiltNeutral;
  while (delta > 180) delta -= 360;
  while (delta < -180) delta += 360;
  delta = clamp(delta, -45, 45);
  tiltFilter += (delta - tiltFilter) * 0.24;
  tiltGamma = Math.abs(tiltFilter) < 4 ? 0 : tiltFilter;
}
function moveLane(dir) { if (gameState !== 'playing') return; playerLane = clamp(playerLane + dir, 0, 2); vibrate(15); }
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'p' || e.key === 'P') togglePause();
});
let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
canvas.addEventListener('touchend', e => { if (touchStartX === null) return; const dx = e.changedTouches[0].clientX - touchStartX; if (Math.abs(dx) > 30) moveLane(dx < 0 ? -1 : 1); else moveLane(e.changedTouches[0].clientX < W / 2 ? -1 : 1); touchStartX = null; });
canvas.addEventListener('mousedown', e => moveLane(e.clientX < W / 2 ? -1 : 1));
function bindMobile(btn, dir) { const go = e => { e.preventDefault(); e.stopPropagation(); moveLane(dir); }; btn.addEventListener('touchstart', go, { passive: false }); btn.addEventListener('mousedown', go); }
bindMobile(document.getElementById('btnLeft'), -1); bindMobile(document.getElementById('btnRight'), 1);
const modePortrait = document.getElementById('modePortrait');
const modeLandscape = document.getElementById('modeLandscape');
if (modePortrait) modePortrait.addEventListener('click', () => activateDisplayMode('portrait'));
if (modeLandscape) modeLandscape.addEventListener('click', () => activateDisplayMode('landscape'));
const tiltCenterBtn = document.getElementById('tiltCenterBtn');
if (tiltCenterBtn) {
  const recenter = async () => {
    await enableTilt();
    resetTiltCalibration();
    showOrientationToast('Inclinación recentrada. Mantén el teléfono recto un instante.');
  };
  tiltCenterBtn.addEventListener('click', recenter);
  tiltCenterBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') recenter(); });
}
updateDisplayModeUI();

const pauseOverlay = document.getElementById('pause-overlay');
const pauseBtn = document.getElementById('pauseBtn');
const resumeBtn = document.getElementById('resumeBtn');
function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  stopEngine();
  pauseOverlay.classList.add('active');
  pauseOverlay.setAttribute('aria-hidden', 'false');
}
function resumeGame() {
  if (gameState !== 'paused') return;
  pauseOverlay.classList.remove('active');
  pauseOverlay.setAttribute('aria-hidden', 'true');
  gameState = 'playing';
  resetTiltCalibration();
  startEngine();
  if (pendingMathAfterPause) {
    pendingMathAfterPause = false;
    setTimeout(() => { if (gameState === 'playing') triggerMathQuestion(); }, 80);
  }
}
function togglePause() { if (gameState === 'paused') resumeGame(); else pauseGame(); }
if (pauseBtn) {
  pauseBtn.addEventListener('click', pauseGame);
  pauseBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pauseGame(); } });
}
if (resumeBtn) resumeBtn.addEventListener('click', resumeGame);
// No pausamos automáticamente con visibilitychange: algunos móviles lo disparan
// durante fullscreen/orientation y podía parecer que el juego se congelaba.

const muteBtn = document.getElementById('muteBtn');
function toggleMute() { isMuted = !isMuted; document.getElementById('snd-on').style.display = isMuted ? 'none' : ''; document.getElementById('snd-off').style.display = isMuted ? '' : 'none'; if (engineGain && audioCtx) engineGain.gain.setTargetAtTime(isMuted ? 0 : 0.07, audioCtx.currentTime, 0.1); }
muteBtn.addEventListener('click', toggleMute); muteBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') toggleMute(); });
document.getElementById('startBtn').onclick = async () => {
  initAudio(); sfx.click();
  if (preferredDisplayMode) await activateDisplayMode(preferredDisplayMode);
  else await enableTilt();
  buildGarage(); showScreen('garage-screen');
};
document.getElementById('garageNext').onclick = () => { sfx.click(); buildMap(); showScreen('map-screen'); };
document.getElementById('mapGarage').onclick = () => { sfx.click(); buildGarage(); showScreen('garage-screen'); };
document.getElementById('winMap').onclick = () => { buildMap(); showScreen('map-screen'); };
document.getElementById('overMap').onclick = () => { buildMap(); showScreen('map-screen'); };
document.getElementById('winRetry').onclick = () => startLevel(currentLevel.n);
document.getElementById('winNext').onclick = () => startLevel(Math.min(currentLevel.n + 1, LEVELS.length));
document.getElementById('restartBtn').onclick = () => startLevel(currentLevel.n);
const lspediaBack = document.getElementById('lspediaBack');
if (lspediaBack) lspediaBack.addEventListener('click', () => {
  const volver = '../?vista=herramientas-jugar';
  try {
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) history.back();
    else location.href = volver;
  } catch (e) { location.href = volver; }
});

// ===================== BUCLE (dt fijo con acumulador para movimiento fluido) =====================
const STEP = 1000 / 120; let acc = 0, lastTime = 0;
function loop(ts) {
  // Programamos primero el siguiente frame: una excepción puntual no mata para siempre el bucle.
  requestAnimationFrame(loop);
  let frame = Math.min(ts - (lastTime || ts), 100); lastTime = ts;
  acc += frame; let steps = 0;
  try {
    while (acc >= STEP && steps < 12) { update(STEP); acc -= STEP; steps++; }
    if (steps >= 12 && acc > STEP * 12) acc = 0;
    render();
    if (!document.getElementById('garage-screen').hidden) { previewT += frame; drawPreview(); }
  } catch (err) {
    console.error('[Carrera Matemática] Error de fotograma:', err);
    acc = 0;
  }
}
resize();
theme = THEMES.campo; buildTrack(600); resetCars();
showScreen('start-screen');
requestAnimationFrame(loop);
</script>
